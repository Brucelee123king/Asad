plugins { id 'com.android.application' }

// Release signing: copy keystore.properties.template to keystore.properties (never commit it)
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.habittracker.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.habittracker.app'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '2.1.0'
    }
    signingConfigs {
        release {
            if (ks['storeFile']) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            // same key as release so a debug build installs over the release one
            if (ks['storeFile']) signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig ks['storeFile'] ? signingConfigs.release : null
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false }
}
