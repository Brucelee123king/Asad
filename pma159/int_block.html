<script>
(function(){var BOOTED=0;
window.__intRender=function(el){if(el)el.innerHTML='<div style="padding:40px 16px;text-align:center;color:#64748b;font-weight:700">Loading…</div>';window.__lzGet('int','24f6e67a3554').then(function(D){if(!BOOTED){BOOTED=1;BOOT(D)}if(window.__intRender!==STUB___intRender)return window.__intRender.apply(null,ARGS)}).catch(function(){if(el)el.innerHTML='<div style="padding:40px 16px;text-align:center;color:#b91c1c;font-weight:700">Could not load. Check your internet and try again.</div>'});var ARGS=arguments};var STUB___intRender=window.__intRender;setTimeout(function(){var n=0,t=setInterval(function(){n++;var ok=window.__acAdmin||(window.__acCats||[]).indexOf('int')>-1;if(ok&&window.__lzGet){clearInterval(t);window.__lzGet('int','24f6e67a3554').catch(function(){})}if(n>20)clearInterval(t)},1500)},3000);
function BOOT(D){
  var CATS=Object.keys(D.questions).filter(function(k){return D.questions[k].length});
  var CI={'About you':'🙋','Family':'👨‍👩‍👦','Education':'🎓','Army & PMA':'🪖','Pakistan & GK':'🇵🇰','Current affairs':'📰','Islamiat':'🕌','Hobbies & sports':'⚽','Situation & reasoning':'🧠','Other':'💬'};
  var ALLQ=[];CATS.forEach(function(c){D.questions[c].forEach(function(q){ALLQ.push({q:q,c:c})})});
  var LS='intv_ok',TS='intv_tip',ok={},tok={},host=null,view='hub',sub=null,mk=null,tmr=null;
  function ld(){try{ok=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){ok={}}try{tok=JSON.parse(localStorage.getItem(TS)||'{}')}catch(e){tok={}}}
  function sv(){try{localStorage.setItem(LS,JSON.stringify(ok));localStorage.setItem(TS,JSON.stringify(tok))}catch(e){}}
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function hid(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return 'q'+(h>>>0).toString(36)}
  function readyPct(){var n=ALLQ.filter(function(x){return ok[hid(x.q)]}).length;return Math.round(100*n/Math.max(1,ALLQ.length))}
  var TIPN=0;Object.keys(D.tips).forEach(function(k){TIPN+=D.tips[k].length});
  var CARDS=[
    ['mock','🎤','Mock Interview','Sit in the real room: one question at a time, with a timer.','linear-gradient(120deg,#7f1d1d,#dc2626 55%,#f97316)','10 random questions','FUN'],
    ['qb','❓','Question Bank','Every question asked, in groups. Tick the ones you can answer.','linear-gradient(120deg,#1e3a8a,#2563eb 55%,#38bdf8)',ALLQ.length+' questions',''],
    ['ans','💡','Model Answers','How to answer the most common questions.','linear-gradient(120deg,#14532d,#16a34a 55%,#84cc16)',Object.keys(D.answers).length+' answers',''],
    ['xp','📖','Real Experiences','What happened in real candidates\' interviews.','linear-gradient(120deg,#4c1d95,#7c3aed 55%,#c084fc)',D.experiences.length+' experiences',''],
    ['es','✍️','Essay Topics','English and Urdu essay topics. Try the random topic challenge.','linear-gradient(120deg,#78350f,#d97706 55%,#fbbf24)',D.essays.length+' English • '+(D.urdu||[]).length+' Urdu','FUN'],
    ['tips','✅','Tips & Checklist','Before, inside the room and while answering. Tick as you go.','linear-gradient(120deg,#134e4a,#0d9488 55%,#5eead4)',TIPN+' tips','']];
  function hub(){var p=readyPct();
    return '<div class="ir"><div>⭐ INITIAL INTERVIEW ⭐</div><p>Prepare step by step. Your progress is saved on this phone.</p></div>'+
      '<div class="rd"><b>🎯 Your interview readiness</b><small>'+p+'%</small><div class="bar"><i style="width:'+p+'%"></i></div></div>'+
      '<div class="hub">'+CARDS.map(function(c){return '<button type="button" class="hc" data-iv="'+c[0]+'" style="background:'+c[4]+'">'+(c[6]?'<span class="tag">'+c[6]+'</span>':'')+'<span class="t"><span class="e">'+c[1]+'</span>'+c[2]+'</span><span class="s">'+c[3]+'</span><span class="n">'+c[5]+'</span><span class="o">Open →</span></button>'}).join('')+'</div>'}
  function head(c){return '<button type="button" class="bk" data-ib="1">← Back</button><div class="hd" style="background:'+c[4]+'"><h3>'+c[1]+' '+c[2]+'</h3><p>'+c[3]+'</p></div>'}
  function card(k){return CARDS.filter(function(c){return c[0]===k})[0]}
  function qrow(q,withHint){var id=hid(q),h=D.answers[q];return '<div class="q'+(ok[id]?' ok':'')+'"><button type="button" class="ck" data-qk="'+id+'">'+(ok[id]?'✓':'')+'</button><div class="qt">'+esc(q)+(h?(withHint?'<span class="hn">💡 '+esc(h)+'</span>':'<br><button type="button" class="hb" data-hn="1">💡 Show answer tip</button><span class="hn" hidden>💡 '+esc(h)+'</span>'):'')+'</div></div>'}
  var QC=null,XI=0,XF=0,AI=0,AV=0,AT=null;
  var CC={'About you':'#2563eb','Family':'#7c3aed','Education':'#0d9488','Army & PMA':'#16a34a','Pakistan & GK':'#dc2626','Current affairs':'#d97706','Islamiat':'#0891b2','Hobbies & sports':'#db2777','Situation & reasoning':'#4f46e5','Other':'#475569'};
  function qb(){var f=(sub||'').toLowerCase();var h=head(card('qb'))+'<input class="srch" type="search" placeholder="🔍 Search a question" value="'+esc(sub||'')+'" data-is="1">';
    if(f||QC){var cats=QC&&!f?[QC]:CATS;if(QC&&!f)h+='<button type="button" class="bk" data-qcb="1">← All categories</button>';
      return h+cats.map(function(c){var L=D.questions[c].filter(function(q){return !f||q.toLowerCase().indexOf(f)>-1});if(!L.length)return '';var n=L.filter(function(q){return ok[hid(q)]}).length,p=Math.round(100*n/L.length);
        return '<div class="cat open"><button type="button" data-ic="1"><span class="ring" style="--p:'+p+'"><span>'+p+'%</span></span><span style="font-size:20px">'+(CI[c]||'💬')+'</span><b>'+esc(c)+'</b><small>'+n+'/'+L.length+'</small></button><div class="ql">'+L.map(function(q){return qrow(q,false)}).join('')+'</div></div>'}).join('')}
    return h+'<div class="qt">'+CATS.map(function(c){var L=D.questions[c],n=L.filter(function(q){return ok[hid(q)]}).length,p=Math.round(100*n/L.length),col=CC[c]||'#2563eb';
      return '<button type="button" class="qtile" data-qc="'+esc(c)+'"><span class="qr" style="background:conic-gradient('+col+' '+p+'%,var(--l) 0)"><span>'+(CI[c]||'💬')+'</span></span><b>'+esc(c)+'</b><small>'+L.length+' Qs • '+p+'%</small></button>'}).join('')+'</div>'}
  function ans(){var K=Object.keys(D.answers),q=K[AI],id=hid(q);
    return head(card('ans'))+'<div class="pm"><div class="c">QUESTION '+(AI+1)+' OF '+K.length+'</div><div class="mic">🎤</div><div class="qq">'+esc(q)+'</div>'+
      '<div class="tmr" id="ivAt">'+(AT===null?'0:30':fmt(AT))+'</div><p class="hint">Answer out loud first, then reveal</p></div>'+
      '<div class="pa'+(AV?' on':'')+'">💡 '+esc(D.answers[q])+'</div>'+
      (AV?'':'<button type="button" class="big" data-arv="1">👁 Reveal model answer</button>')+
      '<button type="button" class="big g" data-ack="1" style="'+(ok[id]?'':'opacity:.9')+'">'+(ok[id]?'✅ I can answer this':'✓ Mark: I can answer this')+'</button>'+
      '<div class="row"><button type="button" class="big wht" data-anx="-1">◀ Prev</button><button type="button" class="big wht" data-anx="1">Next ▶</button></div>'}
  function xp(){var L=D.experiences,e=L[XI],r=/^rec/i.test(e.result)?'y':/^not/i.test(e.result)?'n':'u',A=e.asked||[],T=e.tips||[];
    return head(card('xp'))+'<div class="xn">◀ swipe ▶ • '+(XI+1)+' / '+L.length+'</div><div class="xd" data-xsw="1"><div class="xb2"></div><div class="xb1"></div><div class="xc">'+
      '<div class="xh"><div class="xi">🪖</div><b>'+esc(e.title)+'</b><span class="r '+r+'">'+(r==='y'?'✅ Recommended':r==='n'?'❌ Not recommended':'• Result not shared')+'</span></div>'+
      '<div class="xs"><div><b>'+A.length+'</b><small>questions</small></div><div><b>'+T.length+'</b><small>tips</small></div></div>'+
      '<div class="xq"><h5>'+(XF?'📝 WHAT HAPPENED':'🔥 HARDEST QUESTIONS')+'</h5>'+(XF?'<p>'+esc(e.summary)+'</p><h5>❓ ALL QUESTIONS ASKED</h5>'+A.map(function(q){return '<div class="xqq">'+esc(q)+'</div>'}).join('')+(T.length?'<h5>💡 TIPS</h5>'+T.map(function(q){return '<div class="xqq tp2">'+esc(q)+'</div>'}).join(''):''):A.slice(0,3).map(function(q){return '<div class="xqq">'+esc(q)+'</div>'}).join(''))+'</div>'+
      '<button type="button" class="big xr" data-xfull="1">'+(XF?'▲ Show less':'📖 Read full story')+'</button></div></div>'+
      '<div class="row"><button type="button" class="big wht" data-xnx="-1">◀ Prev</button><button type="button" class="big xr" data-xnx="1">Next ▶</button></div>'}
  var EL='en';
  function es(){var s=sub,ur=EL==='ur',L=ur?(D.urdu||[]):D.essays;
    var tabs='<div class="et"><button type="button" data-el="en" class="'+(ur?'':'on')+'">🇬🇧 English essay <small>'+D.essays.length+'</small></button><button type="button" data-el="ur" class="'+(ur?'on':'')+'">🇵🇰 اردو مضمون <small>'+(D.urdu||[]).length+'</small></button></div>';
    var top=s?'<div class="mk"><div class="c">'+(s.ur?'آپ کا موضوع':'YOUR TOPIC')+'</div><div class="qq'+(s.ur?' urd':'')+'">'+esc(s.t)+'</div><div class="tm'+(s.left<60?' w':'')+'" id="ivTm">'+fmt(s.left)+'</div><p style="color:var(--m);font-size:12.5px;margin:4px 0 0">'+(s.ur?'<span class="urd">تمہید ← تین نکات ← اختتام</span>':'Write: introduction → 3 points → conclusion')+'</p></div><div class="row"><button type="button" class="big g" data-er="1">🎲 New topic</button><button type="button" class="big r" data-es="1">⏹ Stop</button></div>'
      :'<button type="button" class="big" data-er="1">🎲 '+(ur?'Random Urdu topic (15-minute challenge)':'Random English topic (15-minute challenge)')+'</button>';
    var tp=ur&&D.urduTips?'<div class="tg"><h4>✍️ Urdu essay tips</h4>'+D.urduTips.map(function(t){return '<div class="tp" style="cursor:default"><span>•</span><span>'+esc(t)+'</span></div>'}).join('')+'</div>':'';
    return head(card('es'))+tabs+top+tp+L.map(function(t,i){return '<button type="button" class="es'+(ur?' ur':'')+'" data-et="'+i+'"><i>'+(i+1)+'</i><span>'+esc(t)+'</span></button>'}).join('')}
  function tips(){var C=['#fef08a','#bbf7d0','#bfdbfe','#fecdd3','#fed7aa','#ddd6fe'],R=[-2,1.5,1,-1.5,-1,2],n=0,tot=0;Object.keys(D.tips).forEach(function(g){D.tips[g].forEach(function(t){tot++;if(tok[hid(g+t)])n++})});
    return head(card('tips'))+'<div class="sn0">📌 Tap a note to mark it done • <b>'+n+' / '+tot+'</b></div>'+Object.keys(D.tips).map(function(g,gi){return '<h4 class="snh">'+['🎒','🚪','💬','✍️'][gi%4]+' '+esc(g)+'</h4><div class="sng">'+D.tips[g].map(function(t,i){var id=hid(g+t);return '<button type="button" class="sn'+(tok[id]?' ok':'')+'" data-tk="'+id+'" style="background:'+C[(i+gi)%6]+';transform:rotate('+R[i%6]+'deg)"><i>'+(i+1)+'.</i>'+esc(t)+'<span class="snk">✅</span></button>'}).join('')+'</div>'}).join('')}
  function fmt(s){s=Math.max(0,s|0);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
  function newMock(){var pool=ALLQ.slice(),pick=[];var intro=pool.filter(function(x){return /introduce yourself|tell me about yourself/i.test(x.q)})[0];if(intro){pick.push(intro);pool.splice(pool.indexOf(intro),1)}
    while(pick.length<10&&pool.length){var i=Math.floor(Math.random()*pool.length);pick.push(pool.splice(i,1)[0])}mk={qs:pick,i:0,res:[],left:45,hint:false}}
  function mock(){if(!mk)newMock();var c=card('mock');
    if(mk.i>=mk.qs.length){var a=mk.res.filter(function(x){return x==='d'}).length;
      return head(c)+'<div class="mk"><div class="done">'+(a>=8?'🏆':a>=5?'👍':'💪')+'</div><div class="qq">You answered '+a+' of '+mk.qs.length+'</div><p style="color:var(--m);font-size:13.5px">'+(a>=8?'Excellent! You are ready. Keep practising daily.':a>=5?'Good! Practise the skipped questions in the Question Bank.':'Keep going. Read Model Answers, then try again.')+'</p></div><button type="button" class="big" data-mn="1">🔁 New mock interview</button>'}
    var x=mk.qs[mk.i],h=D.answers[x.q];
    return head(c)+'<div class="dots">'+mk.qs.map(function(_,j){return '<i class="'+(j<mk.i?(mk.res[j]==='d'?'d':'s'):j===mk.i?'c':'')+'"></i>'}).join('')+'</div>'+
      '<div class="mk"><div class="c">QUESTION '+(mk.i+1)+' OF '+mk.qs.length+'</div><div class="qq">"'+esc(x.q)+'"</div><span class="ct">'+(CI[x.c]||'💬')+' '+esc(x.c)+'</span><div class="tm'+(mk.left<=10?' w':'')+'" id="ivTm">'+fmt(mk.left)+'</div><p style="color:var(--m);font-size:12.5px;margin:0">Answer out loud, like in the real room</p>'+(h?(mk.hint?'<span class="hn">💡 '+esc(h)+'</span>':'<br><button type="button" class="hb" data-mh="1" style="font-size:13px;font-weight:800;color:#4f46e5;background:none;border:0">💡 Show answer tip</button>'):'')+'</div>'+
      '<div class="row"><button type="button" class="big g" data-ma="d">✓ I answered</button><button type="button" class="big r" data-ma="s">↷ Skip</button></div>'}
  function tick(){clearInterval(tmr);tmr=null;if(view==='mock'&&mk&&mk.i<mk.qs.length){tmr=setInterval(function(){if(!host||view!=='mock'){clearInterval(tmr);return}mk.left--;var e=host.querySelector('#ivTm');if(e){e.textContent=fmt(mk.left);e.classList.toggle('w',mk.left<=10)}if(mk.left<=0){clearInterval(tmr)}},1000)}
    if(view==='es'&&sub&&sub.t){tmr=setInterval(function(){if(!host||view!=='es'||!sub){clearInterval(tmr);return}sub.left--;var e=host.querySelector('#ivTm');if(e){e.textContent=fmt(sub.left);e.classList.toggle('w',sub.left<60)}if(sub.left<=0)clearInterval(tmr)},1000)}}
  function draw(keep){if(!host)return;var y=window.scrollY;var lb=host.previousElementSibling;if(lb&&lb.classList&&lb.classList.contains('lback'))lb.style.display=view==='hub'?'':'none';host.innerHTML='<div id="intP">'+(view==='hub'?hub():view==='qb'?qb():view==='ans'?ans():view==='xp'?xp():view==='es'?es():view==='tips'?tips():mock())+'</div>';if(!keep)window.scrollTo(0,0);else window.scrollTo(0,y);tick()}
  var atm=null;function atick(){clearInterval(atm);if(view!=='ans'||AV)return;AT=30;atm=setInterval(function(){if(view!=='ans'||AV||!host){clearInterval(atm);return}AT=Math.max(0,AT-1);var el=host.querySelector('#ivAt');if(el){el.textContent=fmt(AT);el.classList.toggle('w',AT<=5)}if(AT<=0)clearInterval(atm)},1000)}
  function go(v){view=v;sub=null;QC=null;XF=0;AV=0;AT=null;if(v==='ans')setTimeout(atick,0);if(v==='mock')mk=null;draw();try{history.pushState({n:1,iv:1},'')}catch(e){}}
  window.__intRender=function(el){ld();host=el;view='hub';sub=null;draw();
    if(!el.__iv){el.__iv=1;el.addEventListener('click',onClick);var sx=0,sy=0;el.addEventListener('touchstart',function(e){if(view!=='xp')return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});el.addEventListener('touchend',function(e){if(view!=='xp'||!sx)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=0;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5&&e.target.closest&&e.target.closest('.xd')){var L=D.experiences.length;XI=(XI+(dx<0?1:-1)+L)%L;XF=0;draw()}},{passive:true});el.addEventListener('input',function(e){if(e.target.getAttribute('data-is')&&view==='qb'){sub=e.target.value;var p=e.target.selectionStart;draw(true);var n=host.querySelector('[data-is]');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(x){}}}})}};
  window.__intBack=function(){if(!host||!document.getElementById('intP')||view==='hub')return false;if(view==='qb'&&QC){QC=null;draw();return true}view='hub';sub=null;draw();return true};
  window.__intActive=function(){return !!(host&&document.getElementById('intP'))};
  function onClick(e){var t=e.target;if(!document.getElementById('intP'))return;var b;
    if((b=t.closest('[data-iv]'))){go(b.getAttribute('data-iv'));return}
    if(t.closest('[data-ib]')){if(history.state&&history.state.iv)history.back();else{view='hub';draw()}return}
    if((b=t.closest('[data-qk]'))){var id=b.getAttribute('data-qk');if(ok[id])delete ok[id];else ok[id]=1;sv();var r=b.closest('.q');r.classList.toggle('ok',!!ok[id]);b.textContent=ok[id]?'✓':'';var cat=b.closest('.cat');if(cat&&view==='qb'){var qs=cat.querySelectorAll('.q'),n=cat.querySelectorAll('.q.ok').length,p=Math.round(100*n/qs.length);var rg=cat.querySelector('.ring');rg.style.setProperty('--p',p);rg.querySelector('span').textContent=p+'%';cat.querySelector('small').textContent=n+'/'+qs.length}return}
    if((b=t.closest('[data-qc]'))){QC=b.getAttribute('data-qc');draw();return}
    if(t.closest('[data-qcb]')){QC=null;draw();return}
    if((b=t.closest('[data-xnx]'))){var L=D.experiences.length;XI=(XI+(+b.getAttribute('data-xnx'))+L)%L;XF=0;draw();return}
    if(t.closest('[data-xfull]')){XF=XF?0:1;draw(true);return}
    if((b=t.closest('[data-anx]'))){var K=Object.keys(D.answers).length;AI=(AI+(+b.getAttribute('data-anx'))+K)%K;AV=0;AT=null;draw();atick();return}
    if(t.closest('[data-arv]')){AV=1;AT=null;clearInterval(atm);draw(true);return}
    if(t.closest('[data-ack]')){var q=Object.keys(D.answers)[AI],id2=hid(q);if(ok[id2])delete ok[id2];else ok[id2]=1;sv();draw(true);return}
    if((b=t.closest('[data-hn]'))){var s=b.nextElementSibling;if(s)s.hidden=false;b.remove();return}
    if((b=t.closest('[data-ic]'))){b.parentElement.classList.toggle('open');return}
    if((b=t.closest('[data-tk]'))){var k=b.getAttribute('data-tk');if(tok[k])delete tok[k];else tok[k]=1;sv();b.classList.toggle('ok',!!tok[k]);var ck=b.querySelector('.ck');if(ck)ck.textContent=tok[k]?'✓':'';if(view==='tips')draw(true);return}
    if((b=t.closest('[data-el]'))){EL=b.getAttribute('data-el');sub=null;draw(true);return}
    if(t.closest('[data-er]')){var LL=EL==='ur'?D.urdu:D.essays,i=Math.floor(Math.random()*LL.length);sub={t:LL[i],left:900,ur:EL==='ur'};draw();return}
    if((b=t.closest('[data-et]'))){var LL2=EL==='ur'?D.urdu:D.essays;sub={t:LL2[+b.getAttribute('data-et')],left:900,ur:EL==='ur'};draw();return}
    if(t.closest('[data-es]')){sub=null;draw();return}
    if(t.closest('[data-mh]')){mk.hint=true;var y=window.scrollY;draw(true);return}
    if((b=t.closest('[data-ma]'))){var a=b.getAttribute('data-ma');var x=mk.qs[mk.i];mk.res.push(a);if(a==='d'){ok[hid(x.q)]=1;sv()}mk.i++;mk.left=45;mk.hint=false;draw();return}
    if(t.closest('[data-mn]')){mk=null;draw();return}
  }
}
})();
</script>
