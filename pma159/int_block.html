<style id="intCss">
/* Initial Interview page (main page card 02): hub of 6 sections in the Initial PMA category style + fun practice modes */
#intP{--b:#fff;--t:#0f172a;--m:#64748b;--l:#e2e8f0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--t);text-align:left;padding-bottom:30px}
html.dark #intP{--b:#111c33;--t:#f1f5f9;--m:#94a3b8;--l:#1e293b}
#intP button{font:inherit;color:inherit;cursor:pointer;text-align:left}
#intP .ir{display:flex;flex-direction:column;align-items:center;margin:4px 0 14px}
#intP .ir div{background:linear-gradient(135deg,#2e4a1e,#4d7c2a);color:#f1d27a;font-weight:900;font-size:18px;padding:11px 28px;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);letter-spacing:.04em;white-space:nowrap}
#intP .ir p{margin:8px 0 0;color:var(--m);font-size:13px;text-align:center}
#intP .rd{background:var(--b);border:1px solid var(--l);border-radius:18px;padding:12px 14px;margin-bottom:14px;box-shadow:0 6px 16px rgba(15,23,42,.06)}
#intP .rd b{font-size:14px}#intP .rd small{color:var(--m);font-size:12px;float:right;font-weight:800}
#intP .bar{height:10px;border-radius:99px;background:var(--l);overflow:hidden;margin-top:8px}#intP .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#16a34a,#84cc16);transition:width .4s}
#intP .hub{display:grid;grid-template-columns:1fr;gap:14px}
#intP .hc{display:flex;flex-direction:column;gap:6px;color:#fff;border-radius:18px;padding:18px;border:3px solid #f1d27a;box-shadow:0 0 0 2px rgba(201,164,58,.4),0 10px 24px rgba(0,0,0,.15);position:relative;overflow:hidden;width:100%}
#intP .hc:active{transform:scale(.985)}
#intP .hc .t{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800}
#intP .hc .e{flex:none;width:46px;height:46px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 0 3px rgba(255,255,255,.4)}
#intP .hc .s{font-size:13.5px;opacity:.92}#intP .hc .n{font-size:12px;font-weight:700;opacity:.85}#intP .hc .o{font-size:14px;font-weight:800;margin-top:2px}
#intP .hc .tag{position:absolute;right:14px;top:14px;background:#f1d27a;color:#3b2a05;font-size:10.5px;font-weight:900;border-radius:99px;padding:3px 9px;letter-spacing:.06em}
#intP .bk{display:inline-flex;align-items:center;gap:6px;background:var(--b);border:1px solid var(--l);border-radius:99px;padding:8px 14px;font-weight:800;margin-bottom:12px;font-size:14px}
#intP .hd{border-radius:18px;padding:16px;color:#fff;margin-bottom:12px;border:3px solid #f1d27a}
#intP .hd h3{margin:0;font-size:20px;font-weight:800}#intP .hd p{margin:4px 0 0;font-size:13px;opacity:.92}
#intP .cat{background:var(--b);border:1px solid var(--l);border-radius:16px;margin-bottom:10px;overflow:hidden}
#intP .cat>button{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;background:none;border:0}
#intP .cat>button b{flex:1;font-size:15px}#intP .cat>button small{color:var(--m);font-size:12px;font-weight:800}
#intP .ring{--p:0;width:34px;height:34px;border-radius:50%;background:conic-gradient(#16a34a calc(var(--p)*1%),var(--l) 0);display:flex;align-items:center;justify-content:center;flex:none}
#intP .ring span{width:26px;height:26px;border-radius:50%;background:var(--b);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:900}
#intP .cat .ql{display:none;padding:0 10px 10px}#intP .cat.open .ql{display:block}
#intP .q{display:flex;gap:10px;align-items:flex-start;padding:10px 6px;border-top:1px dashed var(--l)}
#intP .q .ck{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid #94a3b8;background:none;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:15px;padding:0}
#intP .q.ok .ck{background:#16a34a;border-color:#16a34a}
#intP .q .qt{flex:1;font-size:14px;line-height:1.45}#intP .q.ok .qt{color:var(--m)}
#intP .q .hn{display:block;margin-top:6px;font-size:12.5px;color:#166534;background:#dcfce7;border-radius:10px;padding:7px 9px}html.dark #intP .q .hn{background:#14321f;color:#bbf7d0}
#intP .hn[hidden]{display:none!important}
#intP .q .hb{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:800;color:#4f46e5;background:none;border:0;padding:0}html.dark #intP .q .hb{color:#a5b4fc}
#intP .xp{background:var(--b);border:1px solid var(--l);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 6px 16px rgba(15,23,42,.06)}
#intP .xp .h{display:flex;justify-content:space-between;gap:8px;align-items:center}#intP .xp .h b{font-size:15px}
#intP .xp .r{font-size:11px;font-weight:800;border-radius:99px;padding:3px 9px;white-space:nowrap}
#intP .xp .r.y{background:#dcfce7;color:#166534}#intP .xp .r.n{background:#fee2e2;color:#991b1b}#intP .xp .r.u{background:#f1f5f9;color:#64748b}
#intP .xp p{margin:8px 0;font-size:13.5px;line-height:1.55;color:var(--m)}
#intP .xp h5{margin:10px 0 4px;font-size:12.5px;letter-spacing:.04em;color:#a16207}
#intP .xp ul{margin:0;padding-left:20px;font-size:13.5px;line-height:1.5}#intP .xp li{margin:2px 0}
#intP .es{display:flex;gap:10px;align-items:center;background:var(--b);border:1px solid var(--l);border-radius:14px;padding:11px 12px;margin-bottom:8px;width:100%}
#intP .es i{font-style:normal;flex:none;width:28px;height:28px;border-radius:50%;background:#fef3c7;color:#92400e;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center}
#intP .es span{flex:1;font-size:14px}
#intP .big{display:block;width:100%;text-align:center!important;font-weight:900!important;font-size:16px;border:0;border-radius:16px;padding:14px;color:#2b1d02!important;background:linear-gradient(120deg,#b8860b,#ffe9a0 50%,#d4a017);box-shadow:0 8px 20px rgba(184,134,11,.3);margin-bottom:12px}
#intP .big.g{color:#fff!important;background:linear-gradient(120deg,#166534,#22c55e)}#intP .big.r{color:#fff!important;background:linear-gradient(120deg,#9f1239,#e11d48)}
#intP .row{display:flex;gap:10px}#intP .row .big{flex:1}
#intP .mk{background:var(--b);border:1px solid var(--l);border-radius:22px;padding:20px 16px;text-align:center;margin-bottom:12px;box-shadow:0 10px 24px rgba(15,23,42,.08)}
#intP .mk .c{font-size:12px;font-weight:800;color:#a16207;letter-spacing:.08em}
#intP .mk .qq{font-size:20px;font-weight:800;margin:14px 0;line-height:1.4}
#intP .mk .ct{display:inline-block;font-size:11.5px;font-weight:800;background:#ede9fe;color:#5b21b6;border-radius:99px;padding:3px 10px}
#intP .mk .tm{font-size:34px;font-weight:900;color:#16a34a;margin:6px 0}#intP .mk .tm.w{color:#dc2626}
#intP .mk .hn{display:block;margin-top:10px;font-size:13.5px;color:#166534;background:#dcfce7;border-radius:12px;padding:10px;text-align:left}
#intP .dots{display:flex;gap:5px;justify-content:center;margin-bottom:12px}#intP .dots i{width:9px;height:9px;border-radius:50%;background:var(--l)}#intP .dots i.d{background:#16a34a}#intP .dots i.s{background:#f59e0b}#intP .dots i.c{background:#4f46e5;transform:scale(1.3)}
#intP .tg{background:var(--b);border:1px solid var(--l);border-radius:16px;padding:12px 14px;margin-bottom:12px}
#intP .tg h4{margin:0 0 6px;font-size:15px}
#intP .tp{display:flex;gap:10px;align-items:flex-start;width:100%;background:none;border:0;padding:8px 0;border-top:1px dashed var(--l);font-size:14px;line-height:1.45}
#intP .tp .ck{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid #94a3b8;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:13px}
#intP .tp.ok .ck{background:#16a34a;border-color:#16a34a}#intP .tp.ok span{color:var(--m);text-decoration:line-through}
#intP .srch{width:100%;height:44px;border-radius:99px;border:1px solid var(--l);background:var(--b);color:var(--t);padding:0 16px;font-size:14.5px;margin-bottom:12px;font-family:inherit}
#intP .done{font-size:44px;text-align:center}
</style>
<script>
(function(){
  var D={"experiences":[{"title":"PMA 152 • Karachi centre","result":"Recommended","summary":"Only 4 out of 25 candidates were selected that day. The officer asked the meaning of his name, asked him to introduce himself, and asked why his grades were so low. He honestly said it was his own fault because he gave more time to sports, and he did not blame his school or college. The officer then asked quick estimation questions and talked about his sports for 3-4 minutes. He believes neat dress, eye contact, a smile and fluent English got him easy questions while others got hard geography questions.","asked":["What is the meaning of your name?","Please introduce yourself.","Your grades are very low. Why?","If I ask you to go and touch the Arabian Sea and come back, how much time will it take?","What is the length and width of the table in front of me? Show me.","Which sports do you play? (detailed questions on sports)"],"tips":["If your marks are low, accept it honestly; do not blame your school, college or anyone else.","Keep eye contact and a natural smile throughout the interview.","Wear a light-coloured full-sleeve formal shirt (sleeves not folded), dark dress pants and formal lace-up shoes; no jeans or loafers.","Be ready for practical estimation questions like distance, time or the size of an object."]},{"title":"PMA 152 • Quetta centre","result":"Recommended","summary":"He wrote an English essay on 'A wealthy life is better than a peaceful life' and an Urdu essay on the role of teacher, student and parents in education. A Lieutenant Colonel and a Major asked about his district, his college and why he wants to join the Army. When asked about the Indus civilization, he honestly said he is weak in Pakistan Studies and asked for science questions, and the panel agreed. The Major also asked why he did not go for MDCAT, about his time as house prefect, and what big thing he wants to do for his family, province and country.","asked":["Introduce yourself.","Tell me about your district.","Tell me about your college.","Why do you want to join the Pakistan Army?","What is the Indus civilization?","What are algae, fungi, chromosomes, ions and ionic bonds?","What is Newton's second law and its equation?","Your favourite subject is biology, so why did you not appear in the MDCAT?","You were a house prefect. Tell me about leadership at your level.","What big thing do you want to do for your family, your province and the people of Pakistan?"],"tips":["If you are weak in one area, say so honestly and offer your strong subject; the panel may accept it.","Be ready to explain any leadership role (like prefect) written in your form.","Prepare a clear answer for why you chose the Army over other careers."]},{"title":"PMA 151 • Rawalpindi centre","result":"Recommended","summary":"He wrote an English and an Urdu essay before the interview. The board was a Lieutenant Colonel and a female psychologist Major. He knocked, asked permission, greeted, sat straight and kept eye contact. The Colonel asked about his area, his father's job, his old schools and boarding-school life, then told him to speak for 2 minutes on hostel life, followed by a few quick GK questions. The psychologist asked nothing.","asked":["Which area are you from?","What does your father do and where is he posted?","Tell us about your previous schools and colleges.","Speak for 2 minutes on the impact of hostel life.","What is the full form of OGRA?","What is the currency of Bangladesh?","What is the currency of Iran?","What is the currency of Gilgit-Baltistan? (trick question)","Who is the Governor of Punjab?","What is 5% of 500?"],"tips":["Knock, ask permission, greet with Assalam-o-Alaikum and sit only when told.","Sit straight, do not cross your legs or lock your hands, and look the interviewer in the eye.","Confidence and body language matter more than the number of right answers.","Learn currencies, capitals, and the names of the President, PM, Chief Ministers and Governors."]},{"title":"PMA 151 • Faisalabad centre","result":"Recommended","summary":"A Lieutenant Colonel and a Captain took the interview. After his introduction, the Lt Col asked about his father, siblings, three strengths, three weaknesses and his plan B. Because he said he had no interest in football, he was tested on current sports news like the FIFA World Cup and a cricket series in Pakistan. The Captain then asked questions from his bio data form. He was nervous at first, but the panel made him comfortable.","asked":["Introduce yourself.","Tell me about your father.","Do you have any siblings? What are their names and what do they do?","Tell me three strengths of yours.","Tell me three weaknesses of yours.","What is your plan B?","Are you interested in football? Where is the FIFA World Cup being held?","What is the capital of that country?","Which teams reached the World Cup semi-final?","Which foreign cricket team is touring Pakistan now, and what was the last match result?","Questions from your bio data form"],"tips":["Follow current news, including big sports events, even if they are not your hobby.","Prepare three strengths and three weaknesses in advance.","Nervousness usually goes away after the first few questions, so keep going calmly."]},{"title":"PMA 151 • Multan centre","result":"Recommended","summary":"He wrote an English essay on unemployment and an Urdu essay on the qualities of a good student. He asked permission to enter, stood beside the chair and sat only when told. The Colonel asked him to introduce himself, then asked biology questions and questions on Pakistan's constitutions. The psychologist asked what he would do if not recommended and who Edhi was. He left politely with a smile.","asked":["Introduce yourself.","What are the longest and smallest bones of the human body?","What are the types of blood cells?","What is the difference between a plant cell and an animal cell?","Who was the first President of Pakistan?","How many constitutions has Pakistan had?","What is the difference between the 1962 and 1973 constitutions?","If we do not recommend you, what will you do?","Who was Abdul Sattar Edhi?"],"tips":["Ask 'May I come in, sir?', stand beside the chair and sit only when told.","Revise the basics of your FSc subjects, because the Colonel may ask from them.","End with a polite thank you and salam."]},{"title":"PMA 151 • Peshawar centre (Hafiz, economics student)","result":"Not recommended","summary":"He wrote an English essay on whether college students should choose their own subjects and an Urdu essay on new technology making people lazy. The Colonel asked how many times he had applied and why he changed his centre. He could not explain the difference between a credit and a debit card even though he studies economics, and kept saying sorry. Because he wrote that he is a Hafiz, the psychologist asked Islamic questions, including the meaning of a Quran word, which he could not answer. He was not recommended.","asked":["What are you doing these days?","How many times have you applied for army tests?","Why did you change your test centre?","What is the difference between a credit card and a debit card?","What do you know about fighter pilots?","What do you think about travelling by train?","What is democracy?","Are you a Hafiz-e-Quran?","What is the meaning of 'Wal-yatalattaf', the middle word of the Quran?","What was the real name of Hazrat Abu Bakr (RA)?","After how many years did Hazrat Yusuf (AS) meet his father?"],"tips":["Know the basics of your own subject; failing an easy question from your own field hurts a lot.","If you write that you are a Hafiz, expect Quran questions and learn the meaning of what you memorised.","Saying 'sorry' again and again gives a bad impression; prepare well.","Have a clear reason ready if you changed your centre or applied many times."]},{"title":"PMA 152 • South Waziristan candidate","result":"Recommended","summary":"He wrote 'Knowledge is power' in English and the importance of religion in human life in Urdu. A Colonel asked where he is from, where he lives now, and about his education and siblings. A Major then asked general knowledge questions, and he politely said sorry for one he did not know. At the end the Colonel asked how he thought his interview went and wished him luck.","asked":["Where are you from, and where are you settled now?","Introduce yourself.","Tell me about your education.","Tell me about your siblings.","Who was the first President of the USA?","What is the capital of Australia?","Which metal is found in liquid form at room temperature?","Name the rivers of KPK.","What is GPS?","What are the official and national languages of Pakistan and India?","How do you think your interview went?"],"tips":["Ask permission before sitting down and keep eye contact.","GK alone does not decide the result; show confidence but do not be overconfident.","If you do not know an answer, politely say sorry."]},{"title":"PMA 152 • Rawalpindi centre (GK and Islamic history)","result":"Recommended","summary":"After the introduction, the interviewer asked mostly general knowledge and Islamic history questions. He was asked about Indian cities, US states, Pakistan-India wars and NATO. He could not answer some questions, like the main enemy in Ghazwa-e-Khandaq, but he still passed. He was also asked whether any relative serves in the Army.","asked":["Introduce yourself.","Name 5 cities of India.","Name 5 states of the USA.","How many wars have been fought between Pakistan and India, and when?","What is NATO?","Who are the Azwaj-e-Mutahharat (wives of the Holy Prophet PBUH)?","Who is called Saifullah?","In which Hijri year was Ghazwa-e-Khandaq fought, and who was the main enemy?","Do you have any relative serving in the Army?"],"tips":["You can pass even if you cannot answer every GK question.","Revise Pakistan-India wars, NATO and the main battles of Islamic history."]},{"title":"PMA 151 • Peshawar centre (second attempt)","result":"Recommended","summary":"He was not recommended in the PMA 150 initial interview and tried again. He wrote an English essay on the role of parents in raising children and an Urdu essay on hard work and good luck. The Lieutenant Colonel asked where Russia is and why he was not recommended last time. The Major asked about current office holders and asked him to show Russia on a map. He took a moment to think, answered calmly, and passed.","asked":["What is your name?","Where is Russia?","Why were you not recommended in your last initial interview?","Who is the Chairman Senate?","Who is the Speaker of the National Assembly?","Who was the previous President of Pakistan, and where is he now?","Do you know how to read a map? Show Russia on the map."],"tips":["If you failed before, explain honestly why and what you have improved.","Practise finding countries on a world map.","Know current office holders like the Chairman Senate, NA Speaker and the previous President."]},{"title":"PMA 151 • Swat area candidate","result":"Unknown","summary":"A Colonel took the interview. He asked what the candidate is doing these days and why he chose the Army when there are thousands of other jobs. He asked about the current situation in Swat and how militants get food and shelter. Then he switched the interview to English and asked basic grammar questions. He also asked why the candidate did not choose medicine after good FSc pre-medical marks, and why he wrote video games as a hobby.","asked":["How do you pronounce your name?","What are you doing these days?","Why did you choose the Pak Army when there are thousands of other jobs?","What is the situation in Swat right now?","From where do the Taliban get their food, shelter and water?","What is the national language of Pakistan?","What is the official language of Pakistan?","What is the currency of Afghanistan?","What is active voice and passive voice?","What is a noun and what is a verb?","You got good marks in FSc pre-medical, so why did you not choose medicine?","Why did you write playing video games as your hobby?"],"tips":["Know the latest news about your own home area.","Be ready for the officer to switch from Urdu to English.","Be ready to explain every hobby you write in your form.","If you do not know an answer, simply say 'Sorry sir, I don't know'."]},{"title":"PMA 151 • Karachi centre","result":"Unknown","summary":"He knocked, asked permission, and stood by the chair until told to sit. The board was a Colonel and a psychologist Major. After his introduction he was asked about the Indus Waters Treaty, which he explained in detail, and about the 1973 constitution. He was also asked about his strengths and weaknesses. The interview took about 9 minutes.","asked":["Introduce yourself.","What is the Indus Waters Treaty?","Tell us about the constitution of Pakistan.","What is the 1973 constitution?","What are your strengths and weaknesses?"],"tips":["Stand by the chair and sit only when asked.","Prepare an honest list of your strengths and weaknesses.","Prepare national topics like the Indus Waters Treaty and the 1973 constitution."]},{"title":"PMA 152 • Rawalpindi centre (speech)","result":"Recommended","summary":"He had to give a speech on why Pakistan's education system is declining. The psychologist asked him about 10 GK questions and he could answer only 4 or 5, saying sorry for the rest. The two written essays carried 20 marks (10 English, 10 Urdu) and he did them well. He believes his good essays and confident speech got him recommended even though his GK was weak.","asked":["Give a speech on the reasons behind the decline of the education system in Pakistan.","What is the currency of Turkey?","Where is the White Sea?","Where is the Yellow Sea?","Who is the Chief Minister of Balochistan?","What is 5% of 700?","What was the old name of Makkah?"],"tips":["The written essays carry about 20 marks (10 English, 10 Urdu), so practise both.","A good speech and good essays can make up for weak GK answers.","Keep current affairs updated, like the names of Chief Ministers."]},{"title":"PMA 152 • Rawalpindi centre (psychologist first)","result":"Recommended","summary":"He wrote an Urdu essay on the importance of law in society and an English essay on 'Money or Wisdom'. At first only the lady psychologist was in the room, and later a Colonel came in. She asked him to introduce himself, why he wants to join the Army, and some GK questions. He politely said 'Sorry madam' for the ones he did not know. At the end he spoke for 2 minutes on 'Armed Forces'.","asked":["Introduce yourself.","Why do you want to join the Pakistan Army?","Who is the President of Russia?","What is the full form of FATA?","What was the old name of Faisalabad?","Speak for 2 minutes on the topic 'Armed Forces'."],"tips":["Take permission before entering and before sitting.","They mainly check your confidence and the way you talk.","If you do not know an answer, say sorry politely instead of guessing."]},{"title":"PMA 153 • Lt Col and Major board","result":"Unknown","summary":"He wrote an English essay on co-education and an Urdu essay on local tourism. The Lieutenant Colonel asked about his qualification, father's job and family, and even personal and honesty questions. The Major asked about his hobbies and brothers, and then he was asked why he wants to join the Army. He could not answer five GK questions, so the Lt Col told him to improve his GK.","asked":["What is your qualification?","Tell me about your father and family.","Do you have a girlfriend?","What are your hobbies?","Tell me about your brothers.","Why do you want to join the Pakistan Army?","Have you ever watched restricted websites?","Do you tell lies?","Five general knowledge questions"],"tips":["Answer personal and honesty questions truthfully and calmly.","Prepare general knowledge well, because weak GK is noticed.","Leave properly: stand up, thank them, say salam and walk out calmly."]},{"title":"PMA 151 • Cricket player","result":"Recommended","summary":"The interview was mostly a talk based on his interview form. After a short introduction he was asked about the Suez and Panama canals. Because he wrote cricket as his hobby, there was a long discussion on cricket records and the best team.","asked":["Introduce yourself briefly.","Tell me about the Suez Canal and the Panama Canal.","Who is the highest run scorer in cricket?","Who is the highest wicket taker in cricket?","Which is the best cricket team in the world across all formats?"],"tips":["Most questions come from your form, so prepare everything you write, especially hobbies and games.","Do not take pressure and stay confident."]},{"title":"PMA 152 • Faisalabad centre","result":"Recommended","summary":"A Colonel took a short interview. He asked the candidate to introduce himself and what he would do if he was not recommended. He then asked which game he plays and about the bad effects of video games and mobile phones. After that he let him go.","asked":["Introduce yourself.","If we do not recommend you, what will you do?","Which game do you play?","What are the negative effects of video games?","What are the negative effects of mobile phones?"],"tips":["Do not lose your confidence.","Greet with salam when you enter and leave, and say thank you."]},{"title":"PMA 152 • Captain-only interview","result":"Recommended","summary":"Only a Captain took the whole interview, in a friendly way. He asked for an introduction, some geography and science GK, and about games and hobbies. He also asked why the candidate wants to join the Army. The friendly, smiling talk ended with 'Well done, you may go'.","asked":["Introduce yourself.","Where is Nigeria and why is it famous?","Where is Egypt and why is it famous?","How many bones are there in the adult human body?","What are your games and hobbies?","Why do you want to join the Pakistan Army?"],"tips":["Talk naturally and smile; treat it as a friendly conversation.","Work hard, pray and trust in Allah."]},{"title":"PMA 152 • Peshawar centre (name and maps)","result":"Recommended","summary":"About 55 candidates came that day and he was second last, so he waited a long time. A Colonel and a psychologist Major took the interview. They asked the meaning of his name, his marks, why he wants to join the Army, and some map and Army questions. The interview lasted only a few minutes, and only 8 or 9 out of 55 were selected.","asked":["What is the meaning of your name?","What were your matric and FSc marks?","Why do you want to join the Pakistan Army?","Where are Asia and Europe on the map?","Where are Russia and Greenland on the world map?","What is the budget of the Pakistan Army?","What are the ranks of non-commissioned officers in the Army?"],"tips":["Be ready for a long wait; stay fresh and calm.","Speak loudly and clearly, and keep your hands and feet still.","Know Army ranks and have a rough idea of the defence budget.","Most candidates fail because they lose confidence, not because of hard questions."]},{"title":"PMA 152 • Peshawar centre (female candidate)","result":"Not recommended","summary":"Her essays were on Iqbal's Shaheen and the impact of social media on moral values. She stood by the chair until told to sit. The officer asked about her surname, asked her to describe Islamophobia, and asked map questions about Moscow. He also asked her height in inches, her district and where she was doing her BS.","asked":["What does your surname mean? Is it your caste?","Describe Islamophobia.","Where is Moscow, and in which continent is it?","What is your height in inches?","Which is your district?","Where are you doing your BS?"],"tips":["Know your height in inches and other personal details exactly.","Learn the map locations of major world capitals."]},{"title":"PMA 151 • GK and science questions","result":"Unknown","summary":"After a self-introduction, the interviewer moved to general knowledge, history, science and simple maths. Questions covered Pakistan's provinces, cities and neighbours, World War 2, democracy and the Two Nation Theory. He was also asked intermediate science, like Mendel's laws, and a train speed problem.","asked":["Introduce yourself.","What is democracy?","Explain World War 2.","Where is gold found in Pakistan?","What are Mendel's laws?","What is the difference between organic and inorganic compounds?","Name four cities of Sindh.","How many provinces does Pakistan have? Name them.","Name the neighbouring countries of Pakistan.","A train moving at 60 km/h takes 120 seconds to pass through a tunnel. How long is the tunnel? (ignore the train's length)","What is the Two Nation Theory?"],"tips":["Revise your intermediate science subjects, because basic concept questions are asked.","Practise simple speed, time and distance sums in your head."]},{"title":"PMA 152 • Bio data form questions","result":"Unknown","summary":"After the physical test, candidates filled a bio data form for the interview. The form asked about the merits and demerits of himself, his parents, his best friend and his siblings. It also asked what his parents taught him, how he reacts to criticism and his biggest problem as a teenager. These answers are later used by the interviewers.","asked":["What are your merits and demerits?","What are the good and bad qualities of your parents, best friend and siblings?","What have your parents taught you?","How do you respond when someone criticises you?","What was your biggest problem as a teenager?"],"tips":["Think about honest answers on your own and your family's strengths and weaknesses before filling the form.","Keep your interview answers the same as what you wrote in the form."]},{"title":"PMA 152 • Short interview (called by wrong name)","result":"Recommended","summary":"A Colonel and a psychologist took the interview. The Colonel called him by a similar-sounding wrong name and he answered without noticing, which annoyed the Colonel a little. He calmly explained the mix-up. The psychologist said his Urdu was weak; they spoke Urdu and he answered confidently in English. The interview lasted about 2 minutes.","asked":["What is your full name?","Your Urdu is very weak. Why?","Where did you complete your FSc?"],"tips":["Listen carefully; if you did not hear clearly, politely ask them to repeat.","If you make a mistake, stay calm and explain briefly."]},{"title":"PMA 152 • Multan centre","result":"Recommended","summary":"His essays were on limited internet access for students (English) and unity of the Muslim Ummah (Urdu). He stood near the chair, said salam and sat when asked. A Captain asked him to introduce himself and asked only questions from his bio data form, with no GK. Out of 40 candidates, 18 passed.","asked":["Introduce yourself.","Questions from your bio data form"],"tips":["Know everything you wrote in your bio data form.","Still prepare GK, because other candidates were asked GK questions."]},{"title":"PMA 151 • Shortest interview","result":"Unknown","summary":"His interview was the shortest in a batch of about 45 boys. He was asked what foreign policy is and a simple speed-distance sum. The panel also asked about his marks and what he would do if not selected. He calmly said he still had more chances to try.","asked":["What is foreign policy?","If a train moves at 33 km per hour, how far will it go in 3 hours?","What are your marks?","What will you do if you are not selected?"],"tips":["Be ready for quick mental maths.","Have a calm, positive answer for 'what if you are not selected'."]},{"title":"PMA 151 • Peshawar centre (one 'sorry')","result":"Recommended","summary":"He wrote an English and an Urdu essay before the interview. The Colonel asked how many times he had applied, his name and what he is doing these days. When asked how Pakistan can improve relations with Afghanistan, he said sorry. He was still recommended.","asked":["How many times have you applied to the armed forces?","What are you doing these days?","How can Pakistan improve relations with Afghanistan?"],"tips":["One 'sorry' does not mean rejection; stay polite and confident."]},{"title":"PMA 153 • Peshawar centre","result":"Recommended","summary":"His English essay was 'Honesty is the best policy' and his Urdu essay was 'My favourite personality'. He was asked how Pakistan can improve its relations with Iran and his height in inches. The other questions came from what he filled in his form.","asked":["How can Pakistan improve its relationship with Iran?","What is your height in inches?","Questions from your form"],"tips":["Know your exact height, weight and other personal details.","Remember everything you wrote in your form."]},{"title":"PMA 152 • Peshawar centre (3-minute interview)","result":"Not recommended","summary":"He wrote two essays, one in English and one in Urdu. The interview lasted only about 3 minutes. He was asked where Mangla Dam is and two questions about the map of Pakistan. Only 7 out of 26 candidates in his group were recommended.","asked":["Where is Mangla Dam?","Point out places on the map of Pakistan."],"tips":["Study the map of Pakistan: dams, rivers and important places.","The interview can be very short, so make a good first impression."]},{"title":"PN Cadet (Navy) • Psychologist interview","result":"Unknown","summary":"After the Navy written test he had a short interview with a psychologist, fully in English. He asked permission, gave salam clearly and sat when told. She asked him to introduce himself, about his father's rank and unit, and why he wants to join the Navy. He felt she was mainly checking speaking skill and confidence.","asked":["Introduce yourself.","What is your father's rank and unit?","Why do you want to join the Pak Navy?"],"tips":["Speak in English with confidence.","Your matric and FSc marks also count in the final list, along with test and interview."]}],"questions":{"About you":["Introduce yourself.","What is your full name?","What is the meaning of your name?","How do you pronounce your name?","What are you doing these days?","Which area are you from?","Where are you from, and where are you settled now?","Tell me about your district.","What are your strengths and weaknesses?","What is your plan B?","What will you do if you are not recommended?","How do you respond when someone criticises you?","What was your biggest problem as a teenager?","You were a house prefect. Tell me about leadership at your level.","What big thing do you want to do for your family, your province and the people of Pakistan?","What is your height in inches?","Do you tell lies?","Do you have a girlfriend?","Have you ever watched restricted websites?","Your Urdu is very weak. Why?","Can you explain what you wrote in your bio data form?","How do you think your interview went?"],"Family":["What does your father do?","Where is your father posted?","What is your father's rank and unit?","Tell me about your family.","Do you have siblings? What are their names and what do they do?","Tell me about your brothers.","What have your parents taught you?","What are the good and bad qualities of your parents?","What are the good and bad qualities of your siblings?","What are the good and bad qualities of your best friend?","Do you have any relative serving in the Army?","What does your surname mean? Is it your caste?"],"Education":["Tell me about your education.","What is your qualification?","Tell me about your college.","Tell us about your previous schools and colleges.","Where did you complete your FSc?","Where are you doing your BS?","What were your matric and FSc marks?","Your grades are low. Why?","You got good marks in FSc pre-medical, so why did you not choose medicine or MDCAT?","What is the difference between a credit card and a debit card?","What are Mendel's laws?","What is the difference between organic and inorganic compounds?","What are algae, fungi and chromosomes?","What are ions and ionic bonds?","What is Newton's second law and its equation?","What are the longest and smallest bones of the human body?","How many bones are there in the adult human body?","What are the types of blood cells?","What is the difference between a plant cell and an animal cell?","Why is the sky blue?","What is active voice and passive voice?","What is a noun and what is a verb?"],"Army & PMA":["Why do you want to join the Pakistan Army?","Why did you choose the Pak Army when there are thousands of other jobs?","Why do you want to join the Pak Navy?","How many times have you applied to the armed forces?","Why were you not recommended in your last initial interview?","Why did you change your test centre?","What are the ranks of non-commissioned officers in the Army?","What is the budget of the Pakistan Army?","How many military gallantry awards does Pakistan have?","Which award is equal to the Nishan-e-Haider, and who received it?","What is the highest battlefield of Pakistan?","How many wars have been fought between Pakistan and India, and when?","What do you know about fighter pilots?","Speak for 2 minutes on the topic 'Armed Forces'."],"Pakistan & GK":["What is the Two Nation Theory?","How many provinces does Pakistan have? Name them.","Name the neighbouring countries of Pakistan.","What is the national language of Pakistan?","What is the official language of Pakistan?","What are the official and national languages of India?","How many constitutions has Pakistan had?","What is the 1973 constitution?","What is the difference between the 1962 and 1973 constitutions?","Who was the first President of Pakistan?","What is democracy?","What is foreign policy?","What is the Indus Waters Treaty?","What is the Indus civilization?","Where are Mohenjo-daro and Harappa?","What is the Durand Line?","What is the name of the India-China border line?","Where did Pakistan carry out its nuclear tests in 1998?","Where is Mangla Dam?","Where is Khanki Barrage?","Where is Manchar Lake?","Name the rivers of KPK.","Name four cities of Sindh.","Where is gold found in Pakistan?","What was the old name of Faisalabad?","What is the full form of FATA?","What is the full form of OGRA?","What is the height of Minar-e-Pakistan?","Who built the GT (Grand Trunk) Road?","Who was the Viceroy of India at the time of partition?","Who was the first Pakistani to win a Nobel Prize?","Who was Abdul Sattar Edhi?","Explain World War 2.","What is the currency of Afghanistan?","What is the currency of Bangladesh?","What is the currency of Iran?","What is the currency of Turkey?","What is the currency of Gilgit-Baltistan? (trick question)","What is the capital of Australia?","Who was the first President of the USA?","Name 5 cities of India.","Name 5 states of the USA.","Name five countries of Europe.","Where are Asia and Europe on the map?","Where is Russia? Show it on the map.","Where is Greenland on the world map?","Where is Moscow, and in which continent is it?","Where is Nigeria and why is it famous?","Where is Egypt and why is it famous?","Tell me about the Suez Canal and the Panama Canal.","Which ocean lies between Europe and America?","Where is the White Sea?","Where is the Yellow Sea?","Where is the Gobi Desert?","Which metal is found in liquid form at room temperature?","What is GPS?","How many members does the OIC have?"],"Current affairs":["Who was the previous President of Pakistan, and where is he now?","Who is the Chairman Senate?","Who is the Speaker of the National Assembly?","Who is the Governor of Punjab?","Who is the Chief Minister of Balochistan?","Who is the President of Russia?","How can Pakistan improve its relations with Afghanistan?","How can Pakistan improve its relations with Iran?","What is NATO?","Describe Islamophobia.","What is the situation in your home area (for example Swat) right now?","From where do the Taliban get their food, shelter and water?","Where is the FIFA World Cup being held, and what is the capital of that country?","Which teams reached the World Cup semi-final?","Which foreign cricket team is touring Pakistan now, and what was the latest result?"],"Islamiat":["Are you a Hafiz-e-Quran?","What is the meaning of 'Wal-yatalattaf', the middle word of the Quran?","What was the real name of Hazrat Abu Bakr (RA)?","After how many years did Hazrat Yusuf (AS) meet his father?","Who are the Azwaj-e-Mutahharat (wives of the Holy Prophet PBUH)?","Who is called Saifullah?","In which Hijri year was Ghazwa-e-Khandaq fought, and who was the main enemy?","What was the old name of Makkah?"],"Hobbies & sports":["What are your hobbies? Explain them.","What are your games and hobbies?","Which sports do you play?","Why did you write playing video games as your hobby?","Are you interested in football?","Who is the highest run scorer in cricket?","Who is the highest wicket taker in cricket?","Which is the best cricket team across all formats?"],"Situation & reasoning":["If I ask you to go and touch the Arabian Sea and come back, how much time will it take?","What is the length and width of this table? Show me.","If a train moves at 33 km per hour, how far will it go in 3 hours?","A train moving at 60 km/h takes 120 seconds to pass through a tunnel. How long is the tunnel? (ignore the train's length)","What is 5% of 500?","What is 5% of 700?","Why are warning signs and signals red?"],"Other":["What are the negative effects of video games?","What are the negative effects of mobile phones?","What do you think about travelling by train?","Speak for 2 minutes on the impact of hostel life.","Give a speech on the reasons behind the decline of the education system in Pakistan."]},"answers":{"Introduce yourself.":"Speak for about one minute: your name, home area, education and marks, family in one line, hobbies, and end with why you want to join the Army. Keep it natural, not memorised word for word.","What is the meaning of your name?":"Find out the real meaning of your name before the interview and say it in one short line. If it is linked to a famous person or quality, you may mention that.","How do you pronounce your name?":"Say your full name slowly and clearly, the same way it is written in your documents.","What are you doing these days?":"Tell the truth: your current studies or work, plus how you are preparing for the Army (fitness, reading, GK). Show that you are using your time well.","Tell me about your district.":"Know your district's location, main cities, rivers, famous places, main crops or industry, and any current issue there. Speak about it with pride but honestly.","Why do you want to join the Pakistan Army?":"Give a personal, honest reason like serving the country, a life of discipline and leadership, or inspiration from a real person you know. Avoid only saying 'for the uniform' or 'for the salary'.","Why did you choose the Pak Army when there are thousands of other jobs?":"Explain that the Army is not just a job for you but a way of life with service, honour and leadership. Link it to something real from your own life.","What will you do if you are not recommended?":"Stay calm and positive: say you will find your mistakes, improve, and apply again in the next course, while continuing your studies.","What is your plan B?":"Give a real, sensible backup like completing your degree in your field, but make it clear the Army is your first choice and you will try again.","What are your strengths and weaknesses?":"Give 2-3 real strengths with a short example each. For weaknesses, give a real but not serious one and say what you are doing to fix it.","How do you respond when someone criticises you?":"Say you listen calmly, think about whether it is right, and use it to improve. Give a small real example if you can.","What was your biggest problem as a teenager?":"Mention a real, normal problem (like time management, shyness or a study difficulty) and explain how you handled it and what you learned.","You were a house prefect. Tell me about leadership at your level.":"Explain what duties you had, one problem you solved, and how you treated the people under you. Only claim roles you really had.","What big thing do you want to do for your family, your province and the people of Pakistan?":"Give a simple, realistic aim, like being a good officer who serves with honesty, supports your family and helps people of your area. Avoid big empty promises.","What is your height in inches?":"Know your exact height and weight in both feet-inches and centimetres before the interview, and answer quickly.","Do you tell lies?":"Answer honestly and calmly. You can admit you are human, but say you value truth and try your best to always be honest.","Can you explain what you wrote in your bio data form?":"Read your form copy again before the interview. Every answer you give should match what you wrote there.","How do you think your interview went?":"Answer briefly and politely, for example that you tried your best and learned something. Do not argue or sound overconfident.","What does your father do?":"Say his profession clearly and respectfully, whatever it is. Be ready to explain a little about his work and what you learned from him.","Do you have siblings? What are their names and what do they do?":"Give each sibling's name, age order and what they study or do in one short line each.","What have your parents taught you?":"Mention 2-3 real values like honesty, respect and hard work, with a small example from your life.","What are the good and bad qualities of your parents?":"Speak respectfully. Mention real good qualities first, and for the bad side keep it mild and fair, such as being very strict out of care.","Do you have any relative serving in the Army?":"Answer truthfully. If yes, say who and their relation to you; if no, simply say no.","Your grades are low. Why?":"Accept it honestly and do not blame your school, teachers or anyone else. Say what caused it and what you are doing now to improve.","You got good marks in FSc pre-medical, so why did you not choose medicine or MDCAT?":"Explain honestly that the Army is your real interest and first choice. Do not speak badly of other careers.","How many times have you applied to the armed forces?":"Tell the exact number truthfully. If you applied many times, show it as determination and say what you improved each time.","Why were you not recommended in your last initial interview?":"Be honest about what went wrong (for example nervousness or weak GK) and clearly say what you have improved since then.","Why did you change your test centre?":"Give the real reason in one line, such as moving for studies or family. Keep it simple and truthful.","What are your hobbies? Explain them.":"Only write hobbies you really do, and know them in detail: when you started, how often, and what you learned from them.","Which sports do you play?":"Know your sport well: its rules, famous players, recent big events and your own position or role in the team."},"essays":["Should Social Media Be Banned?","Causes and Solutions of Terrorism in Pakistan","Problems of Pakistan's Education System","My Aim in Life","Tourism in Pakistan","Is New Technology Making People Lazy?","Co-education","The Kashmir Issue and Its Solution","Climate Change and Its Effects","Is Money the Most Important Thing in Life?","Money or Wisdom","A Wealthy Life Is Better Than a Peaceful Life","Hard Work and Good Luck","Role of Parents in Raising Children","Role of Teacher, Student and Parents in Education","Should Students Get Limited Access to the Internet?","Impact of Social Media on Moral Values","The Happiest Moment of My Life","The Saddest Moment of My Life","The Most Unforgettable Event of My Life","An Unpleasant Event of My Childhood","My Family","My Bad Habits","My Favourite Personality","Qualities of a Good Student","Unemployment in Pakistan","Poverty in Pakistan","Poverty Leads to Crime","Knowledge Is Power","Honesty Is the Best Policy","All That Glitters Is Not Gold","Iqbal's Shaheen","Unity of the Muslim Ummah","Importance of Religion in Human Life","Importance of Law in Society","Importance of Justice in Pakistan","Provincialism and Its Effects","College Students Should Be Free to Choose Their Subjects","Impact of Hostel Life","Armed Forces","Pakistan Army in National Development","The Importance of National Defence","Is Patriotism Just a Dangerous Emotion?","The Role of Youth in Nation Building","Traits of Youth That Can Make Pakistan Better","Problems of Increasing Population in Pakistan","The Blessing of Independence","The Importance of Discipline","Democracy in Pakistan","The Importance of National Unity","The Energy Crisis in Pakistan","Corruption in Society","The Water Shortage Problem","The Impact of Inflation on Society","Private Schools Are Better Than Government Schools","Single National Curriculum","Health Facilities in Pakistan","The Islamic Education System","Students' Role in Education Awareness","Western Culture","Gender Inequality","The Importance of Women Empowerment","The Role of Media in Society","Advantages and Disadvantages of the Internet","Cybercrime and Its Prevention","Drug Abuse Among Youth","The Importance of Moral Values","The Importance of Tolerance","Pakistan-China Friendship","The Importance of CPEC","Role of OIC in the World","Pakistan and the Muslim World","The Qualities of a Good Leader","Role of Sports in Character Building","The Importance of Self-Confidence","The Importance of Time Management","Impact of Success on Life","Difference Between Success and Failure","Is Life an Opportunity?","History Is Nothing but the Biography of Great Men"],"tips":{"Before the interview":["Clearing the written test is only the first step; many candidates fail the interview, so start preparing for it right after the test.","Fill the bio data form honestly and remember every answer, because the officers ask questions from it.","Prepare a clear one-minute self-introduction, the meaning of your name, and a real reason for joining the Army.","Know your hobbies, sports and your own study subjects in detail.","Know your exact personal details, including your height in inches and your marks.","Learn current office holders (President, PM, Chief Ministers, Governors, Chairman Senate, NA Speaker), world capitals and currencies.","Practise reading the map of Pakistan and the world map: continents, major countries, dams and rivers.","Revise basic GK: Pakistan's history, constitutions, Pakistan-India wars, Army ranks, military awards and Islamic history.","Follow current news, including your home area and big sports events.","Dress formally: light full-sleeve shirt with sleeves down, dark dress pants, formal lace-up shoes and neat hair; no jeans or loafers. Expensive clothes are not needed.","Take your original documents, copies of certificates and CNIC/B-form, and extra photos to the selection centre.","Expect a long wait on interview day; stay fresh, calm and trust Allah."],"In the room":["Knock, ask 'May I come in, sir?', and greet both officers with salam.","Stand beside the chair and sit only when told; say thank you.","Sit straight, do not cross your legs or lock your hands, and keep your hands and feet still.","Keep eye contact and a natural smile throughout.","Speak in a clear, loud voice; most of the interview is usually in English.","The board is usually a Colonel or Lt Col with a psychologist Major or a Captain; respect all of them equally.","The interview is short (often 2-10 minutes), so your first impression matters a lot.","When leaving, stand up, thank the panel, say salam and walk out calmly."],"Answering":["Confidence and the way you speak matter more than knowing every answer.","If you do not know an answer, politely say 'Sorry sir, I don't know' instead of guessing; one sorry is not rejection, but avoid many.","Answer personal and honesty questions truthfully and calmly.","Be honest about weak marks or past failures, and never blame your school, college or others.","Listen carefully; if you did not hear clearly, politely ask the officer to repeat.","If you are weak in one area, say so honestly and offer your strong subject.","Be ready for quick mental maths and estimation questions, like distance, time or the size of a table.","Be ready to speak for 2 minutes on a random topic.","Be ready for the interview to switch suddenly from Urdu to English.","Show confidence but do not be overconfident or argue."],"Essay":["You write one English and one Urdu essay before the interview, worth about 20 marks in total; practise both.","Use a simple structure: short introduction, main points, and a clear conclusion.","On debate topics, give both sides first and then your own balanced opinion.","Add one famous quote or a simple fact to make the essay stronger.","Learn a few good words with their meanings and use them correctly.","Prepare personal topics like your happiest moment, saddest moment and aim in life, and link the lesson to joining the Army.","Manage your time so you finish both essays."]}};

  function qb(){var f=(sub||'').toLowerCase();
    return head(card('qb'))+'<input class="srch" type="search" placeholder="🔍 Search a question" value="'+esc(sub||'')+'" data-is="1">'+
      CATS.map(function(c){var L=D.questions[c].filter(function(q){return !f||q.toLowerCase().indexOf(f)>-1});if(!L.length)return '';var n=L.filter(function(q){return ok[hid(q)]}).length,p=Math.round(100*n/L.length);
        return '<div class="cat'+(f?' open':'')+'"><button type="button" data-ic="1"><span class="ring" style="--p:'+p+'"><span>'+p+'%</span></span><span style="font-size:20px">'+(CI[c]||'💬')+'</span><b>'+esc(c)+'</b><small>'+n+'/'+L.length+'</small></button><div class="ql">'+L.map(function(q){return qrow(q,false)}).join('')+'</div></div>'}).join('')}
  function ans(){return head(card('ans'))+'<div class="cat open"><div class="ql" style="display:block">'+Object.keys(D.answers).map(function(q){return qrow(q,true)}).join('')+'</div></div>'}
  function xp(){return head(card('xp'))+D.experiences.map(function(e){var r=/^rec/i.test(e.result)?'y':/^not/i.test(e.result)?'n':'u';
    return '<div class="xp"><div class="h"><b>🪖 '+esc(e.title)+'</b><span class="r '+r+'">'+(r==='y'?'✅ Recommended':r==='n'?'❌ Not recommended':'• Result not shared')+'</span></div><p>'+esc(e.summary)+'</p>'+
      (e.asked&&e.asked.length?'<h5>QUESTIONS ASKED</h5><ul>'+e.asked.map(function(q){return '<li>'+esc(q)+'</li>'}).join('')+'</ul>':'')+
      (e.tips&&e.tips.length?'<h5>TIPS</h5><ul>'+e.tips.map(function(q){return '<li>'+esc(q)+'</li>'}).join('')+'</ul>':'')+'</div>'}).join('')}
  function es(){var s=sub;
    var top=s?'<div class="mk"><div class="c">YOUR TOPIC</div><div class="qq">'+esc(s.t)+'</div><div class="tm'+(s.left<60?' w':'')+'" id="ivTm">'+fmt(s.left)+'</div><p style="color:var(--m);font-size:12.5px;margin:4px 0 0">Write: introduction → 3 points → conclusion</p></div><div class="row"><button type="button" class="big g" data-er="1">🎲 New topic</button><button type="button" class="big r" data-es="1">⏹ Stop</button></div>'
      :'<button type="button" class="big" data-er="1">🎲 Give me a random topic (15-minute challenge)</button>';
    return head(card('es'))+top+D.essays.map(function(t,i){return '<button type="button" class="es" data-et="'+i+'"><i>'+(i+1)+'</i><span>'+esc(t)+'</span></button>'}).join('')}
  function tips(){return head(card('tips'))+Object.keys(D.tips).map(function(g){return '<div class="tg"><h4>'+esc(g)+'</h4>'+D.tips[g].map(function(t){var id=hid(g+t);return '<button type="button" class="tp'+(tok[id]?' ok':'')+'" data-tk="'+id+'"><span class="ck">'+(tok[id]?'✓':'')+'</span><span>'+esc(t)+'</span></button>'}).join('')+'</div>'}).join('')}
  function fmt(s){s=Math.max(0,s|0);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
  function newMock(){var pool=ALLQ.slice(),pick=[];var intro=pool.filter(function(x){return /introduce yourself|tell me about yourself/i.test(x.q)})[0];if(intro){pick.push(intro);pool.splice(pool.indexOf(intro),1)}
    while(pick.length<10&&pool.length){var i=Math.floor(Math.random()*pool.length);pick.push(pool.splice(i,1)[0])}mk={qs:pick,i:0,res:[],left:45,hint:false}}
  function mock(){if(!mk)newMock();var c=card('mock');
    if(mk.i>=mk.qs.length){var a=mk.res.filter(function(x){return x==='d'}).length;
      return head(c)+'<div class="mk"><div class="done">'+(a>=8?'🏆':a>=5?'👍':'💪')+'</div><div class="qq">You answered '+a+' of '+mk.qs.length+'</div><p style="color:var(--m);font-size:13.5px">'+(a>=8?'Excellent! You are ready. Keep practising daily.':a>=5?'Good! Practise the skipped questions in the Question Bank.':'Keep going. Read Model Answers, then try again.')+'</p></div><button type="button" class="big" data-mn="1">🔁 New mock interview</button>'}
    var x=mk.qs[mk.i],h=D.answers[x.q];
    return head(c)+'<div class="dots">'+mk.qs.map(function(_,j){return '<i class="'+(j<mk.i?(mk.res[j]==='d'?'d':'s'):j===mk.i?'c':'')+'"></i>'}).join('')+'</div>'+
      '<div class="mk"><div class="c">QUESTION '+(mk.i+1)+' OF '+mk.qs.length+'</div><div class="qq">"'+esc(x.q)+'"</div><span class="ct">'+(CI[x.c]||'💬')+' '+esc(x.c)+'</span><div class="tm'+(mk.left<=10?' w':'')+'" id="ivTm">'+fmt(mk.left)+'</div><p style="color:var(--m);font-size:12.5px;margin:0">Answer out loud, like in the real room</p>'+(h?(mk.hint?'<span class="hn">💡 '+esc(h)+'</span>':'<br><button type="button" class="hb" data-mh="1" style="font-size:13px;font-weight:800;color:#4f46e5;background:none;border:0">💡 Show answer tip</button>'):'')+'</div>'+
      '<div class="row"><button type="button" class="big g" data-ma="d">✓ I answered</button><button type="button" class="big r" data-ma="s">↷ Skip</button></div>'}
  function tick(){clearInterval(tmr);tmr=null;if(view==='mock'&&mk&&mk.i<mk.qs.length){tmr=setInterval(function(){if(!host||view!=='mock'){clearInterval(tmr);return}mk.left--;var e=host.querySelector('#ivTm');if(e){e.textContent=fmt(mk.left);e.classList.toggle('w',mk.left<=10)}if(mk.left<=0){clearInterval(tmr)}},1000)}
    if(view==='es'&&sub&&sub.t){tmr=setInterval(function(){if(!host||view!=='es'||!sub){clearInterval(tmr);return}sub.left--;var e=host.querySelector('#ivTm');if(e){e.textContent=fmt(sub.left);e.classList.toggle('w',sub.left<60)}if(sub.left<=0)clearInterval(tmr)},1000)}}
  function draw(keep){if(!host)return;var y=window.scrollY;var lb=host.previousElementSibling;if(lb&&lb.classList&&lb.classList.contains('lback'))lb.style.display=view==='hub'?'':'none';host.innerHTML='<div id="intP">'+(view==='hub'?hub():view==='qb'?qb():view==='ans'?ans():view==='xp'?xp():view==='es'?es():view==='tips'?tips():mock())+'</div>';if(!keep)window.scrollTo(0,0);else window.scrollTo(0,y);tick()}
  function go(v){view=v;sub=null;if(v==='mock')mk=null;draw();try{history.pushState({n:1,iv:1},'')}catch(e){}}
  window.__intRender=function(el){ld();host=el;view='hub';sub=null;draw();
    if(!el.__iv){el.__iv=1;el.addEventListener('click',onClick);el.addEventListener('input',function(e){if(e.target.getAttribute('data-is')&&view==='qb'){sub=e.target.value;var p=e.target.selectionStart;draw(true);var n=host.querySelector('[data-is]');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(x){}}}})}};
  window.__intBack=function(){if(!host||!document.getElementById('intP')||view==='hub')return false;view='hub';sub=null;draw();return true};
  window.__intActive=function(){return !!(host&&document.getElementById('intP'))};
  function onClick(e){var t=e.target;if(!document.getElementById('intP'))return;var b;
    if((b=t.closest('[data-iv]'))){go(b.getAttribute('data-iv'));return}
    if(t.closest('[data-ib]')){if(history.state&&history.state.iv)history.back();else{view='hub';draw()}return}
    if((b=t.closest('[data-qk]'))){var id=b.getAttribute('data-qk');if(ok[id])delete ok[id];else ok[id]=1;sv();var r=b.closest('.q');r.classList.toggle('ok',!!ok[id]);b.textContent=ok[id]?'✓':'';var cat=b.closest('.cat');if(cat&&view==='qb'){var qs=cat.querySelectorAll('.q'),n=cat.querySelectorAll('.q.ok').length,p=Math.round(100*n/qs.length);var rg=cat.querySelector('.ring');rg.style.setProperty('--p',p);rg.querySelector('span').textContent=p+'%';cat.querySelector('small').textContent=n+'/'+qs.length}return}
    if((b=t.closest('[data-hn]'))){var s=b.nextElementSibling;if(s)s.hidden=false;b.remove();return}
    if((b=t.closest('[data-ic]'))){b.parentElement.classList.toggle('open');return}
    if((b=t.closest('[data-tk]'))){var k=b.getAttribute('data-tk');if(tok[k])delete tok[k];else tok[k]=1;sv();b.classList.toggle('ok',!!tok[k]);b.querySelector('.ck').textContent=tok[k]?'✓':'';return}
    if(t.closest('[data-er]')){var i=Math.floor(Math.random()*D.essays.length);sub={t:D.essays[i],left:900};draw();return}
    if((b=t.closest('[data-et]'))){sub={t:D.essays[+b.getAttribute('data-et')],left:900};draw();return}
    if(t.closest('[data-es]')){sub=null;draw();return}
    if(t.closest('[data-mh]')){mk.hint=true;var y=window.scrollY;draw(true);return}
    if((b=t.closest('[data-ma]'))){var a=b.getAttribute('data-ma');var x=mk.qs[mk.i];mk.res.push(a);if(a==='d'){ok[hid(x.q)]=1;sv()}mk.i++;mk.left=45;mk.hint=false;draw();return}
    if(t.closest('[data-mn]')){mk=null;draw();return}
  }
})();
</script>
