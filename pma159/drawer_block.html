  var LEGAL={"priv": {"t": "Privacy Policy", "ic": "fa-shield-halved", "s": [["Introduction", "<p>Welcome to PMA Preparation (\"we\", \"us\", \"our\" or \"the App\"). This Privacy Policy explains what information the PMA Preparation Android app collects, why we collect it, how we keep it safe and what choices you have.</p><p>Your privacy is important to us. We collect only what the App needs to work. By creating an account or using the App, you agree to this Privacy Policy. If you do not agree, please do not use the App.</p><p>We do not show advertisements, we do not use advertising IDs and we do not track you across other apps or websites.</p>"], ["Information We Collect", "<h4>2.1 Information you give us</h4><ul><li><b>Account:</b> your email address and password when you sign up, or your Google account email and name if you continue with Google. Passwords are handled by Google Firebase Authentication; we never see or store your password.</li><li><b>Profile:</b> first and last name, mobile number, date of birth, gender, province, city, address, zip code and an optional profile photo.</li><li><b>Messages:</b> anything you send to the admin.</li></ul><h4>2.2 Information collected automatically</h4><ul><li><b>Phone code:</b> a random code that links your account to one phone (one account, one phone). It does not contain your phone number, IMEI or contacts.</li><li><b>Online status:</b> whether you are using the App right now and the last time you were online, used only for the online count.</li><li><b>Access:</b> which preparations the admin has opened for your account.</li></ul><h4>2.3 Information that stays only on your phone</h4><ul><li>Your test scores, best results, saved questions (Favourites), mistakes and daily streak.</li><li>Numbers you type in the BMI Calculator. These are never sent to us.</li></ul><p>We do <b>not</b> collect your location, contacts, call logs, SMS or files, and we do not use cookies, tracking pixels or advertising tools.</p>"], ["How We Use Your Information", "<ul><li>To create your account and let you log in safely.</li><li>To show your name and photo in the App.</li><li>To let the admin open the right preparations (Initial PMA, Interview, ISSB) for you.</li><li>To keep one account on one phone and stop shared accounts.</li><li>To show how many students are online.</li><li>To contact you about your account if needed.</li><li>To fix problems and improve the App.</li></ul><p>We never use your information for advertising and we never sell it.</p>"], ["Information Sharing & Third Parties", "<p>We do not sell, rent or trade your personal information. Only the admin can see your account details and profile. Other students only see the number of people online, never your name, email or photo.</p><h4>4.1 Service providers</h4><ul><li><b>Google Firebase</b> (Authentication and Cloud Firestore) keeps your account and profile safe on Google's servers.</li><li><b>GitHub Pages</b> delivers the App's study content and updates. It does not receive your personal information.</li></ul><h4>4.2 Legal requirements</h4><p>We may share information only if the law of Pakistan requires it, or to protect the safety and rights of our users and the App.</p>"], ["Data Retention & Deletion", "<p>We keep your account and profile while your account is active. Scores and favourites stay on your phone until you delete the App or clear its data.</p><h4>5.1 Delete your account</h4><ul><li>In the App: tap ☰ → My Profile → Delete Account, type DELETE and confirm. Your account, profile and photo are deleted at once.</li><li>Or send a message to the admin in our WhatsApp Community (Social tab) and ask for deletion.</li></ul>"], ["Data Security", "<ul><li>All data between your phone and our servers travels over encrypted HTTPS (TLS).</li><li>Passwords are stored by Google Firebase in hashed form, never as plain text.</li><li>Study content is locked with strong encryption (AES-GCM) and opens only for accounts the admin approves.</li><li>Security rules let each student read and change only their own data. Only the admin account can see everyone's details.</li></ul><p>No system is 100% secure. Keep your password secret and do not share your account.</p>"], ["Your Rights & Choices", "<ul><li><b>See and correct:</b> view and change your details any time in My Profile.</li><li><b>Delete:</b> delete your account in My Profile or ask the admin.</li><li><b>Photo:</b> adding a photo is optional and you can change it any time.</li><li><b>Questions:</b> ask the admin about the data we hold about you.</li></ul>"], ["App Permissions", "<table><tr><th>Permission</th><th>Why</th><th>Needed?</th></tr><tr><td>Internet</td><td>To log in, load tests and get updates.</td><td>Yes</td></tr><tr><td>Photos / files</td><td>Only when you choose a profile photo. Nothing else is read.</td><td>Optional</td></tr></table><p>The App does not ask for camera, location, contacts, microphone or SMS permissions.</p>"], ["Children's Privacy", "<p>PMA Preparation is made for students preparing for the Pakistan Military Academy (usually 16 years and older). Users under 18 should use the App with the permission of a parent or guardian. If a parent believes their child has given us information without permission, they can ask the admin to delete the account.</p>"], ["Where Your Data Is Stored", "<p>Our service providers (Google Firebase and GitHub) may store data on servers outside Pakistan. They protect it with industry-standard security.</p>"], ["Changes to This Policy", "<p>We may update this Privacy Policy when the App changes. The new date will be shown at the top. Using the App after a change means you accept the updated policy.</p>"], ["Contact Us", "<p>For any question about this Privacy Policy or your data, contact the admin in our <b>WhatsApp Community</b> or <b>WhatsApp Channel</b> (Social tab in the App).</p>"]]}, "terms": {"t": "Terms & Conditions", "ic": "fa-scale-balanced", "s": [["Acceptance of Terms", "<p>By downloading, installing or using the PMA Preparation Android app (\"the App\"), you agree to these Terms &amp; Conditions. If you do not agree, please do not use the App.</p><p>The App is a study help for the Pakistan Military Academy (PMA) Long Course initial test, interview and ISSB preparation.</p><div class=\"warn\"><b>Important:</b> PMA Preparation is an independent study app. It is <b>not</b> owned by or connected to the Pakistan Army, the Pakistan Military Academy, ISSB or any government office.</div>"], ["Definitions", "<table><tr><th>Word</th><th>Meaning</th></tr><tr><td>App</td><td>The PMA Preparation Android app and its updates</td></tr><tr><td>Admin</td><td>The owner and manager of PMA Preparation</td></tr><tr><td>Account</td><td>Your login made with email or Google</td></tr><tr><td>Content</td><td>All MCQs, answers, reasons, notes, tests and pictures in the App</td></tr><tr><td>Preparation</td><td>Initial PMA Preparation, Initial Interview Preparation or ISSB Preparation</td></tr></table>"], ["Account Registration", "<ul><li>Give a working email, a password (at least 6 characters) and your real details.</li><li>Keep your details correct and up to date in My Profile.</li><li><b>One account is for one person and works on one phone.</b> Your account is linked to the first phone you use. To move to a new phone, ask the admin.</li><li>Keep your password secret. You are responsible for everything done with your account.</li><li>Do not make more than one account.</li></ul>"], ["Access to Preparations", "<p>After sign-up you can use BMI, Roadmap, Admin Experience and Social at once. The Initial PMA, Interview and ISSB preparations open only when the admin enables them for your account. The admin can open, change or close access at any time.</p>"], ["Your Responsibilities", "<p>You agree not to:</p><ul><li>Share your account or password with anyone.</li><li>Copy, screenshot for sharing, sell, post or send the Content outside the App.</li><li>Try to unlock, break or get around the App's locks and encryption.</li><li>Use bots, scripts or other tools to read or download the Content.</li><li>Change, copy or reverse-engineer the App.</li><li>Pretend to be someone else or give false details.</li><li>Use the App for anything illegal or harmful.</li></ul>"], ["Content & Answers", "<p>We check every answer carefully and give a reason for it, but mistakes can happen. If you find a wrong answer, tell the admin so it can be fixed.</p><ul><li>Content can be added, changed or removed at any time.</li><li>Always confirm important information, such as dates, age limits and eligibility, from official PMA and Pakistan Army sources.</li></ul>"], ["Intellectual Property", "<p>All Content, the design, the name \"PMA Preparation\" and the App belong to PMA Preparation. You get a personal, non-transferable right to use the App for your own study only. All other rights are reserved.</p>"], ["BMI Calculator", "<p>The BMI Calculator gives a general guide only. It is not medical advice and does not show exact fat or muscle. The army medical board decides final medical fitness.</p>"], ["Fees", "<p>The App itself does not take any payment. Any arrangement about access is made directly with the admin.</p>"], ["Suspension & Termination", "<p>The admin may lock, block or delete an account that breaks these Terms, for example a shared account, copied Content or misuse. You may delete your account at any time in My Profile → Delete Account.</p>"], ["Changes to the App", "<p>The App updates itself automatically. We may change, add or remove features at any time. Close and open the App to get the newest version.</p>"], ["Disclaimer", "<p>The App is provided \"as is\". We do not promise that it will always work without errors, and we do not promise success in any test, interview or ISSB.</p>"], ["Limitation of Liability", "<p>As far as the law allows, PMA Preparation is not responsible for any loss caused by using the App, wrong information, lost scores on your phone or the App being unavailable.</p>"], ["Third-Party Services", "<p>The App uses Google Sign-In and Google Firebase, and shows links to WhatsApp and TikTok. Their own terms and privacy policies apply to them.</p>"], ["Governing Law", "<p>These Terms follow the laws of the Islamic Republic of Pakistan. Any dispute will first be discussed with the admin to solve it peacefully.</p>"], ["Contact Us", "<p>For questions about these Terms, contact the admin in our <b>WhatsApp Community</b> or <b>WhatsApp Channel</b> (Social tab in the App).</p>"]]}, "date": "October 31, 2026"};
