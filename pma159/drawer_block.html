<style>

#pfPage .f select{background-image:linear-gradient(45deg,transparent 50%,var(--pmu) 50%),linear-gradient(135deg,var(--pmu) 50%,transparent 50%);background-position:calc(100% - 22px) 25px,calc(100% - 16px) 25px;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
#pfPage .f select option{color:#111;background:#fff}
#pfPage .f input:focus,#pfPage .f select:focus{border-color:#b8860b}
#pfPage .f input[type=date]{color-scheme:light}html.dark #pfPage .f input[type=date]{color-scheme:dark}
#pfPage .f .ic{position:absolute;right:16px;top:18px;color:var(--pmu);pointer-events:none}
#pfPage .phn{display:flex;align-items:center;border:1.5px solid var(--pln);border-radius:14px;height:56px;padding-left:14px}
#pfPage .phn:focus-within{border-color:#b8860b}#pfPage .phn span{font-weight:600;padding-right:12px;border-right:1px solid var(--pln);white-space:nowrap}
#pfPage .phn input{border:0;height:52px}
#pfPage .sv{width:100%;height:56px;border:0;border-radius:16px;margin-top:6px;background:linear-gradient(120deg,#b8860b,#e9c75a 50%,#c99a17);color:#2b1d02;font:800 17px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;box-shadow:0 10px 24px rgba(184,134,11,.3)}
#pfPage .sv:disabled{opacity:.6}
#pfPage .pm{min-height:22px;margin:10px 2px 0;font-size:14px;font-weight:700;text-align:center}#pfPage .pm.bad{color:#dc2626}#pfPage .pm.ok{color:#15803d}
/* header: "Hi, name" instead of the logo, the app name and the round letter button */
header>div>div>div.w-10.h-10,header h1,header h1+p,#hdrUser{display:none!important}
#hiName{display:none;font-weight:800;font-size:17px;color:#1e1b4b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100vw - 230px);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
html.acok #hiName{display:block}html.dark #hiName{color:#f5f5f4}
</style>
<script>
(function(){function init(){
  var row=document.querySelector('header>div>div');if(!row||document.getElementById('hbBtn'))return;
  var hb=document.createElement('button');hb.type='button';hb.id='hbBtn';hb.setAttribute('aria-label','Menu');hb.innerHTML='<i class="fa-solid fa-bars"></i>';row.insertBefore(hb,row.firstChild);
  var hi=document.createElement('div');hi.id='hiName';hb.parentNode.insertBefore(hi,hb.nextSibling);
  var fetched='';
  function hiSync(){var p=getProf(),n=(p.fn?(p.fn+' '+(p.ln||'')).trim():who().name);hi.textContent='Hi, '+n;
    var u=window.__acUser?window.__acUser():null,db=window.__acDb?window.__acDb():null;
    if(u&&db&&fetched!==u.uid&&document.documentElement.classList.contains('acok')){fetched=u.uid;db.FB.getDoc(db.FB.doc(db.fs,'profiles',u.uid)).then(function(s){if(!s.exists())return;var x=s.data();delete x.t;try{localStorage.setItem('ac_prof_'+u.uid,JSON.stringify(x))}catch(e){}hiSync()}).catch(function(){fetched=''})}}
  new MutationObserver(hiSync).observe(document.documentElement,{attributes:true,attributeFilter:['class']});
  var dr=null,bk=null,pushed=false;
  function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function who(){var u=window.__acUser?window.__acUser():null,n=window.__acName||'';try{if(!n)n=localStorage.getItem('ac_name')||''}catch(e){}
    try{var s=JSON.parse(localStorage.getItem('ac_state')||'null');if(!n&&s&&s.name)n=s.name}catch(e){}
    var em=(u&&u.email)||'';if(!n)n=(u&&u.displayName)||em.split('@')[0]||'Student';return {name:n,email:em}}
  function favN(){try{return Object.keys(JSON.parse(localStorage.getItem('an_bm')||'{}')||{}).length}catch(e){return 0}}
  function access(){var adm=!!window.__acAdmin,c=window.__acCats||[],pma=false;try{pma=adm||Object.keys(window.__lkAllowed?window.__lkAllowed():{}).length>0}catch(e){}
    return [['Initial PMA Preparation',pma],['Initial Interview Preparation',adm||c.indexOf('int')>-1],['ISSB Preparation',adm||c.indexOf('issb')>-1]]}
  function profKey(){var u=window.__acUser?window.__acUser():null;return u?'ac_prof_'+u.uid:''}
  function getProf(){try{return JSON.parse(localStorage.getItem(profKey())||'null')||{}}catch(e){return {}}}
  function avatar(p,name){return p&&p.photo&&/^data:image\/jpeg;base64,/.test(p.photo)?'<img alt="" src="'+p.photo+'">':'<i class="fa-solid fa-user"></i>'}
  function main(){var w=who(),n=favN(),p=getProf(),nm=(p.fn?(p.fn+' '+(p.ln||'')).trim():w.name);
    dr.innerHTML='<div class="dh"><div class="av">'+avatar(p)+'</div><div style="min-width:0"><div class="nm">'+esc(nm)+'</div><div class="em">'+esc(w.email)+'</div></div></div>'+
      '<button type="button" class="it" data-k="prof"><i class="fa-regular fa-user"></i>My Profile</button>'+
      '<button type="button" class="it" data-k="fav"><i class="fa-regular fa-heart"></i>Favourites'+(n?'<span class="ct">'+n+'</span>':'')+'</button>'+
      '<button type="button" class="it" data-k="terms"><i class="fa-regular fa-file-lines"></i>Terms &amp; Conditions</button>'+
      '<button type="button" class="it" data-k="priv"><i class="fa-solid fa-shield-halved"></i>Privacy Policy</button>'+
      '<div id="drNote"></div><div class="sep"></div>'+
      '<button type="button" class="it out" data-k="out"><i class="fa-solid fa-arrow-right-from-bracket"></i>Logout</button><div class="sep"></div><div class="ft">PMA Preparation</div>'}
  var BACK='<button type="button" class="pvb" data-k="menu"><i class="fa-solid fa-arrow-left"></i> Menu</button>';
  var TERMS='<h3>Terms &amp; Conditions</h3><p>PMA Preparation is a study app for the PMA Long Course initial test, interview and ISSB preparation.</p>'+
    '<h4>Your account</h4><p>One account is for one person and works on one phone. Do not share your account or password. The admin can stop an account that is shared or misused.</p>'+
    '<h4>Access</h4><p>The admin decides which preparations are opened for each account and can change or stop access at any time.</p>'+
    '<h4>Content</h4><p>All MCQs, notes and explanations belong to PMA Preparation. Do not copy, sell or share them outside the app.</p>'+
    '<h4>Answers</h4><p>We check every answer carefully, but mistakes can happen. If you find one, tell the admin so it can be fixed. The app is a study help and does not promise success in any test.</p>'+
    '<h4>Changes</h4><p>These terms can be updated. Using the app means you accept the latest terms.</p>';
  var PRIV='<h3>Privacy Policy</h3><p>We keep only what the app needs to work.</p>'+
    '<h4>What we keep</h4><p>Your name, your email, which preparations are opened for you, the messages you send to the admin, a code for your phone (one account, one phone), and the time you were last online (for the online count), and the details you choose to fill in My Profile (photo, phone number, address, city, gender, date of birth).</p>'+
    '<h4>What stays on your phone</h4><p>Your test scores, saved questions (Favourites), mistakes and streak are kept only on your phone.</p>'+
    '<h4>Who can see it</h4><p>Only the admin can see your account details and messages. Other students see only the number of people online, never your name or email.</p>'+
    '<h4>Sharing</h4><p>We never sell or share your data. The app uses Google Firebase to keep accounts safe.</p>'+
    '<h4>Delete</h4><p>To delete your account and data, send a message to the admin.</p>';
  function page(h){dr.innerHTML='<div class="pv">'+BACK+h+'</div>'}
  var PROV=['Punjab','Sindh','Khyber Pakhtunkhwa','Balochistan','Islamabad Capital Territory','Gilgit-Baltistan','Azad Jammu and Kashmir'];
  var CITY=['Lahore','Karachi','Islamabad','Rawalpindi','Faisalabad','Multan','Peshawar','Quetta','Hyderabad','Gujranwala','Sialkot','Sargodha','Bahawalpur','Sukkur','Abbottabad','Mardan','Bhakkar','Mianwali','Dera Ismail Khan','Dera Ghazi Khan','Jhang','Sahiwal','Okara','Kasur','Sheikhupura','Gujrat','Jhelum','Chakwal','Attock','Muzaffarabad','Mirpur','Gilgit','Skardu','Larkana','Nawabshah','Swat','Kohat','Bannu','Layyah','Khushab','Rahim Yar Khan','Vehari','Khanewal','Muzaffargarh','Narowal','Hafizabad','Mandi Bahauddin','Turbat','Gwadar','Khuzdar'];
  var pf=null,pfData=null,pfDirty=false;
  function fld(id,lab,h){return '<div class="f"><label for="'+id+'">'+lab+'</label>'+h+'</div>'}
  function opts(list,v,ph){return '<option value="">'+ph+'</option>'+list.map(function(x){return '<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>'}).join('')}
  function pfDraw(p){var w=who(),nm=(p.fn?(p.fn+' '+(p.ln||'')).trim():w.name);
    pf.innerHTML='<div class="ph"><button type="button" data-k="pfback" aria-label="Back"><i class="fa-solid fa-chevron-left"></i></button><b>Edit Profile</b></div><div class="bd">'+
      '<div class="top"><div class="pw"><div class="pav" id="pfAv">'+avatar(p)+'</div><label class="cam" aria-label="Change photo"><i class="fa-solid fa-camera"></i><input type="file" id="pfFile" accept="image/*" hidden></label></div><div style="min-width:0"><div class="tn" id="pfTn">'+esc(nm)+'</div><div class="tr">Student</div></div></div>'+
      fld('pf_fn','First Name','<input id="pf_fn" maxlength="40" autocomplete="given-name" value="'+esc(p.fn||'')+'"><i class="fa-regular fa-user ic"></i>')+
      fld('pf_ln','Last Name','<input id="pf_ln" maxlength="40" autocomplete="family-name" value="'+esc(p.ln||'')+'"><i class="fa-regular fa-user ic"></i>')+
      '<div class="f"><label for="pf_ph">Phone Number</label><div class="phn"><span>🇵🇰 +92</span><input id="pf_ph" inputmode="numeric" maxlength="11" placeholder="3001234567" value="'+esc(p.ph||'')+'"></div></div>'+
      fld('pf_ad','Address','<input id="pf_ad" maxlength="150" autocomplete="street-address" value="'+esc(p.addr||'')+'"><i class="fa-solid fa-location-dot ic"></i>')+
      fld('pf_pr','Province','<select id="pf_pr">'+opts(PROV,p.prov,'Select province')+'</select>')+
      fld('pf_ct','City','<input id="pf_ct" maxlength="40" list="pfCities" value="'+esc(p.city||'')+'"><datalist id="pfCities">'+CITY.map(function(c){return '<option value="'+c+'">'}).join('')+'</datalist><i class="fa-solid fa-city ic"></i>')+
      fld('pf_gn','Gender','<select id="pf_gn">'+opts(['Male','Female'],p.gen,'Select gender')+'</select>')+
      fld('pf_db','Date of Birth','<input id="pf_db" type="date" min="1960-01-01" max="2015-12-31" value="'+esc(p.dob||'')+'">')+
      fld('pf_zp','Zip Code','<input id="pf_zp" inputmode="numeric" maxlength="6" value="'+esc(p.zip||'')+'">')+
      '<button type="button" class="sv" id="pfSave">Update Profile</button><div class="pm" id="pfMsg" role="status"></div></div>';
    document.getElementById('pf_ph').oninput=function(){this.value=this.value.replace(/\D/g,'').replace(/^0+/,'').slice(0,10)};
    document.getElementById('pf_zp').oninput=function(){this.value=this.value.replace(/\D/g,'').slice(0,6)};
    document.getElementById('pfFile').onchange=function(){var f=this.files&&this.files[0];if(f)pickPhoto(f);this.value=''};
    document.getElementById('pfSave').onclick=pfSave}
  function msg(t,c){var m=document.getElementById('pfMsg');if(m){m.className='pm '+(c||'');m.textContent=t}}
  function pickPhoto(f){if(!/^image\//.test(f.type||'image/')){msg('Please choose a picture.','bad');return}
    var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var S=256,c=document.createElement('canvas');c.width=c.height=S;var x=c.getContext('2d'),m=Math.min(im.width,im.height);
      x.fillStyle='#fff';x.fillRect(0,0,S,S);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S,S);var q=.82,d=c.toDataURL('image/jpeg',q);while(d.length>90000&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q)}
      pfData.photo=d;document.getElementById('pfAv').innerHTML='<img alt="" src="'+d+'">';msg('Photo ready. Press Update Profile to save it.')};
      im.onerror=function(){msg('Could not open this picture. Try another one.','bad')};im.src=r.result};r.readAsDataURL(f)}
  function val(id){var e=document.getElementById(id);return e?e.value.trim():''}
  function pfSave(){var u=window.__acUser?window.__acUser():null,db=window.__acDb?window.__acDb():null;if(!u||!db){msg('Please check your internet and try again.','bad');return}
    var d={fn:val('pf_fn'),ln:val('pf_ln'),ph:val('pf_ph'),addr:val('pf_ad'),prov:val('pf_pr'),city:val('pf_ct'),gen:val('pf_gn'),dob:val('pf_db'),zip:val('pf_zp'),photo:pfData.photo||'',email:u.email||''};
    if(!d.fn){msg('Please write your first name.','bad');return}
    if(d.ph&&!/^3\d{9}$/.test(d.ph)){msg('Phone number: write 10 digits after +92, like 3001234567.','bad');return}

    var b=document.getElementById('pfSave');b.disabled=true;msg('Saving...');
    var out={};for(var k in d)out[k]=d[k];out.t=db.FB.serverTimestamp();

  function pfOpen(){if(pf)return;pfData=getProf();pf=document.createElement('div');pf.id='pfPage';pf.setAttribute('role','dialog');pf.setAttribute('aria-label','Edit Profile');document.body.appendChild(pf);pfDirty=false;pfDraw(pfData);pf.addEventListener('input',function(){pfDirty=true});pf.addEventListener('change',function(){pfDirty=true});
    void pf.offsetWidth;requestAnimationFrame(function(){if(pf)pf.classList.add('open')});

    var u=window.__acUser?window.__acUser():null,db=window.__acDb?window.__acDb():null;
    if(u&&db)db.FB.getDoc(db.FB.doc(db.fs,'profiles',u.uid)).then(function(s){if(!s.exists()||!pf)return;var x=s.data();delete x.t;try{localStorage.setItem(profKey(),JSON.stringify(x))}catch(e){}hiSync();
      if(!pfDirty){pfData=x;pfDraw(x)}}).catch(function(){})}
  function pfClose(){if(!pf)return;var p=pf;pf=null;p.classList.remove('open');p.style.pointerEvents='none';setTimeout(function(){p.remove()},340)}
  function open(){if(dr)return;bk=document.createElement('div');bk.id='drBack';dr=document.createElement('div');dr.id='drawer';dr.setAttribute('role','dialog');dr.setAttribute('aria-label','Menu');

    void dr.offsetWidth;requestAnimationFrame(function(){if(bk)bk.classList.add('open');if(dr)dr.classList.add('open')});
    bk.onclick=function(){if(pushed&&history.state&&history.state.dr)history.back();else close()};
    dr.onclick=function(e){var b=e.target.closest('[data-k]');if(!b)return;var k=b.getAttribute('data-k');
