<style id="admCss">

<script>
(function(){
  var D={"t": {"ic": "<svg viewBox=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"/><path d=\"M9 4h6v3H9z\"/><path d=\"M8.5 12l2 2 4-4\"/><path d=\"M8.5 17h7\"/></svg>", "t": "Initial Test", "d": "03 Nov 2026 • D.I. Khan • 64 questions shared", "s": "done", "a": "#16a34a", "b": "#22c55e", "h": "<div class=\"ax-hero\"><div class=\"ax-k\">🪖 PMA 159 LONG COURSE</div><h2>My Complete Test Experience</h2><div class=\"ax-meta\"><span>👤 Asadullah</span><span>📍 D.I. Khan</span><span>📅 03 Nov 2026</span><span>⏰ 07:00 – 09:00 AM</span></div><div class=\"ax-pass\">✅ Alhamdulillah, PASSED! ❤️🇵🇰</div></div><div class=\"ax-s\"><button type=\"button\" class=\"ax-sh\"><span class=\"ax-si\">🔤</span><span class=\"ax-st\"><b>Verbal Intelligence</b><small>24 questions • Moderate</small></span><span class=\"ax-ar\">▸</span></button><div class=\"ax-sb\"><p>Verbal portion was moderate. Most questions were based on basic mathematics, analytical reasoning, alphabetical series and general IQ.</p><ol start=\"1\"><li>What is 90% of 90?</li><li>What is 90% of 60?</li><li>What is the log of 100?</li><li>Find one-third of 10% of 90.</li><li>Find one-third of 10% of 120.</li><li>What is one-quarter of one-tenth of 120?</li><li>If 5 persons write 5 pages in 5 minutes, how much time will 1 person take to write 1 page?</li><li>A class has 500 students, 340 boys and 160 girls. Find the percentage of girls.</li><li>Today is Monday. What day will it be after 15 days?</li><li>A train moves twice as fast as a car. If the car moves at 60 km/h, how far will the train travel in 30 minutes?</li><li>A man walks North, turns left and then turns left again. What is his final direction?</li><li>Rida is 5 years old and Ali is 3 times her age. What will be Ali&#x27;s age when Rida is 20?</li><li>Rearrange the letters: PDOLERA.</li><li>ROUGH : SMOOTH :: CRUDE : ?</li><li>PRESENT : PAST :: PRECEDING : ?</li><li>Find the next term: 1Z, 3X, 5V, 7T, __?</li><li>Find the letters that look the same in a mirror: MVTWTVM.</li><li>Find a word using the 18th, 5th, 19th and 20th letters.</li><li>Find the odd one out: Monkey, Chimpanzee, Panda.</li><li>Find the odd one out: Football and other given options.</li><li>A committee has 24 members, including 6 males. Find the female percentage.</li><li>There are 30 passengers and 2/3 are males. Find the number of females.</li><li>Why do we boil milk?</li><li>Why do parents send their children to school?</li></ol></div></div><div class=\"ax-s\"><button type=\"button\" class=\"ax-sh\"><span class=\"ax-si\">🧩</span><span class=\"ax-st\"><b>Non-Verbal Intelligence</b><small>10 patterns • Moderate</small></span><span class=\"ax-ar\">▸</span></button><div class=\"ax-sb\"><p>Non-verbal portion was moderate and included different figure-based questions.</p><ol start=\"1\"><li>Mirror image questions.</li><li>Clockwise rotation.</li><li>Anticlockwise rotation.</li><li>Missing figures.</li><li>Complete the missing parts of pictures.</li><li>Triangle, square and rectangular shape patterns.</li><li>Arrange the arrows in the correct sequence.</li><li>Identify the next figure in a series.</li><li>Identify similar and different figures.</li><li>Figure rotation and shape recognition.</li></ol></div></div><div class=\"ax-s\"><button type=\"button\" class=\"ax-sh\"><span class=\"ax-si\">📚</span><span class=\"ax-st\"><b>Academic Portion</b><small>30 questions • Easy</small></span><span class=\"ax-ar\">▸</span></button><div class=\"ax-sb\"><p>Academic portion was comparatively easy and covered Pakistan Studies, Islamic Studies, General Knowledge, History and Current Affairs.</p><h4>🕌 Islamic Studies</h4><ol start=\"1\"><li>Against whom was Ghazwa Badr fought?</li><li>Which Ghazwa is also called Ghazwa Ahzab?</li><li>Who was the adopted son of Prophet Muhammad ﷺ?</li><li>What was the main objective of the Khilafat Movement?</li></ol><h4>🇵🇰 Pakistan Studies &amp; History</h4><ol start=\"5\"><li>What is the longest river of Pakistan?</li><li>On which date did Pakistan join the UN?</li><li>Which agreement was signed after the 1965 Indo-Pak War?</li><li>Who was the first Chief Justice of Pakistan?</li><li>Who became Prime Minister after Liaquat Ali Khan?</li><li>Who was the head of state under the 1973 Constitution?</li><li>When did the Partition of Bengal take place?</li><li>Who was the British Prime Minister at the time of the Partition of the Subcontinent?</li><li>Which rivers were given to Pakistan under the Indus Waters Treaty?</li><li>Through which route did invaders enter the Subcontinent?</li><li>What was the price paid by Gulab Singh to purchase Kashmir?</li><li>Who built the Badshahi Mosque?</li><li>When were the Minto-Morley Reforms introduced?</li><li>When did the Chauri Chaura Incident take place?</li><li>When was the Ottoman Empire founded?</li></ol><h4>🌍 General Knowledge &amp; Current Affairs</h4><ol start=\"20\"><li>Where is NATO Headquarters located?</li><li>Which is the largest planet in the Solar System?</li><li>Which planet has the highest number of moons?</li><li>What is the capital of Ghana?</li><li>Lira is the currency of which country?</li><li>Who is the current President of France?</li><li>What is the plain face count of a prism?</li><li>What is the antonym of Modesty?</li><li>What is the synonym of Refrain?</li><li>Identify the odd one out: Islamabad, Karachi, Quetta and Lahore.</li><li>Who invented the World Wide Web (WWW)?</li></ol></div></div><div class=\"ax-s\"><button type=\"button\" class=\"ax-sh\"><span class=\"ax-si\">💡</span><span class=\"ax-st\"><b>Overall Experience &amp; Advice</b><small>6 tips</small></span><span class=\"ax-ar\">▸</span></button><div class=\"ax-sb\"><p>Overall, the test was moderate and manageable. Verbal required quick calculations and logical thinking, while Non-Verbal required concentration and pattern recognition. Academic was mostly based on Pakistan Studies, Islamic Studies, General Knowledge and History.</p><ul class=\"ax-ok\"><li><b>⏰ Time management is the MOST important. Focus on managing your time more than anything else.</b></li><li>Practice basic mathematics and percentages.</li><li>Prepare alphabetical series and coding/decoding.</li><li>Practice mirror images and figure patterns.</li><li>Revise Pakistan Studies and Islamic Studies.</li><li>Improve your speed and time management.</li></ul><p class=\"ax-end\">Best of luck to all PMA 159 candidates!<br>🇵🇰 Pakistan Army Zindabad!</p></div></div>"}, "m": {"ic": "<svg viewBox=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z\"/><path d=\"M6.5 12h3l1.5-2.5 2 5 1.5-2.5h3\"/></svg>", "t": "Initial Medical", "d": "03 Nov 2026 • what they checked", "s": "done", "a": "#0284c7", "b": "#38bdf8", "h": "<div class=\"ax-hero\" style=\"background:linear-gradient(135deg,#075985,#0284c7)\"><div class=\"ax-k\">🩺 INITIAL MEDICAL</div><h2>Initial Medical</h2><div class=\"ax-meta\"><span>📅 03 Nov 2026</span><span>📍 D.I. Khan</span></div><div class=\"ax-pass\">✅ Alhamdulillah, PASSED!</div></div><div class=\"ax-s open\"><button type=\"button\" class=\"ax-sh\"><span class=\"ax-si\">🩺</span><span class=\"ax-st\"><b>What is usually checked</b><small>General guide</small></span><span class=\"ax-ar\">▸</span></button><div class=\"ax-sb\"><ul class=\"ax-ok\"><li><b>Eyesight</b>: checked without glasses.</li><li><b>Height</b>: see the Eligibility step in the Roadmap.</li><li><b>Weight / BMI</b>: check yours in the BMI tab.</li><li><b>Flat feet</b>: the arch of the foot is checked.</li><li><b>Knock knees</b>: stand with feet together; they check if the knees touch.</li><li><b>Chest</b>: chest size and expansion are measured.</li></ul><p class=\"ax-sm\">General guide only; follow the instructions at your centre.</p></div></div>"}, "p": {"ic": "<svg viewBox=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"14.5\" cy=\"4.5\" r=\"1.8\" fill=\"#fff\"/><path d=\"M8 21l3-6 3 2v5\"/><path d=\"M11 15l1.5-6 3.5 3h3\"/><path d=\"M12.5 9L9 8.5 6.5 11\"/></svg>", "t": "Initial Physical Test", "d": "Coming soon", "s": "lock", "a": "#ea580c", "b": "#fb923c", "h": "<div class=\"ax-hero\" style=\"background:linear-gradient(135deg,#9a3412,#ea580c)\"><div class=\"ax-k\">🏃 INITIAL PHYSICAL TEST</div><h2>Initial Physical Test</h2><div class=\"ax-pass\" style=\"background:#ffedd5;color:#9a3412\">🔒 Coming soon</div></div><div class=\"ax-note\">My physical test has not happened yet. I will share my experience here after it, In shaa Allah.</div>"}, "i": {"ic": "<svg viewBox=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h11a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H9l-4 3v-3H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z\"/><path d=\"M19 9h1a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-1v3l-4-3h-3\"/></svg>", "t": "Initial Interview", "d": "Coming soon", "s": "lock", "a": "#7c3aed", "b": "#a855f7", "h": "<div class=\"ax-hero\" style=\"background:linear-gradient(135deg,#5b21b6,#8b5cf6)\"><div class=\"ax-k\">🗣️ INITIAL INTERVIEW</div><h2>Initial Interview</h2><div class=\"ax-pass\" style=\"background:#ede9fe;color:#5b21b6\">🔒 Coming soon</div></div><div class=\"ax-note\">My interview has not happened yet. I will share my experience here after it, In shaa Allah.</div>"}, "s": {"ic": "<svg viewBox=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 2l4 6 4-6\"/><circle cx=\"12\" cy=\"14.5\" r=\"6\"/><path d=\"M12 11.5l1 2 2.2.3-1.6 1.5.4 2.2-2-1.1-2 1.1.4-2.2-1.6-1.5 2.2-.3z\" fill=\"#fff\" stroke-width=\"1\"/></svg>", "t": "ISSB", "d": "Later • 4-day guide coming", "s": "lock", "a": "#b45309", "b": "#f59e0b", "h": "<div class=\"ax-hero\" style=\"background:linear-gradient(135deg,#92400e,#f59e0b)\"><div class=\"ax-k\">🎖️ ISSB</div><h2>ISSB</h2><p>The 4-day selection board after the interview.</p><div class=\"ax-pass\" style=\"background:#fef3c7;color:#92400e\">🔒 Coming soon</div></div><div class=\"ax-note\">I will share my ISSB guide and experience here, In shaa Allah.</div>"}},order=['t','m','p','i','s'],view=null,host=null;
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function tag(s){return s==='done'?'<span class="ax-tag ax-done">✅ Passed</span>':s==='next'?'<span class="ax-tag ax-next">⏳ Next</span>':'<span class="ax-tag ax-lock">🔒 Soon</span>'}
  function list(){return '<div class="ax"><div class="ax-top"><div class="ax-k">🪖 PMA 159 LONG COURSE</div><h2>Admin Experience</h2><p>My journey, step by step. Tap a stage to read.</p></div>'+
    order.map(function(k){var x=D[k];return '<button type="button" class="ax-r'+(x.s==='lock'?' lock':'')+'" data-ax="'+k+'"><span class="ax-ri" style="background:linear-gradient(135deg,'+x.a+','+x.b+')">'+x.ic+'</span><span class="ax-rc"><span class="h"><b>'+esc(x.t)+'</b>'+tag(x.s)+'</span><small>'+esc(x.d)+'</small><span class="ax-go">Open →</span></span></button>'}).join('')+'</div>'}
  function page(k){return '<div class="ax"><button type="button" class="ax-bk" data-axb="1">← Back</button>'+D[k].h+'</div>'}
  function draw(){if(!host)return;host.innerHTML=view?page(view):list();try{host.scrollTop=0}catch(e){}}
  window.__admHtml=function(){view=null;return list()};
  window.__admWire=function(pg){host=pg;view=null;pg.onclick=function(e){
    var b=e.target.closest('[data-axb]');if(b){if(view){try{history.back()}catch(x){view=null;draw()}}return}

  window.__admBack=function(){if(host&&view&&document.getElementById('nbPage')===host){view=null;draw();return true}return false};
})();
