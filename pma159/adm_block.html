<script>
(function(){
  var D={"t": {"ic": "📝", "t": "Initial Test", "d": "03 Nov 2026 • D.I. Khan • 63 questions shared", "s": "done", "a": "#16a34a", "b": "#22c55e", "h": "<div class=\"ax-hero\"><div class=\"ax-k\">🪖 PMA 159 LONG COURSE</div><h2>My Complete Test Experience</h2><div class=\"ax-meta\"><span>👤 Asadullah</span><span>📍 D.I. Khan</span><span>📅 03 Nov 2026</span><span>⏰ 07:00 – 09:00 AM</span></div><div class=\"ax-pass\">✅ Alhamdulillah, PASSED! ❤️🇵🇰</div></div><div class=\"ax-s open\"><button type=\"button\" class=\"ax-sh\"><span class=\"ax-si\">🔤</span><span class=\"ax-st\"><b>Verbal Intelligence</b><small>24 questions • Moderate</small></span><span class=\"ax-ar\">▸</span></button><div class=\"ax-sb\"><p>Verbal portion was moderate. Most questions were based on basic mathematics, analytical reasoning, alphabetical series and general IQ.</p><ol start=\"1\"><li>What is 90% of 90?</li><li>What is 90% of 60?</li><li>What is the log of 100?</li><li>Find one-third of 10% of 90.</li><li>Find one-third of 10% of 120.</li><li>What is one-quarter of one-tenth of 120?</li><li>If 5 persons write 5 pages in 5 minutes, how much time will 1 person take to write 1 page?</li><li>A class has 500 students, 340 boys and 160 girls. Find the percentage of girls.</li><li>Today is Monday. What day will it be after 15 days?</li><li>A train moves twice as fast as a car. If the car moves at 60 km/h, how far will the train travel in 30 minutes?</li><li>A man walks North, turns left and then turns left again. What is his final direction?</li><li>Rida is 5 years old and Ali is 3 times her age. What will be Ali&#x27;s age when Rida is 20?</li><li>Rearrange the letters: PDOLERA.</li><li>ROUGH : SMOOTH :: CRUDE : ?</li><li>PRESENT : PAST :: PRECEDING : ?</li><li>Find the next term: 1Z, 3X, 5V, 7T, __?</li><li>Find the letters that look the same in a mirror: MVTWTVM.</li><li>Find a word using the 18th, 5th, 19th and 20th letters.</li><li>Find the odd one out: Monkey, Chimpanzee, Panda.</li><li>Find the odd one out: Football and other given options.</li><li>A committee has 24 members, including 6 males. Find the female percentage.</li><li>There are 30 passengers and 2/3 are males. Find the number of females.</li><li>Why do we boil milk?</li><li>Why do parents send their children to school?</li></ol></div></div><div class=\"ax-s\"><button type=\"button\" class=\"ax-sh\"><span class=\"ax-si\">🧩</span><span class=\"ax-st\"><b>Non-Verbal Intelligence</b><small>10 patterns • Moderate</small></span><span class=\"ax-ar\">▸</span></button><div class=\"ax-sb\"><p>Non-verbal portion was moderate and included different figure-based questions.</p><ol start=\"1\"><li>Mirror image questions.</li><li>Clockwise rotation.</li><li>Anticlockwise rotation.</li><li>Missing figures.</li><li>Complete the missing parts of pictures.</li><li>Triangle, square and rectangular shape patterns.</li><li>Arrange the arrows in the correct sequence.</li><li>Identify the next figure in a series.</li><li>Identify similar and different figures.</li><li>Figure rotation and shape recognition.</li></ol></div></div><div class=\"ax-s\"><button type=\"button\" class=\"ax-sh\"><span class=\"ax-si\">📚</span><span class=\"ax-st\"><b>Academic Portion</b><small>29 questions • Easy</small></span><span class=\"ax-ar\">▸</span></button><div class=\"ax-sb\"><p>Academic portion was comparatively easy and covered Pakistan Studies, Islamic Studies, General Knowledge, History and Current Affairs.</p><h4>🕌 Islamic Studies</h4><ol start=\"1\"><li>Against whom was Ghazwa Badr fought?</li><li>Which Ghazwa is also called Ghazwa Ahzab?</li><li>Who was the adopted son of Prophet Muhammad ﷺ?</li><li>What was the main objective of the Khilafat Movement?</li></ol><h4>🇵🇰 Pakistan Studies &amp; History</h4><ol start=\"5\"><li>What is the longest river of Pakistan?</li><li>On which date did Pakistan join the UN?</li><li>Which agreement was signed after the 1965 Indo-Pak War?</li><li>Who was the first Chief Justice of Pakistan?</li><li>Who became Prime Minister after Liaquat Ali Khan?</li><li>Who was the head of state under the 1973 Constitution?</li><li>When did the Partition of Bengal take place?</li><li>Who was the British Prime Minister at the time of the Partition of the Subcontinent?</li><li>Which rivers were given to Pakistan under the Indus Waters Treaty?</li><li>Through which route did invaders enter the Subcontinent?</li><li>What was the price paid by Gulab Singh to purchase Kashmir?</li><li>Who built the Badshahi Mosque?</li><li>When were the Minto-Morley Reforms introduced?</li><li>When did the Chauri Chaura Incident take place?</li><li>When was the Ottoman Empire founded?</li></ol><h4>🌍 General Knowledge &amp; Current Affairs</h4><ol start=\"20\"><li>Where is NATO Headquarters located?</li><li>Which is the largest planet in the Solar System?</li><li>Which planet has the highest number of moons?</li><li>What is the capital of Ghana?</li><li>Lira is the currency of which country?</li><li>Who is the current President of France?</li><li>What is the plain face count of a prism?</li><li>What is the antonym of Modesty?</li><li>What is the synonym of Refrain?</li><li>Identify the odd one out: Islamabad, Karachi, Quetta and Lahore.</li></ol></div></div><div class=\"ax-s\"><button type=\"button\" class=\"ax-sh\"><span class=\"ax-si\">💡</span><span class=\"ax-st\"><b>Overall Experience &amp; Advice</b><small>5 tips</small></span><span class=\"ax-ar\">▸</span></button><div class=\"ax-sb\"><p>Overall, the test was moderate and manageable. Verbal required quick calculations and logical thinking, while Non-Verbal required concentration and pattern recognition. Academic was mostly based on Pakistan Studies, Islamic Studies, General Knowledge and History.</p><ul class=\"ax-ok\"><li>Practice basic mathematics and percentages.</li><li>Prepare alphabetical series and coding/decoding.</li><li>Practice mirror images and figure patterns.</li><li>Revise Pakistan Studies and Islamic Studies.</li><li>Improve your speed and time management.</li></ul><p class=\"ax-end\">Best of luck to all PMA 159 candidates!<br>🇵🇰 Pakistan Army Zindabad!</p></div></div>"}, "m": {"ic": "🩺", "t": "Initial Medical", "d": "03 Nov 2026 • what they checked", "s": "done", "a": "#0284c7", "b": "#38bdf8", "h": "<div class=\"ax-hero\" style=\"background:linear-gradient(135deg,#075985,#0284c7)\"><div class=\"ax-k\">🩺 INITIAL MEDICAL</div><h2>Initial Medical</h2><div class=\"ax-meta\"><span>📅 03 Nov 2026</span><span>📍 D.I. Khan</span></div><div class=\"ax-pass\">✅ Alhamdulillah, PASSED!</div></div><div class=\"ax-note\">✍️ My full medical experience is coming soon.</div><div class=\"ax-s open\"><button type=\"button\" class=\"ax-sh\"><span class=\"ax-si\">🩺</span><span class=\"ax-st\"><b>What is usually checked</b><small>General guide</small></span><span class=\"ax-ar\">▸</span></button><div class=\"ax-sb\"><ul class=\"ax-ok\"><li><b>Eyesight</b>: checked without glasses.</li><li><b>Height</b>: see the Eligibility step in the Roadmap.</li><li><b>Weight / BMI</b>: check yours in the BMI tab.</li><li><b>Ears</b>: keep them clean.</li><li><b>Flat feet</b>: the arch of the foot is checked.</li><li><b>Teeth and general health</b>: a basic check.</li></ul><p class=\"ax-sm\">General guide only; follow the instructions at your centre.</p></div></div>"}, "i": {"ic": "🗣️", "t": "Initial Interview", "d": "Coming next • full guide inside", "s": "next", "a": "#7c3aed", "b": "#a855f7", "h": "<div class=\"ax-hero\" style=\"background:linear-gradient(135deg,#5b21b6,#8b5cf6)\"><div class=\"ax-k\">🗣️ INITIAL INTERVIEW</div><h2>Initial Interview Guide</h2><p>A short one-to-one talk with an officer. They check your confidence, honesty, family background and why you want to join.</p><div class=\"ax-pass\" style=\"background:#ede9fe;color:#5b21b6\">⏳ My interview is next • my notes coming after</div></div><div class=\"ax-s open\"><button type=\"button\" class=\"ax-sh\"><span class=\"ax-si\">❓</span><span class=\"ax-st\"><b>Most asked questions</b><small>With tips</small></span><span class=\"ax-ar\">▸</span></button><div class=\"ax-sb\"><ul class=\"ax-qa\"><li><b>Tell me about yourself.</b><span>Name, city, education, family in 2 lines, hobbies, why Army.</span></li><li><b>Why do you want to join the Army?</b><span>Your own honest reason: service, discipline, leadership.</span></li><li><b>What does your father do?</b><span>Simple and honest; show respect.</span></li><li><b>Your strengths and weaknesses?</b><span>One strength with an example; one weakness you are improving.</span></li><li><b>Any current affairs?</b><span>Know Pakistan's main leaders and recent big news.</span></li></ul></div></div><div class=\"ax-s\"><button type=\"button\" class=\"ax-sh\"><span class=\"ax-si\">🗣️</span><span class=\"ax-st\"><b>Make your introduction</b><small>1 minute</small></span><span class=\"ax-ar\">▸</span></button><div class=\"ax-sb\"><p>Prepare these 6 lines and practise them aloud:</p><ol><li>My name is…</li><li>I am from (city)…</li><li>I studied (FA/FSc, marks)…</li><li>My family: my father is…</li><li>My hobbies are…</li><li>I want to join the Army because…</li></ol></div></div><div class=\"ax-s\"><button type=\"button\" class=\"ax-sh\"><span class=\"ax-si\">🚪</span><span class=\"ax-st\"><b>Inside the room: step by step</b><small>5 steps</small></span><span class=\"ax-ar\">▸</span></button><div class=\"ax-sb\"><ol><li><b>Knock and ask:</b> \"May I come in, Sir?\" Wait for permission.</li><li><b>Greet:</b> \"Assalam o Alaikum, Sir.\" Stand straight.</li><li><b>Sit when told:</b> only sit after \"Have a seat\". Thank him.</li><li><b>Answer:</b> short, honest and clear. Say \"Sir\" politely.</li><li><b>Leave:</b> \"Thank you, Sir.\" Stand, push the chair back, walk out calmly.</li></ol></div></div><div class=\"ax-s\"><button type=\"button\" class=\"ax-sh\"><span class=\"ax-si\">📁</span><span class=\"ax-st\"><b>Documents to carry</b><small>Checklist</small></span><span class=\"ax-ar\">▸</span></button><div class=\"ax-sb\"><ul class=\"ax-ok\"><li>Call letter / roll number slip</li><li>Original CNIC or B-form</li><li>Matric certificate and marks sheet</li><li>FA/FSc certificate or result card</li><li>Domicile</li><li>Passport-size photos</li><li>Black pen and a file</li></ul><p class=\"ax-sm\">Carry originals and 2 photocopies. Check your call letter for the exact list.</p></div></div><div class=\"ax-s\"><button type=\"button\" class=\"ax-sh\"><span class=\"ax-si\">👔</span><span class=\"ax-st\"><b>Dress and body language</b><small>6 tips</small></span><span class=\"ax-ar\">▸</span></button><div class=\"ax-sb\"><ul class=\"ax-ok\"><li>Clean, ironed simple shirt</li><li>Polished formal shoes</li><li>Short, clean haircut</li><li>Sit straight, do not lean</li><li>Calm eye contact</li><li>Clear voice, not too fast</li></ul></div></div><div class=\"ax-s\"><button type=\"button\" class=\"ax-sh\"><span class=\"ax-si\">📚</span><span class=\"ax-st\"><b>Topics to prepare</b><small>6 topics</small></span><span class=\"ax-ar\">▸</span></button><div class=\"ax-sb\"><ul class=\"ax-ok\"><li><b>About you:</b> intro, family, education, hobbies, strengths</li><li><b>Army & PMA:</b> why Army, ranks, PMA Kakul, Nishan-e-Haider</li><li><b>Pakistan:</b> leaders, provinces, capital, key dates</li><li><b>Current affairs:</b> big national news of the last 3 months</li><li><b>Islamiat:</b> basic duties, Kalimas, prayers</li><li><b>Hobbies:</b> know your hobby well; they ask about it</li></ul></div></div><div class=\"ax-s\"><button type=\"button\" class=\"ax-sh\"><span class=\"ax-si\">❌</span><span class=\"ax-st\"><b>Common mistakes</b><small>Avoid these</small></span><span class=\"ax-ar\">▸</span></button><div class=\"ax-sb\"><ul class=\"ax-no\"><li>A memorised speech that sounds like a robot</li><li>Lying about marks or family</li><li>Looking down, no eye contact</li><li>Saying \"I don't know\" without trying</li><li>Talking too long</li><li>Arguing with the officer</li></ul><p><b>Instead:</b> be natural, honest and short. If you don't know, say \"Sorry Sir, I don't know, but I will learn.\"</p></div></div><div class=\"ax-s\"><button type=\"button\" class=\"ax-sh\"><span class=\"ax-si\">🗓️</span><span class=\"ax-st\"><b>7-day practice plan</b><small>One task a day</small></span><span class=\"ax-ar\">▸</span></button><div class=\"ax-sb\"><ol><li>Write your self intro</li><li>Practise it aloud 10 times</li><li>Learn the most asked questions</li><li>Current affairs and Pakistan facts</li><li>Mock interview with a friend</li><li>Dress and body language practice</li><li>Rest, check documents, sleep early</li></ol></div></div><div class=\"ax-s\"><button type=\"button\" class=\"ax-sh\"><span class=\"ax-si\">⏰</span><span class=\"ax-st\"><b>Day before and on the day</b><small>Checklist</small></span><span class=\"ax-ar\">▸</span></button><div class=\"ax-sb\"><p><b>🌙 Day before:</b> iron clothes, polish shoes, haircut, pack documents, sleep early.</p><p><b>☀️ On the day:</b> light breakfast, reach early, stay calm, phone silent, smile and be polite.</p></div></div><p class=\"ax-sm\">General guidance, not official rules.</p>"}, "s": {"ic": "🎖️", "t": "ISSB", "d": "Later • 4-day guide coming", "s": "lock", "a": "#b45309", "b": "#f59e0b", "h": "<div class=\"ax-hero\" style=\"background:linear-gradient(135deg,#92400e,#f59e0b)\"><div class=\"ax-k\">🎖️ ISSB</div><h2>ISSB</h2><p>The 4-day selection board after the interview.</p><div class=\"ax-pass\" style=\"background:#fef3c7;color:#92400e\">🔒 Coming soon</div></div><div class=\"ax-note\">I will share my ISSB guide and experience here, In shaa Allah.</div>"}},order=['t','m','i','s'],view=null,host=null;
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function tag(s){return s==='done'?'<span class="ax-tag ax-done">✅ Passed</span>':s==='next'?'<span class="ax-tag ax-next">⏳ Next</span>':'<span class="ax-tag ax-lock">🔒 Soon</span>'}
  function list(){return '<div class="ax"><div class="ax-top"><div class="ax-k">🪖 PMA 159 LONG COURSE</div><h2>Admin Experience</h2><p>My journey, step by step. Tap a stage to read.</p></div>'+
    order.map(function(k){var x=D[k];return '<button type="button" class="ax-r'+(x.s==='lock'?' lock':'')+'" data-ax="'+k+'"><span class="ax-ri" style="background:linear-gradient(135deg,'+x.a+','+x.b+')">'+x.ic+'</span><span class="ax-rc"><span class="h"><b>'+esc(x.t)+'</b>'+tag(x.s)+'</span><small>'+esc(x.d)+'</small><span class="ax-go">Open →</span></span></button>'}).join('')+'</div>'}
  function page(k){return '<div class="ax"><button type="button" class="ax-bk" data-axb="1">← Back</button>'+D[k].h+'</div>'}
  function draw(){if(!host)return;host.innerHTML=view?page(view):list();try{host.scrollTop=0}catch(e){}}
  window.__admHtml=function(){view=null;return list()};
  window.__admWire=function(pg){host=pg;view=null;pg.onclick=function(e){
    var b=e.target.closest('[data-axb]');if(b){if(view){try{history.back()}catch(x){view=null;draw()}}return}
    var s=e.target.closest('.ax-sh');if(s){s.parentElement.classList.toggle('open');return}
    var r=e.target.closest('[data-ax]');if(r){view=r.getAttribute('data-ax');draw();try{history.pushState({n:1,nb:1,ax:1},'')}catch(x){}}}};
  window.__admBack=function(){if(host&&view&&document.getElementById('nbPage')===host){view=null;draw();return true}return false};
})();
