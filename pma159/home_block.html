<style id="hxCss">
/* home page top (Level A design): fire accuracy ring, fire week, roadmap level, big tiles */
#rngCard{display:none!important}
.hx{--hb:#fff;--ht:#0f172a;--hm:#64748b;--hl:#e2e8f0;margin:0 0 18px;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ht);text-align:left}
html.dark .hx{--hb:#111c33;--ht:#f1f5f9;--hm:#94a3b8;--hl:#1e293b}
.hx button{font:inherit;color:inherit;text-align:left;cursor:pointer}
.hx-top{background:var(--hb);border-radius:24px;padding:16px;box-shadow:0 10px 26px rgba(15,23,42,.08)}html.dark .hx-top{border:1px solid var(--hl);box-shadow:none}
.hx-hd{display:flex;justify-content:space-between;align-items:center}.hx-hd small{color:var(--hm);font-size:13px}.hx-hd h3{margin:0;font-size:22px;font-weight:800;color:var(--ht)}
.hx-pill{background:#fff7ed;color:#c2410c;border-radius:99px;padding:6px 12px;font-weight:800;font-size:13px;white-space:nowrap}html.dark .hx-pill{background:#2a1a0f;color:#fdba74}
.hx-mid{display:flex;gap:14px;align-items:center;margin-top:0}
.hx-ring{position:relative;width:124px;height:124px;flex:none}.hx-ring canvas{width:124px;height:124px;display:block;animation:hxFl 1.1s ease-in-out infinite}@keyframes hxFl{50%{filter:brightness(1.12) saturate(1.1)}}
.hx-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}.hx-in b{font-size:22px;font-weight:800;color:var(--ht)}.hx-in span{font-size:8px;font-weight:800;color:var(--hm)}.hx-in em{font-style:normal;font-size:16px;line-height:1}
.hx-l{flex:1}.hx-l div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--hl);font-size:14.5px}.hx-l div:last-child{border:0}.hx-l span{color:var(--hm)}.hx-l b.r{color:#e11d48}
.hx-wk{display:flex;justify-content:space-between;margin-top:12px}.hx-d{text-align:center;font-size:11px;font-weight:700;color:var(--hm)}.hx-d i{display:flex;width:32px;height:32px;margin:0 auto 4px;align-items:center;justify-content:center;font-style:normal;border-radius:50%;background:#f1f5f9;border:2px solid #e2e8f0;font-size:0}
.hx-d i:before{content:"\00b7";font-size:22px;color:#94a3b8}html.dark .hx-d i{background:#1e293b;border-color:#334155}
.hx-d.on i{background:none;border:0;font-size:24px;filter:drop-shadow(0 0 6px #f97316);animation:hxF 1.2s ease-in-out infinite}.hx-d.on i:before{content:none}@keyframes hxF{50%{transform:scale(1.15)}}
.hx-d.today span{color:var(--ht);font-weight:900}
.hx-rm{display:block;width:100%;border:0;margin-top:12px;border-radius:20px;padding:14px;background:linear-gradient(135deg,#2e4a1e,#4d7c2a);color:#fff!important;box-shadow:0 8px 20px rgba(46,74,30,.3)}
.hx-rt{display:flex;align-items:center;gap:12px}.hx-bd{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,#f1d27a,#c9a43a);color:#2e4a1e;font-weight:900;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}.hx-bd small{font-size:9px}
.hx-rx{flex:1;min-width:0}.hx-rx small{display:block;font-size:11px;opacity:.8;font-weight:800;letter-spacing:.08em}.hx-rx b{display:block;font-size:16px}.hx-rx span{font-size:12px;opacity:.85}.hx-rt em{font-style:normal;font-size:20px}
.hx-tr{display:flex;gap:5px;margin-top:12px;align-items:center}.hx-tr i{flex:1;height:12px;border-radius:99px;box-sizing:border-box}
.hx-sd{background:linear-gradient(90deg,#f1d27a,#f59e0b);box-shadow:0 0 8px #f59e0b}.hx-sn{border:2px solid rgba(255,255,255,.95)}
.hx-sc{flex:0 0 52px!important;height:30px!important;border-radius:10px!important;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(255,255,255,.35),0 0 16px rgba(255,255,255,.8);animation:hxB 1.6s ease-in-out infinite}
.hx-sc b{font-size:17px;animation:hxL 1s steps(1) infinite}@keyframes hxL{50%{opacity:.35}}@keyframes hxB{50%{box-shadow:0 0 0 5px rgba(255,255,255,.2),0 0 24px rgba(255,255,255,.95)}}
.hx-ft{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;margin-top:8px;font-weight:700}.hx-ft span{opacity:.85}.hx-ft b{font-size:13px;font-weight:900;letter-spacing:.06em}
.hx-big{display:flex;gap:10px;margin-top:12px}.hx-big button,.hx-sm button{flex:1;min-width:0;border:0;border-radius:18px;padding:13px 12px;display:flex;flex-direction:column;align-items:flex-start;box-shadow:0 6px 16px rgba(15,23,42,.06)}
.hx-ic{font-style:normal;font-size:20px;display:flex;width:40px;height:40px;border-radius:12px;align-items:center;justify-content:center;background:rgba(255,255,255,.25)}
.hx-big b,.hx-sm b{display:block;font-size:14px;margin-top:8px}.hx-big small,.hx-sm small{font-size:11.5px;opacity:.8}
.hx-cr{background:linear-gradient(135deg,#be123c,#ec4899);color:#fff!important}.hx-dc{background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff!important}
.hx-sm{display:flex;gap:10px;margin-top:10px}.hx-sm button{background:var(--hb)}html.dark .hx-sm button{border:1px solid var(--hl);box-shadow:none}
.hx-ic.m{background:#fee2e2}.hx-ic.s{background:#fef3c7}.hx-ic.q{background:#dbeafe}
.hx .hx-sm button{border:2px solid #fff7c2!important;outline:2px solid #f59e0b;outline-offset:2px;box-shadow:0 0 12px rgba(250,204,21,.9),0 0 25px rgba(245,158,11,.42)!important}
.hx .hx-big,.hx .hx-sm{gap:13px}.hx .hx-big,.hx .hx-sm,.hx .hx-rm{margin-top:15px}
.hx .hx-rm{background:linear-gradient(135deg,#7c2d12,#ea580c)!important;box-shadow:0 0 0 2px #fff,0 0 16px #ea580c!important}
.hx .hx-cr{background:linear-gradient(135deg,#be123c,#fb7185)!important;box-shadow:0 0 0 2px #fff,0 0 16px #fb7185!important}
.hx .hx-dc{background:linear-gradient(135deg,#d97706,#fde047)!important;box-shadow:0 0 0 2px #fff,0 0 16px #f59e0b!important}
.hx .hx-top{background:linear-gradient(135deg,#fff7ed,#fef3c7)!important;box-shadow:0 0 0 2px #fff,0 0 16px rgba(249,115,22,.55)!important}
html.dark .hx .hx-top{background:linear-gradient(135deg,#2a1608,#3a2a0a)!important;box-shadow:0 0 0 2px rgba(255,255,255,.25),0 0 16px rgba(249,115,22,.45)!important}
.hx .hx-big,.hx .hx-rm{margin-top:16px}
</style>
