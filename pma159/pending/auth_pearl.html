<style id="authPearl">
/* login page in the same cream colours as the sign-up steps (#obWz) */
#auth{--bg:#fbf8f0;--tx:#2b2416;--mu:#8a7a5a;--ln:#e1d8c4;--bb:linear-gradient(180deg,#fbf6ea,#ece2cb);--bt:#3b2f1a;--bd:#d9cba9;--ac:#8a6a2a;background:var(--bg)!important;color:var(--tx)!important}
html.dark #auth{--bg:#1b1814;--tx:#f3eee2;--mu:#b9ab8c;--ln:#3d362c;--bb:linear-gradient(180deg,#3b342b,#2a251f);--bt:#f3eee2;--bd:#4b4338;--ac:#e2d3b0}
#auth .sky,#auth .logo{display:none!important}
#auth .side,#auth .wrap{background:transparent!important;box-shadow:none!important;border:0!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
#auth .wrap::before,#auth .wrap::after,#auth .side::before,#auth .side::after{display:none!important}
#auth .brand,#auth .brand small,#auth h2{color:var(--tx)!important}
#auth .pane .sub,#auth .copy,#auth .foot,#auth .orr,#auth .chk{color:var(--mu)!important}
#auth .fld label{color:var(--mu)!important;font-weight:700}
#auth .in{background:transparent!important;border:1.5px solid var(--ln)!important;border-radius:14px!important;color:var(--tx)!important;box-shadow:none!important;height:52px}
#auth .in:focus{border-color:var(--ac)!important}
#auth .in::placeholder{color:var(--mu)!important;opacity:.7}
#auth .eye{color:var(--mu)!important}
#auth .btn{background:var(--bb)!important;color:var(--bt)!important;border:1px solid var(--bd)!important;box-shadow:0 8px 20px rgba(120,95,40,.16)!important;border-radius:16px!important;height:54px;font-weight:800!important}
#auth .btn::before,#auth .btn::after{display:none!important}
#auth .guest,#auth .gbtn{background:transparent!important;color:var(--tx)!important;border:1.5px solid var(--ln)!important;box-shadow:none!important;border-radius:16px!important}
#auth .opts a,#auth .foot a{color:var(--ac)!important;font-weight:800}
#auth .chk input{accent-color:var(--ac)}
</style>
