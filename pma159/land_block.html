    MEM[k]=(function(){var C=window.caches;
      function net(){return fetch(url).then(function(r){if(!r.ok)throw new Error('http '+r.status);if(C){var c2=r.clone();C.open('pma-lz').then(function(c){c.put(url,c2);c.keys().then(function(ks){ks.forEach(function(q){var u=q.url;if(u.indexOf('/lz/'+name+'.')>-1&&u.indexOf(k)<0)c.delete(q)})})}).catch(function(){})}return r.json()})}

})();

  function go(k,push){if(k!=='home'&&k!=='pmahome'&&k!=='soon'&&!FH[k]&&!isOpen(k)){lockMsg();k='home'}ST=k;if(k==='home'){home()}else if(k==='pmahome'){pmaHome();locks()}else if(FH[k]){L.innerHTML=FH[k]}else if(k==='books'){if(!window.__acAdmin){go('home');return}booksPage()}else if(k==='issb'&&window.__issbRender){L.innerHTML='<button type="button" class="lback" data-go="home"><i class="fa-solid fa-arrow-left"></i> Main page</button><div id="issbHost"></div>';window.__issbRender(document.getElementById('issbHost'))}else if(k==='int'&&window.__intRender){L.innerHTML='<button type="button" class="lback" data-go="home"><i class="fa-solid fa-arrow-left"></i> Main page</button><div id="intHost"></div>';window.__intRender(document.getElementById('intHost'))}else if(k!=='pma')soon(k);show();try{window.__backSync&&window.__backSync()}catch(e){}if(push)try{history.pushState({n:1},'')}catch(e){}window.scrollTo(0,0)}
  L.addEventListener('click',function(e){var rdb=e.target.closest('[data-read]');if(rdb){openReader(+rdb.getAttribute('data-read'));return}if(e.target.closest('[data-buy]')){lockMsg('<b>Locked.</b> To get this PDF, message the admin on <b>TikTok @journeytopma</b>.<span class="lmgo">Tap here to open Social</span>');return}var t=e.target.closest('[data-go]');if(!t)return;var k=t.getAttribute('data-go');if(k==='soon'){lockMsg('<b>Coming soon.</b> Data for this course is being uploaded right now. It will open here soon, In shaa Allah.<span class="lmgo">📩 Contact the admin here (TikTok)</span>');return}if(t.getAttribute('data-go')==='issb'&&!window.__acAdmin){lockMsg('<b>Coming soon.</b> ISSB preparation data is being uploaded right now. It will open here soon, In shaa Allah.<span class="lmgo">📩 Contact the admin here (TikTok)</span>');return}if(t.classList.contains('locked')){lockMsg();return}if(k==='home'){if(history.state&&history.state.n)history.back();else go('home')}else go(k,true)});
  bk.addEventListener('click',function(){if(history.state&&history.state.n)history.back();else go('home')});
  /* phone Back button / header Back: from the categories or a 'coming soon' page go back to the main page */
  window.__landBack=function(){if(closePay())return true;if(ST==='pmahome'||FH[ST]){go('home');return true}if(closeReader())return true;if(ST==='int'&&window.__intBack&&window.__intBack())return true;if(ST==='issb'&&window.__issbBack&&window.__issbBack())return true;if(atMenu()&&ST!=='home'){go('home');return true}return false};
  window.__landAtHome=function(){return ST==='home'};window.__landHome=function(){go('home')};
  setInterval(show,400);
  go('home');
}
var tries=0;(function wait(){if(document.getElementById('view-select')&&document.getElementById('sec-menu'))init();else if(tries++<200)setTimeout(wait,50)})();  /* the page can be written in later by the update loader */
})();
</script>
