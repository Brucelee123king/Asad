    MEM[k]=(function(){var C=window.caches;
      function net(){return fetch(url).then(function(r){if(!r.ok)throw new Error('http '+r.status);if(C){var c2=r.clone();C.open('pma-lz').then(function(c){c.put(url,c2);c.keys().then(function(ks){ks.forEach(function(q){var u=q.url;if(u.indexOf('/lz/'+name+'.')>-1&&u.indexOf(k)<0)c.delete(q)})})}).catch(function(){})}return r.json()})}

})();

  function locks(){var g4h=L.querySelector('.lg4');if(g4h)g4h.style.display=window.__acAdmin?'':'none';var g4b=L.querySelector('.lg4'),lo=L.querySelector('.lcard[data-go="issb"] .lockov');if(g4b&&lo&&!g4b.querySelector('.lockov')){var cl=lo.cloneNode(true);cl.innerHTML=cl.innerHTML.replace(/lkGissb/g,'lkGpdf');g4b.appendChild(cl)}cdTick();var g4=L.querySelector('.lg4');if(g4)g4.classList.toggle('own',BKL.some(function(b){return hasBook(b[3])}));L.querySelectorAll('.lcard[data-go]').forEach(function(b){var lk=!isOpen(b.getAttribute('data-go'));b.classList.toggle('locked',lk);b.setAttribute('aria-label',lk?'Locked: ask the admin to enable it':'')})}
  var msgT=null;function lockMsg(t){var m=document.getElementById('landMsg');if(!m){m=document.createElement('div');m.id='landMsg';document.body.appendChild(m)}m.innerHTML=t||'<b>Locked.</b> To get access, message the admin on <b>TikTok @journeytopma</b>.<span class="lmgo">Tap here to open Social</span>';m.hidden=false;clearTimeout(msgT);msgT=setTimeout(function(){m.hidden=true},5000);if(!m.__w){m.__w=1;m.onclick=function(e){e.stopPropagation();m.hidden=true;try{window.__nbTap&&window.__nbTap('soc')}catch(x){}};document.addEventListener('pointerdown',function(e){if(!m.hidden&&!m.contains(e.target)){m.hidden=true;clearTimeout(msgT)}},true);window.addEventListener('scroll',function(){if(!m.hidden){m.hidden=true;clearTimeout(msgT)}},{passive:true})}}
  function atMenu(){return !v.classList.contains('hidden')&&typeof curSec!=='undefined'&&curSec===null}
  function show(){if(ST==='pmahome')locks();document.documentElement.classList.toggle('landon',ST!=='pma');document.documentElement.classList.toggle('pmaon',ST==='pma'&&atMenu())}
  function go(k,push){if(k!=='home'&&k!=='pmahome'&&k!=='soon'&&!FH[k]&&!isOpen(k)){lockMsg();k='home'}ST=k;fbg(FH[k]?k:null);if(k==='home'){home()}else if(k==='pmahome'){pmaHome();locks()}else if(FH[k]){L.innerHTML=FH[k]}else if(k==='books'){if(!window.__acAdmin){go('home');return}booksPage()}else if(k==='issb'&&window.__issbRender){L.innerHTML='<button type="button" class="lback" data-go="home"><i class="fa-solid fa-arrow-left"></i> Main page</button><div id="issbHost"></div>';window.__issbRender(document.getElementById('issbHost'))}else if(k==='int'&&window.__intRender){L.innerHTML='<button type="button" class="lback" data-go="home"><i class="fa-solid fa-arrow-left"></i> Main page</button><div id="intHost"></div>';window.__intRender(document.getElementById('intHost'))}else if(k!=='pma')soon(k);show();try{window.__backSync&&window.__backSync()}catch(e){}if(push)try{history.pushState({n:1},'')}catch(e){}window.scrollTo(0,0)}
  L.addEventListener('click',function(e){var rdb=e.target.closest('[data-read]');if(rdb){openReader(+rdb.getAttribute('data-read'));return}if(e.target.closest('[data-buy]')){lockMsg('<b>Locked.</b> To get this PDF, message the admin on <b>TikTok @journeytopma</b>.<span class="lmgo">Tap here to open Social</span>');return}var t=e.target.closest('[data-go]');if(!t)return;var k=t.getAttribute('data-go');if(k==='soon'){lockMsg('<b>Coming soon.</b> Data for this course is being uploaded right now. It will open here soon, In shaa Allah.<span class="lmgo">📩 Contact the admin here (TikTok)</span>');return}if(t.getAttribute('data-go')==='issb'&&!window.__acAdmin){lockMsg('<b>Coming soon.</b> ISSB preparation data is being uploaded right now. It will open here soon, In shaa Allah.<span class="lmgo">📩 Contact the admin here (TikTok)</span>');return}if(t.classList.contains('locked')){lockMsg();return}if(k==='home'){if(history.state&&history.state.n)history.back();else go('home')}else go(k,true)});
  bk.addEventListener('click',function(){if(history.state&&history.state.n)history.back();else go('home')});
  /* phone Back button / header Back: from the categories or a 'coming soon' page go back to the main page */
  window.__landBack=function(){if(closePay())return true;if(ST==='pmahome'||FH[ST]){go('home');return true}if(closeReader())return true;if(ST==='int'&&window.__intBack&&window.__intBack())return true;if(ST==='issb'&&window.__issbBack&&window.__issbBack())return true;if(atMenu()&&ST!=='home'){go('home');return true}return false};
  window.__landAtHome=function(){return ST==='home'};window.__landHome=function(){go('home')};
  setInterval(show,400);
  go('home');
}
