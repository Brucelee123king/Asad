.lcard{display:block;width:100%;text-align:left;border:1px solid rgba(255,255,255,.55);border-radius:26px;padding:22px 22px 20px;margin:0 0 18px;cursor:pointer;box-shadow:0 22px 40px -18px rgba(15,23,42,.55),inset 0 1px 0 rgba(255,255,255,.6);position:relative;overflow:hidden;transition:transform .15s}

.lcard::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-18deg);animation:lSheen 4.5s ease-in-out infinite;pointer-events:none;will-change:transform}
.lcard.lg2::after{animation-delay:1.5s}.lcard.lg3::after{animation-delay:3s}
@keyframes lSheen{0%,70%{transform:translateX(0) skewX(-18deg)}100%{transform:translateX(420%) skewX(-18deg)}}

.lcard .bg{position:absolute;right:-10px;bottom:-18px;font-size:120px;opacity:.13;pointer-events:none}
.lcard .no{position:absolute;top:16px;right:18px;font-size:13px;font-weight:800;letter-spacing:.12em;opacity:.7}
.lcard .ar{position:absolute;right:18px;bottom:18px;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.5);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.lg3 .ar{background:rgba(255,255,255,.22)}
.lcard:active{transform:scale(.985)}
.lcard .ti{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:800;line-height:1.2}
.lcard .ti i{font-size:26px;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.35);flex:0 0 auto}
.lcard .su{margin-top:10px;font-size:15px;opacity:.92}
.lcard .go{margin-top:12px;font-weight:800;font-size:16px}
.lcard .tag{display:inline-block;margin-top:10px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.45)}
.lg1{background:linear-gradient(120deg,#b8860b,#ffe9a0 50%,#d4a017);color:#3b2a05}
.lg2{background:linear-gradient(120deg,#d6c08f,#fff8e7 50%,#e8d9b5);color:#3b2f14}
.lg3{background:linear-gradient(120deg,#7c2d12,#e08a5a 50%,#b45309);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.lg3 .ti i{background:rgba(255,255,255,.2)}
#landSoon .box{border-radius:24px;padding:30px 22px;text-align:center;box-shadow:0 16px 30px -14px rgba(15,23,42,.5)}
#landSoon .box i.big{font-size:44px;display:block;margin-bottom:12px}
#landSoon .box h3{font-size:24px;font-weight:800;margin:0 0 8px}
#landSoon .box p{font-size:16px;margin:6px 0 0;opacity:.95}
.lback{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #e2e8f0;color:#334155;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;box-shadow:0 2px 6px rgba(15,23,42,.08);cursor:pointer;margin:0 0 14px}
html.dark .lback{background:#0f172a;color:#e2e8f0;border-color:#334155}
/* dark mode 'Black Gold' (user's choice): black with a soft gold glow, no colour blobs */
html.dark body.bg-slate-50.font-sans{background:radial-gradient(520px 340px at 50% 0%,rgba(234,179,8,.26),transparent 70%),radial-gradient(420px 380px at 100% 75%,rgba(180,83,9,.18),transparent 70%),radial-gradient(380px 320px at 0% 45%,rgba(232,217,181,.08),transparent 70%),#09090b!important}

html.dark body.bg-slate-50.font-sans>footer.bg-white{background:#0b0b0e!important;border-color:rgba(212,160,23,.15)!important}
.lcard .ti i.ii{background:none;padding:0;overflow:hidden}.lcard .ti img.hand{width:46px;height:46px;border-radius:14px;display:block;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.lcard img.bg{position:absolute;right:-6px;bottom:-14px;width:120px;height:120px;opacity:.14;pointer-events:none}
#landSoon .box img.big{width:84px;height:84px;border-radius:22px;display:block;margin:0 auto 14px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
/* locked preparation: big lock in the middle of the card */
.lcard .lockov{display:none;position:absolute;inset:0;align-items:center;justify-content:center;z-index:3;pointer-events:none}
.lcard.locked .lockov{display:flex}
/* gold lock (own drawing): gold ring on a dark circle with a gold padlock and keyhole */
.lcard .lockov span{width:96px;height:96px;display:flex;border-radius:50%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}.lcard .lockov svg{width:100%;height:100%}
.lcard.locked>*:not(.lockov){filter:blur(1.2px);opacity:.75}
.lcard.locked .tag,.lcard.locked .go{visibility:hidden}
#landMsg .lmgo{display:block;margin-top:6px;color:#fde68a;font-size:12.5px;text-decoration:underline}#landMsg{cursor:pointer;position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:90vw;background:#0f172a;color:#fff;font-weight:700;font-size:14px;padding:12px 18px;border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.35);z-index:9999;text-align:center}
#landBack{display:none}
html.pmaon #landBack{display:inline-flex}

/* main page background (design 1: Royal Gold) — light mode only */
html.landon:not(.dark) body,html.lite.landon:not(.dark) body{background:#fbf6ea!important}

.lbk{position:relative;display:block;width:100%;height:318px;margin:22px 0 0;padding:0;border-radius:24px;overflow:hidden;border:1px solid rgba(148,163,184,.35);box-shadow:0 14px 30px rgba(2,6,23,.35);background:linear-gradient(180deg,#2a4d6e 0%,#6b7f8f 30%,#d99a5b 55%,#f3c27a 64%,#2d3b22 66%,#1b2616 100%);text-align:left;cursor:pointer;font-family:inherit;color:#fff}

.lbk .k-books{position:absolute;left:50%;width:357px;margin-left:-178px;top:0;height:212px}.lbk .k-books img{position:absolute;bottom:0;filter:drop-shadow(0 14px 12px rgba(0,0,0,.6))}

.lbk .k-chip{position:absolute;left:18px;top:18px;z-index:2;font:600 12px/1 ui-monospace,"JetBrains Mono",monospace;letter-spacing:.06em;color:#4ade80;background:rgba(6,78,59,.75);border:1px solid rgba(74,222,128,.35);border-radius:8px;padding:6px 10px}

#landBooks .sg.one{grid-template-columns:1fr}#landBooks .sg.one .im{height:260px}#landBooks .sg.one img{max-height:240px}#landBooks .sg.one .sc>b{font-size:16px}#landBooks .sg.one .pp em{font-size:19px}

     Pages are drawn on canvas with the reader's email as a faint watermark; no download, no save, no long-press. ---- */
  function hasBook(id){return !!window.__acAdmin||(window.__acCats||[]).indexOf(id)>-1}
  var RD=null;
  function rdBase(){var b=(window.__LOCK&&window.__LOCK.base)||'./';return b.charAt(b.length-1)==='/'?b:b+'/'}
  function b64u8(t){var s=atob(t),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
  function rdKey(id,meta){return window.__acGetKey(id).then(function(pw){pw=String(pw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(k){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64u8(meta.salt),iterations:meta.iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])})})}
  function rdToast(t){lockMsg('<b>'+t+'</b>')}
  function openReader(i){var b=BKL[i];if(!b)return;if(!hasBook(b[3])){lockMsg('<b>Order this book:</b> message the admin on <b>TikTok @journeytopma</b>.<span class="lmgo">Tap here to open Social</span>');return}
    if(!window.crypto||!crypto.subtle||!window.__acGetKey){rdToast('This phone cannot open the book. Please update the app.');return}
    var base=rdBase()+'bk/'+b[4]+'/';
    var o=document.createElement('div');o.id='bkRd';o.innerHTML='<div class="rt"><button type="button" class="rx" aria-label="Close">←</button><b>'+b[1]+'</b><span class="rn">…</span></div><div class="rs"><div class="ri"></div></div><div class="rz"><button type="button" data-z="-1">−</button><button type="button" data-z="0">100%</button><button type="button" data-z="1">+</button></div><div class="rl">Opening the book…</div>';
    document.body.appendChild(o);document.documentElement.classList.add('bkrd');
    try{history.pushState({n:1,bk:1},'')}catch(e){}
    RD={o:o,b:b,z:1,key:null,meta:null,obs:null,busy:{}};
    fetch(base+'meta.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('meta');return r.json()}).then(function(m){RD&&(RD.meta=m);return rdKey(b[3],m).then(function(k){if(!RD)return;RD.key=k;rdBuild(base)})})
      .catch(function(e){if(!RD)return;o.querySelector('.rl').textContent=(e&&e.message==='nokey')?'This book is not opened for you yet. Message the admin.':'Could not open the book. Check the internet and try again.'})}
  function rdBuild(base){var m=RD.meta,inn=RD.o.querySelector('.ri'),sc=RD.o.querySelector('.rs'),h='';RD.o.querySelector('.rl').remove();
    for(var i=1;i<=m.n;i++)h+='<div class="rp" data-p="'+i+'" style="aspect-ratio:'+m.wh[0]+'/'+m.wh[1]+'"><canvas></canvas><span>'+i+'</span></div>';inn.innerHTML=h;
    RD.obs=new IntersectionObserver(function(es){es.forEach(function(en){var d=en.target,p=+d.getAttribute('data-p');if(en.isIntersecting)rdLoad(base,d,p);else rdDrop(d)})},{root:sc,rootMargin:'1400px 0px'});
    [].forEach.call(inn.children,function(d){RD.obs.observe(d)});
    var cnt=RD.o.querySelector('.rn');sc.addEventListener('scroll',function(){var r=sc.getBoundingClientRect(),mid=r.top+r.height/3,ch=inn.children;for(var i=0;i<ch.length;i++){var q=ch[i].getBoundingClientRect();if(q.bottom>mid){cnt.textContent=(i+1)+' / '+m.n;break}}},{passive:true});cnt.textContent='1 / '+m.n;
    rdPinch(sc,inn)}
  function rdLoad(base,d,p){if(!RD||d.__on||RD.busy[p])return;RD.busy[p]=1;var key=RD.key;
    fetch(base+'p'+('00'+p).slice(-3)+'.bin',{cache:'force-cache'}).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()}).then(function(buf){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(buf,0,12),additionalData:new TextEncoder().encode(RD.b[4]+'/'+p)},key,new Uint8Array(buf,12))})
    .then(function(pt){return createImageBitmap(new Blob([pt],{type:'image/webp'}))}).then(function(bm){if(!RD)return;var c=d.querySelector('canvas');c.width=bm.width;c.height=bm.height;var x=c.getContext('2d');x.drawImage(bm,0,0);try{bm.close()}catch(e){}
      var w=String(window.__acEmail||'').trim();if(w){x.save();x.translate(c.width/2,c.height/2);x.rotate(-Math.PI/6);x.font='600 34px sans-serif';x.fillStyle='rgba(30,41,59,.07)';x.textAlign='center';for(var k=-2;k<=2;k++)x.fillText(w,0,k*300);x.restore()}
      d.__on=1;d.classList.add('ok')}).catch(function(){}).then(function(){if(RD)delete RD.busy[p]})}
  function rdDrop(d){if(!d.__on)return;var c=d.querySelector('canvas');c.width=1;c.height=1;d.__on=0;d.classList.remove('ok')}
  function rdZoom(z,cx,cy){if(!RD)return;var sc=RD.o.querySelector('.rs'),inn=RD.o.querySelector('.ri'),old=RD.z;z=Math.max(1,Math.min(4,z));if(Math.abs(z-old)<.001)return;
    var r=sc.getBoundingClientRect();cx=cx==null?r.width/2:cx-r.left;cy=cy==null?r.height/2:cy-r.top;var fx=(sc.scrollLeft+cx)/old,fy=(sc.scrollTop+cy)/old;
    RD.z=z;inn.style.width=(z*100)+'%';sc.scrollLeft=fx*z-cx;sc.scrollTop=fy*z-cy;RD.o.querySelector('[data-z="0"]').textContent=Math.round(z*100)+'%'}
  function rdPinch(sc){var d0=0,z0=1;function dist(t){var a=t[0],b=t[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
    sc.addEventListener('touchstart',function(e){if(e.touches.length===2){d0=dist(e.touches);z0=RD.z}},{passive:true});
    sc.addEventListener('touchmove',function(e){if(e.touches.length===2&&d0){e.preventDefault();var t=e.touches;rdZoom(z0*dist(t)/d0,(t[0].clientX+t[1].clientX)/2,(t[0].clientY+t[1].clientY)/2)}},{passive:false});
    sc.addEventListener('touchend',function(e){if(e.touches.length<2)d0=0},{passive:true});
    var lt=0;sc.addEventListener('touchend',function(e){if(e.touches.length||e.changedTouches.length!==1)return;var n=Date.now();if(n-lt<300){var t=e.changedTouches[0];rdZoom(RD.z>1.2?1:2.2,t.clientX,t.clientY);lt=0}else lt=n},{passive:true})}
  function closeReader(){if(!RD)return false;try{RD.obs&&RD.obs.disconnect()}catch(e){}RD.o.remove();RD=null;document.documentElement.classList.remove('bkrd');return true}
  document.addEventListener('click',function(e){if(!RD)return;var t=e.target;if(t.closest('#bkRd .rx')){if(history.state&&history.state.bk)history.back();else closeReader();return}
    var z=t.closest('#bkRd [data-z]');if(z){var k=+z.getAttribute('data-z');rdZoom(k===0?1:RD.z+(k>0?.5:-.5))}});
  document.addEventListener('contextmenu',function(e){if(RD&&e.target.closest('#bkRd'))e.preventDefault()});
  function home(){L.innerHTML='<div class="lh"><div class="emb"><i class="fa-solid fa-shield-halved"></i></div><div class="kick">PMA Preparation</div><h2>Assalam o Alaikum</h2><p>Choose your preparation</p><div class="rule"></div></div>'+
    card('pma','lg1','fa-graduation-cap','01','Initial PMA Preparation','All categories: 1000 MCQs, PMA 159, Hakeem, Forces Academy, Pro Genius, Verbal and Non Verbal, Academic and more.')+
    card('int','lg2','fa-user-tie','02','Initial Interview Preparation','Interview questions and model answers.',1)+
    card('issb','lg3','trophy','03','ISSB Preparation','Psychological tests, GTO tasks and the ISSB interview.',1)+booksCard()}
  function soon(k){var s=SOON[k];L.innerHTML='<button type="button" class="lback" data-go="home"><i class="fa-solid fa-arrow-left"></i> Main page</button><div id="landSoon"><div class="box '+s[0]+'">'+ico(s[1],'big')+'<h3>'+s[2]+'</h3><p>'+s[3]+'</p><p><b>Coming soon.</b> The data will be uploaded here very soon. Stay tuned!</p></div></div>'}
  /* who may open what: Initial PMA = any of its categories given by the admin; Interview / ISSB = their own tick */
  function isOpen(k){if(k==='books'||window.__acAdmin)return true;if(k==='pma'){try{return Object.keys(window.__lkAllowed?window.__lkAllowed():{}).length>0}catch(e){return false}}return (window.__acCats||[]).indexOf(k)>-1}
  function locks(){L.querySelectorAll('.lcard[data-go]').forEach(function(b){var lk=!isOpen(b.getAttribute('data-go'));b.classList.toggle('locked',lk);b.setAttribute('aria-label',lk?'Locked: ask the admin to enable it':'')})}
  var msgT=null;function lockMsg(t){var m=document.getElementById('landMsg');if(!m){m=document.createElement('div');m.id='landMsg';document.body.appendChild(m)}m.innerHTML=t||'<b>Locked.</b> To get access, message the admin on <b>TikTok @journeytopma</b>.<span class="lmgo">Tap here to open Social</span>';m.hidden=false;clearTimeout(msgT);msgT=setTimeout(function(){m.hidden=true},5000);if(!m.__w){m.__w=1;m.onclick=function(e){e.stopPropagation();m.hidden=true;try{window.__nbTap&&window.__nbTap('soc')}catch(x){}};document.addEventListener('pointerdown',function(e){if(!m.hidden&&!m.contains(e.target)){m.hidden=true;clearTimeout(msgT)}},true);window.addEventListener('scroll',function(){if(!m.hidden){m.hidden=true;clearTimeout(msgT)}},{passive:true})}}
  function atMenu(){return !v.classList.contains('hidden')&&typeof curSec!=='undefined'&&curSec===null}
  function show(){if(ST==='home')locks();document.documentElement.classList.toggle('landon',ST!=='pma');document.documentElement.classList.toggle('pmaon',ST==='pma'&&atMenu())}
  function go(k,push){if(k!=='home'&&!isOpen(k)){lockMsg();k='home'}ST=k;if(k==='home'){home();locks()}else if(k==='books')booksPage();else if(k!=='pma')soon(k);show();try{window.__backSync&&window.__backSync()}catch(e){}if(push)try{history.pushState({n:1},'')}catch(e){}window.scrollTo(0,0)}
  L.addEventListener('click',function(e){var rdb=e.target.closest('[data-read]');if(rdb){openReader(+rdb.getAttribute('data-read'));return}if(e.target.closest('[data-buy]')){lockMsg('<b>Order this book:</b> message the admin on <b>TikTok @journeytopma</b>.<span class="lmgo">Tap here to open Social</span>');return}var t=e.target.closest('[data-go]');if(!t)return;var k=t.getAttribute('data-go');if(t.classList.contains('locked')){lockMsg();return}if(k==='home'){if(history.state&&history.state.n)history.back();else go('home')}else go(k,true)});
  bk.addEventListener('click',function(){if(history.state&&history.state.n)history.back();else go('home')});
  /* phone Back button / header Back: from the categories or a 'coming soon' page go back to the main page */
  window.__landBack=function(){if(closeReader())return true;if(atMenu()&&ST!=='home'){go('home');return true}return false};
  window.__landAtHome=function(){return ST==='home'};window.__landHome=function(){go('home')};
  setInterval(show,400);
  go('home');
}
var tries=0;(function wait(){if(document.getElementById('view-select')&&document.getElementById('sec-menu'))init();else if(tries++<200)setTimeout(wait,50)})();  /* the page can be written in later by the update loader */
})();
