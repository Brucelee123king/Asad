    c.classList.toggle('cdon',on);c.classList.toggle('buyon',!on&&left<=0);if(!on&&left<=0&&!c.querySelector('.bov')){var bo=document.createElement('span');bo.className='bov';bo.setAttribute('aria-hidden','true');bo.innerHTML='<em>Rs 200</em> 🛒 Buy now';c.appendChild(bo)}if(!on)return;var t=Math.floor(left/1000),f=function(n){return ('0'+n).slice(-2)};var q=c.querySelector('.cdn');
    q.querySelector('.h').firstChild.nodeValue=f(Math.floor(t/3600));q.querySelector('.m').firstChild.nodeValue=f(Math.floor(t%3600/60));q.querySelector('.s').firstChild.nodeValue=f(t%60)}
  setInterval(cdTick,1000);
  function locks(){var g4h=L.querySelector('.lg4');if(g4h)g4h.style.display=window.__acAdmin?'':'none';var g4b=L.querySelector('.lg4'),lo=L.querySelector('.lcard[data-go="issb"] .lockov');if(g4b&&lo&&!g4b.querySelector('.lockov')){var cl=lo.cloneNode(true);cl.innerHTML=cl.innerHTML.replace(/lkGissb/g,'lkGpdf');g4b.appendChild(cl)}cdTick();var c1=L.querySelector('.lcard[data-go="pma"]');if(c1){c1.classList.add('buyon');if(!c1.querySelector('.bov')){var b1=document.createElement('span');b1.className='bov';b1.setAttribute('aria-hidden','true');b1.innerHTML='<em>Rs 300</em> 🛒 Buy now';c1.appendChild(b1)}}var g4=L.querySelector('.lg4');if(g4)g4.classList.toggle('own',BKL.some(function(b){return hasBook(b[3])}));L.querySelectorAll('.lcard[data-go]').forEach(function(b){var lk=!isOpen(b.getAttribute('data-go'));b.classList.toggle('locked',lk);b.setAttribute('aria-label',lk?'Locked: ask the admin to enable it':'')})}
  var msgT=null;function lockMsg(t){var m=document.getElementById('landMsg');if(!m){m=document.createElement('div');m.id='landMsg';document.body.appendChild(m)}m.innerHTML=t||'<b>Locked.</b> To get access, message the admin on <b>TikTok @journeytopma</b>.<span class="lmgo">Tap here to open Social</span>';m.hidden=false;clearTimeout(msgT);msgT=setTimeout(function(){m.hidden=true},5000);if(!m.__w){m.__w=1;m.onclick=function(e){e.stopPropagation();m.hidden=true;try{window.__nbTap&&window.__nbTap('soc')}catch(x){}};document.addEventListener('pointerdown',function(e){if(!m.hidden&&!m.contains(e.target)){m.hidden=true;clearTimeout(msgT)}},true);window.addEventListener('scroll',function(){if(!m.hidden){m.hidden=true;clearTimeout(msgT)}},{passive:true})}}
  function atMenu(){return !v.classList.contains('hidden')&&typeof curSec!=='undefined'&&curSec===null}
  function show(){if(ST==='home')locks();document.documentElement.classList.toggle('landon',ST!=='pma');document.documentElement.classList.toggle('pmaon',ST==='pma'&&atMenu())}
  function go(k,push){if(k!=='home'&&!isOpen(k)){lockMsg();k='home'}ST=k;if(k==='home'){home();locks()}else if(k==='books'){if(!window.__acAdmin){go('home');return}booksPage()}else if(k==='issb'&&window.__issbRender){L.innerHTML='<button type="button" class="lback" data-go="home"><i class="fa-solid fa-arrow-left"></i> Main page</button><div id="issbHost"></div>';window.__issbRender(document.getElementById('issbHost'))}else if(k==='int'&&window.__intRender){L.innerHTML='<button type="button" class="lback" data-go="home"><i class="fa-solid fa-arrow-left"></i> Main page</button><div id="intHost"></div>';window.__intRender(document.getElementById('intHost'))}else if(k!=='pma')soon(k);show();try{window.__backSync&&window.__backSync()}catch(e){}if(push)try{history.pushState({n:1},'')}catch(e){}window.scrollTo(0,0)}
  L.addEventListener('click',function(e){var rdb=e.target.closest('[data-read]');if(rdb){openReader(+rdb.getAttribute('data-read'));return}if(e.target.closest('[data-buy]')){lockMsg('<b>Locked.</b> To get this PDF, message the admin on <b>TikTok @journeytopma</b>.<span class="lmgo">Tap here to open Social</span>');return}var t=e.target.closest('[data-go]');if(!t)return;var k=t.getAttribute('data-go');if(t.classList.contains('cdon')){lockMsg('<b>Opening soon.</b> The Initial Interview section opens when the timer ends.');return}if(t.classList.contains('locked')&&t.classList.contains('buyon')&&t.getAttribute('data-go')==='pma'){showPay('Initial PMA Preparation',300);return}if(t.classList.contains('locked')&&t.classList.contains('buyon')){showPay('Initial Interview Preparation',200);return}if(t.classList.contains('locked')){lockMsg();return}if(k==='home'){if(history.state&&history.state.n)history.back();else go('home')}else go(k,true)});
  bk.addEventListener('click',function(){if(history.state&&history.state.n)history.back();else go('home')});
  /* phone Back button / header Back: from the categories or a 'coming soon' page go back to the main page */
  window.__landBack=function(){if(closePay())return true;if(closeReader())return true;if(ST==='int'&&window.__intBack&&window.__intBack())return true;if(ST==='issb'&&window.__issbBack&&window.__issbBack())return true;if(atMenu()&&ST!=='home'){go('home');return true}return false};
  window.__landAtHome=function(){return ST==='home'};window.__landHome=function(){go('home')};
  setInterval(show,400);
  go('home');
}
var tries=0;(function wait(){if(document.getElementById('view-select')&&document.getElementById('sec-menu'))init();else if(tries++<200)setTimeout(wait,50)})();  /* the page can be written in later by the update loader */
})();
</script>
