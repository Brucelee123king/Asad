<style>
/* main page with the 3 big preparations (colours 95 Shiny Gold, 97 Champagne, 99 Copper of design/palette100.json) */
#mainLand{display:none;padding-bottom:24px}
html.landon #mainLand{display:block}
html.landon #sec-menu{display:none!important}
#mainLand .lh{text-align:center;margin:4px 0 22px}
#mainLand .emb{width:64px;height:64px;margin:0 auto 10px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#3b2a05;background:linear-gradient(135deg,#b8860b,#ffe9a0 50%,#d4a017);box-shadow:0 10px 24px -8px rgba(184,134,11,.65),inset 0 1px 0 rgba(255,255,255,.7)}
#mainLand .kick{font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#a16207;margin-bottom:6px}
#mainLand .rule{width:64px;height:3px;border-radius:3px;margin:12px auto 0;background:linear-gradient(90deg,transparent,#d4a017,transparent)}
#mainLand .lh h2{font-size:28px;font-weight:800;color:#1e1b4b;margin:0;letter-spacing:-.01em}
#mainLand .lh p{color:#64748b;margin:6px 0 0;font-size:15px}
html.dark #mainLand .lh h2{color:#e0e7ff}html.dark #mainLand .lh p{color:#94a3b8}
.lcard{display:block;width:100%;text-align:left;border:1px solid rgba(255,255,255,.55);border-radius:26px;padding:22px 22px 20px;margin:0 0 18px;cursor:pointer;box-shadow:0 22px 40px -18px rgba(15,23,42,.55),inset 0 1px 0 rgba(255,255,255,.6);position:relative;overflow:hidden;transition:transform .15s}
.lcard::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 70% at 0% 0%,rgba(255,255,255,.45),transparent 55%);pointer-events:none}
.lcard::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-18deg);animation:lSheen 4.5s ease-in-out infinite;pointer-events:none;will-change:transform}
.lcard.lg2::after{animation-delay:1.5s}.lcard.lg3::after{animation-delay:3s}
@keyframes lSheen{0%,70%{transform:translateX(0) skewX(-18deg)}100%{transform:translateX(420%) skewX(-18deg)}}
html.lite .lcard::after{animation-duration:4.5s!important;animation-iteration-count:infinite!important}
.lcard .bg{position:absolute;right:-10px;bottom:-18px;font-size:120px;opacity:.13;pointer-events:none}
.lcard .no{position:absolute;top:16px;right:18px;font-size:13px;font-weight:800;letter-spacing:.12em;opacity:.7}
.lcard .ar{position:absolute;right:18px;bottom:18px;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.5);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.lg3 .ar{background:rgba(255,255,255,.22)}
.lcard:active{transform:scale(.985)}
.lcard .ti{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:800;line-height:1.2}
.lcard .ti i{font-size:26px;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.35);flex:0 0 auto}
.lcard .su{margin-top:10px;font-size:15px;opacity:.92}
.lcard .go{margin-top:12px;font-weight:800;font-size:16px}
.lcard .tag{display:inline-block;margin-top:10px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.45)}
.lg1{background:linear-gradient(120deg,#b8860b,#ffe9a0 50%,#d4a017);color:#3b2a05}
.lg2{background:linear-gradient(120deg,#d6c08f,#fff8e7 50%,#e8d9b5);color:#3b2f14}
.lg3{background:linear-gradient(120deg,#7c2d12,#e08a5a 50%,#b45309);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.lg3 .ti i{background:rgba(255,255,255,.2)}
#landSoon .box{border-radius:24px;padding:30px 22px;text-align:center;box-shadow:0 16px 30px -14px rgba(15,23,42,.5)}
#landSoon .box i.big{font-size:44px;display:block;margin-bottom:12px}
#landSoon .box h3{font-size:24px;font-weight:800;margin:0 0 8px}
#landSoon .box p{font-size:16px;margin:6px 0 0;opacity:.95}
.lback{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #e2e8f0;color:#334155;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;box-shadow:0 2px 6px rgba(15,23,42,.08);cursor:pointer;margin:0 0 14px}
html.dark .lback{background:#0f172a;color:#e2e8f0;border-color:#334155}
/* dark mode 'Black Gold' (user's choice): black with a soft gold glow, no colour blobs */
html.dark body.bg-slate-50.font-sans{background:radial-gradient(520px 340px at 50% 0%,rgba(234,179,8,.26),transparent 70%),radial-gradient(420px 380px at 100% 75%,rgba(180,83,9,.18),transparent 70%),radial-gradient(380px 320px at 0% 45%,rgba(232,217,181,.08),transparent 70%),#09090b!important}
html.dark body.bg-slate-50::before{display:none!important}
html.dark #liquidBg{display:none!important}
html.dark body.bg-slate-50.font-sans>header.bg-white{background:rgba(9,9,11,.88)!important;border-color:rgba(212,160,23,.22)!important}
html.dark body.bg-slate-50.font-sans>footer.bg-white{background:#0b0b0e!important;border-color:rgba(212,160,23,.15)!important}
.lcard .ti i.ii{background:none;padding:0;overflow:hidden}.lcard .ti img.hand{width:46px;height:46px;border-radius:14px;display:block;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.lcard img.bg{position:absolute;right:-6px;bottom:-14px;width:120px;height:120px;opacity:.14;pointer-events:none}
#landSoon .box img.big{width:84px;height:84px;border-radius:22px;display:block;margin:0 auto 14px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
/* locked preparation: big lock in the middle of the card */
.lcard .lockov{display:none;position:absolute;inset:0;align-items:center;justify-content:center;z-index:3;pointer-events:none}
.lcard.locked .lockov{display:flex}
/* gold lock (own drawing): gold ring on a dark circle with a gold padlock and keyhole */
.lcard .lockov span{width:96px;height:96px;display:flex;border-radius:50%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}.lcard .lockov svg{width:100%;height:100%}
.lcard.locked>*:not(.lockov){filter:blur(1.2px);opacity:.75}
.lcard.locked .tag,.lcard.locked .go{visibility:hidden}
#landMsg .lmgo{display:block;margin-top:6px;color:#fde68a;font-size:12.5px;text-decoration:underline}#landMsg{cursor:pointer;position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:90vw;background:#0f172a;color:#fff;font-weight:700;font-size:14px;padding:12px 18px;border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.35);z-index:9999;text-align:center}
#landBack{display:none}
html.pmaon #landBack{display:inline-flex}

/* main page background (design 1: Royal Gold) — light mode only */
html.landon:not(.dark) body,html.lite.landon:not(.dark) body{background:#fbf6ea!important}
html.landon:not(.dark) body::before,html.lite.landon:not(.dark) body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;display:block!important;opacity:1!important;background:radial-gradient(600px 420px at 50% -5%,rgba(250,204,21,.32),transparent 65%),radial-gradient(420px 380px at 100% 60%,rgba(212,160,23,.18),transparent 70%),radial-gradient(420px 380px at 0% 90%,rgba(234,179,8,.14),transparent 70%)!important}
html.landon:not(.dark) .lb{display:none!important}
/* 04 Books card (style of a photo card: real covers behind, text on top) — never locked */
.lbk{position:relative;display:block;width:100%;height:318px;margin:22px 0 0;padding:0;border-radius:24px;overflow:hidden;border:1px solid rgba(148,163,184,.35);box-shadow:0 14px 30px rgba(2,6,23,.35);background:linear-gradient(180deg,#2a4d6e 0%,#6b7f8f 30%,#d99a5b 55%,#f3c27a 64%,#2d3b22 66%,#1b2616 100%);text-align:left;cursor:pointer;font-family:inherit;color:#fff}
.lbk .k-sun{position:absolute;right:30px;top:96px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(255,246,213,.95),rgba(255,210,122,.6) 35%,rgba(255,180,80,0) 70%)}
.lbk .k-flag{position:absolute;left:-70px;top:40px;width:150px;height:110px;transform:rotate(-8deg);background:linear-gradient(90deg,#f1f5f9 0 24%,#0b6b34 24%);border-radius:4px;box-shadow:0 10px 24px rgba(0,0,0,.35);opacity:.92}
.lbk .k-flag:before{content:"";position:absolute;left:72px;top:28px;width:48px;height:48px;border-radius:50%;box-shadow:-10px 5px 0 0 #fff}
.lbk .k-books{position:absolute;left:50%;width:357px;margin-left:-178px;top:0;height:212px}.lbk .k-books img{position:absolute;bottom:0;filter:drop-shadow(0 14px 12px rgba(0,0,0,.6))}
.lbk .k-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,6,23,.35) 0%,rgba(2,6,23,.1) 25%,rgba(2,6,23,.25) 55%,rgba(2,6,23,.85) 78%,rgba(2,6,23,.95) 100%)}
.lbk .k-chip{position:absolute;left:18px;top:18px;z-index:2;font:600 12px/1 ui-monospace,"JetBrains Mono",monospace;letter-spacing:.06em;color:#4ade80;background:rgba(6,78,59,.75);border:1px solid rgba(74,222,128,.35);border-radius:8px;padding:6px 10px}
.lbk .k-no{position:absolute;right:18px;top:18px;z-index:2;color:#f1d27a;font-weight:800;letter-spacing:.1em;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.lbk .k-bt{position:absolute;left:18px;right:18px;bottom:16px;z-index:2}
.lbk .k-bt b{display:block;font-size:28px;font-weight:800;line-height:1.1;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.lbk .k-bt small{display:block;margin-top:4px;font-size:13.5px;line-height:1.45;color:#e2e8f0;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.lbk .k-ex{display:flex;justify-content:center;gap:8px;margin-top:10px;font-weight:800;font-size:16px;color:#4ade80;background:rgba(15,23,42,.6);border:1px solid rgba(74,222,128,.3);border-radius:14px;padding:11px}
/* Books page: sale design */
#landBooks .sh{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 16px;color:#fff;background:linear-gradient(135deg,#7f1d1d,#dc2626 55%,#f97316);box-shadow:0 12px 26px rgba(220,38,38,.3);border:2px solid #fcd34d;text-align:left}
#landBooks .sh:before{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12)}
#landBooks .sk{font-size:11.5px;font-weight:800;letter-spacing:.14em;color:#fde68a}
#landBooks .so{display:flex;align-items:flex-end;gap:10px;margin-top:4px}#landBooks .so b{font-size:54px;line-height:.9;font-weight:800;text-shadow:0 3px 0 rgba(0,0,0,.18)}#landBooks .so span{font-size:22px;font-weight:800;line-height:1.1;padding-bottom:4px}
#landBooks .sp{display:flex;align-items:center;gap:12px;margin-top:10px}#landBooks .sp s{font-size:20px;font-weight:700;color:#fecaca;text-decoration-thickness:3px;text-decoration-color:#fff}
#landBooks .sp em{font-style:normal;background:#fde047;color:#7f1d1d;font-weight:800;font-size:20px;border-radius:12px;padding:6px 14px;box-shadow:0 4px 0 #ca8a04}
#landBooks .sh p{margin:10px 0 0;font-size:12.5px;opacity:.92}
#landBooks .sb{position:absolute;right:14px;top:14px;width:74px;height:74px;border-radius:50%;background:#fde047;color:#7f1d1d;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;transform:rotate(12deg);box-shadow:0 6px 14px rgba(0,0,0,.25);z-index:1;border:3px dashed #b45309}#landBooks .sb b{font-size:22px;line-height:1}#landBooks .sb small{font-size:10px;letter-spacing:.1em}
#landBooks h4{margin:18px 2px 10px;font-size:17px;font-weight:800;display:flex;justify-content:space-between;align-items:center;color:#0f172a}#landBooks h4 small{font-size:12px;color:#a16207;font-weight:800}
#landBooks .sg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#landBooks .sc{position:relative;background:#fff;border-radius:18px;padding:10px 10px 12px;border:1.5px solid #f1d27a;box-shadow:0 8px 18px rgba(120,80,10,.08);display:flex;flex-direction:column;text-align:left}
#landBooks .sc .im{height:160px;border-radius:12px;background:radial-gradient(circle at 50% 70%,#fff7e6,#f3ead6);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
#landBooks .sc img{max-height:146px;max-width:100%;filter:drop-shadow(0 10px 10px rgba(0,0,0,.28))}
#landBooks .rib{position:absolute;z-index:2;left:-1px;top:12px;background:#dc2626;color:#fff;font-size:11px;font-weight:800;padding:4px 9px;border-radius:0 8px 8px 0;box-shadow:0 3px 6px rgba(0,0,0,.2)}
#landBooks .sc>b{display:block;font-size:13.5px;margin:9px 2px 2px;line-height:1.25;color:#0f172a}#landBooks .sc>small{display:block;font-size:11px;color:#64748b;margin:0 2px 8px}
#landBooks .pp{display:flex;align-items:center;gap:8px;margin:auto 2px 0;flex-wrap:wrap}#landBooks .pp s{color:#94a3b8;font-weight:700;font-size:13px;text-decoration-thickness:2px;text-decoration-color:#dc2626}#landBooks .pp em{font-style:normal;color:#b91c1c;font-weight:800;font-size:16px}
#landBooks .buy{margin-top:9px;width:100%;text-align:center;font-family:inherit;font-weight:800;font-size:13.5px;color:#fff;background:linear-gradient(120deg,#2e4a1e,#4d7c2a);border:0;border-radius:12px;padding:9px;cursor:pointer}
html.dark #landBooks .sc{background:#111c33;border-color:#a16207}html.dark #landBooks .sc .im{background:radial-gradient(circle at 50% 70%,#2a3550,#162038)}html.dark #landBooks .sc>b,html.dark #landBooks h4{color:#f1f5f9}html.dark #landBooks .sc>small{color:#94a3b8}html.dark #landBooks .pp em{color:#f87171}
</style>
