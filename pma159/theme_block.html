<button id="themeBtn" type="button" aria-label="Switch day / night mode" title="Day / Night mode" onclick="toggleTheme()"></button>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('themeBtn'),saved=null;
  try{saved=localStorage.getItem('an_theme')}catch(e){}
  var dark=saved?saved==='dark':(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  function apply(){root.classList.toggle('dark',dark);btn.textContent=dark?'☀️':'\u{1F319}';btn.title=dark?'Day mode':'Night mode'}
  window.toggleTheme=function(){dark=!dark;try{localStorage.setItem('an_theme',dark?'dark':'light')}catch(e){}apply()};
  apply();
})();
</script>
