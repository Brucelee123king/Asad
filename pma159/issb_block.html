      if(m==='tl')h+=itTests(Q);else if(m==='fc'&&IT)h+=itCard(Q);else if(m==='rs'&&IT)h+=itRes(Q);else if(m==='rv'&&IT)h+=itRev(Q);

        Q.map(function(x,k){return '<div class="iqc"><span class="iqn">'+(k+1)+'</span><div><b>'+esc(x.q)+'</b>'+(x.a?'<button type="button" class="iqb" data-iqa="1">👁 Show answer</button><div class="iqa" hidden>✓ '+esc(x.a)+(x.w?'<small>💡 '+esc(x.w)+'</small>':'')+'</div>':'')+'</div></div>'}).join('')}}

  function intv(){var g=G.intv,tb=TAB.iv||'interview_dp',x=O(D[tb]),f=(TAB.ivq||'').toLowerCase(),Q=A(x.questions).filter(function(q){return !f||q.toLowerCase().indexOf(f)>-1});

      ul('💡 Tips',x.tips)+'<input class="srch" type="search" placeholder="🔍 Search a question" value="'+esc(TAB.ivq||'')+'" data-q="1"><div class="bx"><h4>Questions <small>tick the ones you can answer</small></h4>'+Q.map(function(q){var id=hid(q);return '<button type="button" class="q'+(ok[id]?' ok':'')+'" data-ck="'+id+'"><span class="ck">'+(ok[id]?'✓':'')+'</span><span>'+esc(q)+'</span></button>'}).join('')+'</div>'}
  function xp(){var g=G.xp;return head(g[1],g[2],g[3],g[0])+A(D.experiences).map(function(e){var r=/^rec/i.test(e.result)?'y':/^not/i.test(e.result)?'n':'u';

  function fin(){var g=G.fin;return head(g[1],g[2],g[3],g[0])+ul('🏛️ Conference',O(D.conference).tips)+ul('⭐ Golden rules',D.dos)+ul('🚫 Avoid',D.donts)}
  function fmt(s){s=Math.max(0,s|0);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
  function drill(){var k=dr.k,L=dr.L,ur=k==='sct_ur';
    if(dr.i>=L.length)return '<button type="button" class="bk" data-back="1">← Back</button><div class="mk"><div class="done">🏆</div><div class="qq sm">Practice finished: '+L.length+' items</div><p style="color:var(--m);font-size:13.5px">Do it daily. Speed and positive thinking come with practice.</p></div><button type="button" class="big" data-dr="'+k+'">🔁 Practise again</button>';

    if(!lite){var on=function(e){if(!L.isConnected){window.removeEventListener('deviceorientation',on);return}var g=e.gamma;if(g==null)return;tx=Math.max(-8,Math.min(8,g/4));if(!tk){tk=1;requestAnimationFrame(ap)}};window.addEventListener('deviceorientation',on,{passive:true})}}
  function fitGv(){try{var el=document.querySelector('body>.gvx');if(!el)return;var nb=document.getElementById('nbBar'),nh=nb&&nb.offsetHeight?nb.offsetHeight:66,hd=document.querySelector('body>header'),tp=hd?hd.offsetHeight:0;

    var oL=document.querySelector('body>.gvx');if(oL)oL.remove();host.innerHTML='<div id="isP">'+render()+'</div>';if(IT&&TAB.itm==='fc')itTick();gwInit();var gL=host.querySelector('.gvx');if(gL){document.body.appendChild(gL);gL.addEventListener('click',onClick);gvMotion(gL);var hh=host;var iv=setInterval(function(){if(!gL.isConnected){clearInterval(iv);return}if(!hh.isConnected||host!==hh||cur()!=='guide'||!document.getElementById('isP')){gL.remove();clearInterval(iv)}},400)}fitGv();setTimeout(fitGv,60);setTimeout(fitGv,400);setTimeout(fitGv,1000);var gi=host.querySelector('.gvx img');if(gi)gi.onload=fitGv;window.scrollTo(0,keep?y:0);tick()}
