    if(c[3]==='sct'){var tb=TAB.sct||'en',L=tb==='ur'?norm('sct_ur'):norm('sct_en');var xx=O(D[tb==='ur'?'sct_ur':'sct_en']);
      return h+'<div class="tabs"><button type="button" data-tab="sct:en" class="'+(tb==='en'?'on':'')+'">🇬🇧 English ('+A(O(D.sct_en).items).length+')</button><button type="button" data-tab="sct:ur" class="'+(tb==='ur'?'on':'')+'">🇵🇰 اردو ('+A(O(D.sct_ur).items).length+')</button></div>'+

    if(c[3]==='qa')return h+(A(x.diagrams).length?'<div class="bx"><h4>📐 Diagram questions <small>'+A(x.diagrams).length+'</small></h4>'+A(x.diagrams).map(function(q,i){return '<div class="dq"><div class="s"><b>'+(i+1)+'.</b> '+esc(q.q)+'</div><div class="dg">'+q.svg+'</div><div class="tp">'+A(q.opts).map(function(o){return '<span>'+esc(o)+'</span>'}).join('')+'</div><button type="button" class="sh" data-sh="1">👁 Show answer</button><span class="r" hidden>'+esc(q.a)+'</span></div>'}).join('')+'</div>':'')+ul('💡 Tips',x.tips)+(A(x.samples).length?'<div class="bx"><h4>Practice <small>'+A(x.samples).length+'</small></h4>'+items(x.samples,'qa')+'</div>':'');
    return h+ul('💡 Tips',x.tips)+(A(x.samples).length?ul('🧩 Sample tasks',A(x.samples).map(function(i){return typeof i==='string'?i:(i.s||i.q||'')})):'')+(k==='iot'?chips('🧗 Obstacles',x.obstacles):'')+chips(k==='essay'?'📄 Topics':k==='gd'?'💬 Topics':k==='lecturette'?'🎙️ Topics':'Topics',x.topics)+(A(x.items).length?ul(k==='opi'?'🪞 Statements seen in the test':'Items',A(x.items).map(function(i){return typeof i==='string'?i:(i.s||'')})):'')+(k==='opi'||k==='biodata'?ul('🧾 Self description tips',O(D.selfdesc).tips):'')}
  function grid(list){return '<div class="sg">'+list.map(function(c,i){return '<button type="button" class="sc" data-sub="'+c[0]+'" style="background:'+SUBC[i%SUBC.length]+'"><span class="e">'+c[1]+'</span><b>'+esc(c[2])+'</b><small>'+cnt(c[0])+' items</small></button>'}).join('')+'</div>'}

      ul('💡 Tips',x.tips)+'<input class="srch" type="search" placeholder="🔍 Search a question" value="'+esc(TAB.ivq||'')+'" data-q="1"><div class="bx"><h4>Questions <small>tick the ones you can answer</small></h4>'+Q.map(function(q){var id=hid(q);return '<button type="button" class="q'+(ok[id]?' ok':'')+'" data-ck="'+id+'"><span class="ck">'+(ok[id]?'✓':'')+'</span><span>'+esc(q)+'</span></button>'}).join('')+'</div>'}

  function fmt(s){s=Math.max(0,s|0);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}

    if(dr.i>=L.length)return '<button type="button" class="bk" data-back="1">← Back</button><div class="mk"><div class="done">🏆</div><div class="qq sm">Practice finished: '+L.length+' items</div><p style="color:var(--m);font-size:13.5px">Do it daily. Speed and positive thinking come with practice.</p></div><button type="button" class="big" data-dr="'+k+'">🔁 Practise again</button>';
    var x=L[dr.i];return '<button type="button" class="bk" data-back="1">← Stop practice</button><div class="mk"><div class="c">'+(dr.i+1)+' / '+L.length+'</div><div class="qq'+(k==='wat'?'':' sm')+(ur?' ur':'')+'">'+esc(x.s)+'</div><div class="tm" id="isTm">'+fmt(dr.left)+'</div><p style="color:var(--m);font-size:12.5px;margin:0">'+(k==='wat'?'Write one positive sentence':k==='srt'?'Write your reaction quickly':k==='pointer'?'Write a short positive story':'Complete the sentence positively')+'</p>'+(x.r?(dr.show?'<span class="r'+(ur?' ur':'')+'">💡 '+esc(x.r)+'</span>':'<br><button type="button" class="sh" data-ds="1" style="font-size:13px">👁 Show sample</button>'):'')+'</div><button type="button" class="big g" data-dn="1">Next →</button>'}
  function startDrill(k){var src=k==='sct_en'||k==='sct_ur'?norm(k):norm(k),L=src.slice();for(var i=L.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=L[i];L[i]=L[j];L[j]=t}

    L.addEventListener('scroll',function(){if(!tk){tk=1;requestAnimationFrame(ap)}},{passive:true});ap();

  function fitGv(){try{var el=document.querySelector('body>.gvx');if(!el)return;var nb=document.getElementById('nbBar'),nh=nb&&nb.offsetHeight?nb.offsetHeight:66,hd=document.querySelector('body>header'),tp=hd?hd.offsetHeight:0;
    el.style.top='0px';el.style.paddingBottom=nh+'px';var inn=el.firstChild,im=inn&&inn.querySelector('img'),wv=el.clientWidth||window.innerWidth,nat=wv*1633/841,av=window.innerHeight-nh;if(inn)inn.style.height=Math.max(nat,av)+'px'}catch(e){}}
