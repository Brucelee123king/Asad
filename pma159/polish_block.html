<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- premium / cinematic look ---------- */
body{font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif!important;background:#eef2f8!important;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 600px at 8% -10%,rgba(99,102,241,.16),transparent 60%),
             radial-gradient(800px 600px at 105% 10%,rgba(56,189,248,.14),transparent 60%),
             radial-gradient(900px 700px at 50% 120%,rgba(168,85,247,.10),transparent 60%),#eef2f8}
html.dark body{background:#060a14!important}
html.dark body::before{background:radial-gradient(900px 600px at 8% -10%,rgba(79,70,229,.28),transparent 60%),
             radial-gradient(800px 600px at 105% 10%,rgba(14,165,233,.18),transparent 60%),
             radial-gradient(900px 700px at 50% 120%,rgba(147,51,234,.16),transparent 60%),#060a14}
header{background:rgba(255,255,255,.72)!important;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid rgba(148,163,184,.25)!important;box-shadow:0 8px 30px rgba(15,23,42,.06)!important}
html.dark header{background:rgba(8,12,24,.72)!important;border-bottom-color:rgba(148,163,184,.12)!important}
header h1{-webkit-text-fill-color:transparent;letter-spacing:.2px;font-weight:800!important;background:linear-gradient(90deg,#1e1b4b,#4f46e5);-webkit-background-clip:text;background-clip:text;color:transparent!important}
html.dark header h1{background:linear-gradient(90deg,#e0e7ff,#a5b4fc);-webkit-background-clip:text;background-clip:text}
header .bg-indigo-600{background:linear-gradient(135deg,#6366f1,#8b5cf6)!important;box-shadow:0 8px 20px rgba(99,102,241,.35)!important}
header>div{padding-right:64px!important}
#view-home.hidden,#view-quiz.hidden,#view-results.hidden,#view-select.hidden{display:none!important}
/* glass cards */
main .bg-white{background:rgba(255,255,255,.78)!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-color:rgba(148,163,184,.22)!important}
html.dark main .bg-white{background:rgba(17,24,39,.72)!important;border-color:rgba(148,163,184,.14)!important}
main .rounded-2xl{border-radius:20px!important}
main .shadow-xl{box-shadow:0 20px 50px -12px rgba(15,23,42,.18)!important}
html.dark main .shadow-xl{box-shadow:0 24px 60px -12px rgba(0,0,0,.6)!important}
/* category menu */
#sec-menu h2{-webkit-text-fill-color:transparent;font-size:clamp(26px,5vw,36px)!important;font-weight:800;letter-spacing:-.5px;background:linear-gradient(90deg,#0f172a,#4f46e5 60%,#0ea5e9);-webkit-background-clip:text;background-clip:text;color:transparent!important}
html.dark #sec-menu h2{background:linear-gradient(90deg,#f8fafc,#a5b4fc 60%,#7dd3fc);-webkit-background-clip:text;background-clip:text}
#sec-menu .grid>button{position:relative;overflow:hidden;border-radius:22px!important;transform:translateZ(0);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s!important;box-shadow:0 18px 40px -14px rgba(15,23,42,.45)!important;border:1px solid rgba(255,255,255,.18)}
#sec-menu .grid>button::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);transition:left .8s ease}
#sec-menu .grid>button:hover{transform:translateY(-4px) scale(1.01)!important;box-shadow:0 28px 60px -16px rgba(15,23,42,.55)!important}
#sec-menu .grid>button:hover::after{left:130%}
#sec-menu .grid>button::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
/* test cards */
#test-grid>button,#pma-grid>button,#fa-grid>button,#hk-grid>button{border-radius:18px!important;transition:transform .25s ease,box-shadow .25s ease,border-color .25s!important}
#test-grid>button:hover,#pma-grid>button:hover,#fa-grid>button:hover,#hk-grid>button:hover{transform:translateY(-3px);box-shadow:0 16px 34px -14px rgba(15,23,42,.35)!important}
/* question options */
#options-container>*{border-radius:14px!important;transition:transform .18s ease,box-shadow .2s ease,border-color .2s!important}
#options-container>*:hover{transform:translateX(3px)}
#question-text,#view-quiz h2,#view-quiz h3{letter-spacing:-.2px}
/* page transitions */
.fade-in{animation:cineIn .5s cubic-bezier(.2,.8,.2,1) forwards!important}
@keyframes cineIn{from{opacity:0;transform:translateY(10px) scale(.995);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
/* buttons */
main button.bg-indigo-600,main button.bg-emerald-600{box-shadow:0 10px 24px -8px rgba(79,70,229,.55)!important}
::selection{background:#6366f1;color:#fff}
/* header user avatar */
#hdrUser{display:none;align-items:center;gap:6px;margin-left:10px}
#hdrUser .av{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(135deg,#6366f1,#0ea5e9);box-shadow:0 6px 16px rgba(99,102,241,.35);cursor:pointer;border:2px solid rgba(255,255,255,.7)}
html.dark #hdrUser .av{border-color:rgba(255,255,255,.2)}
#authUser{display:none!important}
#themeBtn{top:12px!important;right:12px!important;bottom:auto!important;left:auto!important;width:40px!important;height:40px!important}
</style>
<script>
(function(){
  var hdr=document.querySelector('header>div');if(!hdr)return;
  var box=document.createElement('div');box.id='hdrUser';box.innerHTML='<span class="av" title="Account"></span>';
  var timer=document.getElementById('header-timer-container');
  var right=document.createElement('div');right.style.cssText='display:flex;align-items:center';
  timer.parentNode.insertBefore(right,timer);right.appendChild(timer);right.appendChild(box);
  var av=box.querySelector('.av');
  function sync(){var src=document.getElementById('authUser'),nm=(document.getElementById('authUserName')||{}).textContent||'';
    var on=src&&src.style.display==='flex';box.style.display=on?'flex':'none';
    var n=nm.replace(/^\W+\s*/,'').trim()||'Guest';av.textContent=n.charAt(0).toUpperCase();av.title=n+' — tap to log out'}
  av.onclick=function(){if(confirm('Log out of Asadullah Notes?'))authLogout();sync()};
  new MutationObserver(sync).observe(document.getElementById('authUser'),{attributes:true,childList:true,subtree:true});sync();
})();
</script>
