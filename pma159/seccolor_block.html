<style>

body[data-sec="fa"]{--c1:#b45309;--c2:#ea580c;--cs:#d97706;--ch:#b45309;--cl:#fffbeb;--ct:#92400e;--cb:#f59e0b;--cr:#fbbf24}
body[data-sec="hk"]{--c1:#0369a1;--c2:#06b6d4;--cs:#0284c7;--ch:#0369a1;--cl:#f0f9ff;--ct:#075985;--cb:#38bdf8;--cr:#7dd3fc}
body[data-sec="nv"]{--c1:#b45309;--c2:#f59e0b;--cs:#d97706;--ch:#b45309;--cl:#fffbeb;--ct:#92400e;--cb:#fcd34d;--cr:#fde68a}

/* English card + banner: dark black/grey mix (own CSS so it works with the CSS already inside the APK) */
.engrad{background-image:linear-gradient(to right,#0b0f19,#374151 60%,#6b7280)!important;color:#fff}
#en-grid .bg-amber-100{background:#e5e7eb!important;color:#111827!important}

body[data-sec] :is(#view-home,#view-quiz,#view-results) .from-indigo-600{--tw-gradient-from:var(--c1) var(--tw-gradient-from-position)!important;--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to)!important}
body[data-sec] :is(#view-home,#view-quiz,#view-results) .to-violet-600,body[data-sec] :is(#view-home,#view-quiz,#view-results) .to-indigo-900{--tw-gradient-to:var(--c2) var(--tw-gradient-to-position)!important}
body[data-sec] :is(#view-home,#view-quiz,#view-results) .bg-indigo-600{background-color:var(--cs)!important}
body[data-sec] :is(#view-home,#view-quiz,#view-results) .bg-indigo-700,body[data-sec] :is(#view-home,#view-quiz,#view-results) .hover\:bg-indigo-700:hover{background-color:var(--ch)!important}
body[data-sec] :is(#view-home,#view-quiz,#view-results) .bg-indigo-50,body[data-sec] :is(#view-home,#view-quiz,#view-results) .bg-indigo-100{background-color:var(--cl)!important}
body[data-sec] :is(#view-home,#view-quiz,#view-results) :is(.text-indigo-500,.text-indigo-600,.text-indigo-700,.text-indigo-800){color:var(--ct)!important}
body[data-sec] :is(#view-home,#view-quiz,#view-results) :is(.border-indigo-300,.border-indigo-500,.border-indigo-600,.border-indigo-700){border-color:var(--cb)!important}
body[data-sec] :is(#view-home,#view-quiz,#view-results) .ring-indigo-400{--tw-ring-color:var(--cr)!important}
body[data-sec] #header-timer-container{border-color:var(--cb)}
html.dark body[data-sec] :is(#view-home,#view-quiz,#view-results) :is(.bg-indigo-50,.bg-indigo-100){background-color:color-mix(in srgb,var(--cs) 22%,transparent)!important}
html.dark body[data-sec] :is(#view-home,#view-quiz,#view-results) :is(.text-indigo-500,.text-indigo-600,.text-indigo-700,.text-indigo-800){color:var(--cr)!important}

body[data-sec] button[onclick^="confirmSubmitQuiz"],body[data-sec] button[onclick^="executeSubmitQuiz"]{background:linear-gradient(135deg,var(--c1),var(--c2))!important;box-shadow:0 10px 22px -8px var(--cs)!important}
body[data-sec] button[onclick^="confirmSubmitQuiz"]:hover,body[data-sec] button[onclick^="executeSubmitQuiz"]:hover{filter:brightness(1.08)}
#view-home .text-emerald-600{color:#4f46e5!important}
body[data-sec] #view-home .text-emerald-600{color:var(--cs)!important}

<script>
(function(){
  if(typeof selectTest!=='function')return;
  var _sel=selectTest,_show=showSelect;
  window.selectTest=selectTest=function(k){var c=(isHK(k)||isMR(k))?'hk':(typeof isEN==='function'&&isEN(k))?'en':isCN(k)?'cn':isIV(k)?'iv':(isNV(k)||(typeof isVB==='function'&&isVB(k)))?'nv':(isPG(k)||isPF(k))?'pg':isLC(k)?'lc':isFA(k)?'fa':isPMA(k)?'pma':'';if(c)document.body.dataset.sec=c;else delete document.body.dataset.sec;return _sel.apply(this,arguments)};
  window.showSelect=showSelect=function(){var r=_show.apply(this,arguments);if(!quizActive)delete document.body.dataset.sec;return r};
})();
</script>
