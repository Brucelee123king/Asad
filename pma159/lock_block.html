<style>
#lkModal{position:fixed;left:0;top:0;right:0;bottom:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(2,6,23,.6)}
#lkModal.open{display:flex}
#lkModal .box{width:min(380px,100%);border-radius:22px;padding:20px;background:#fff;color:#0f172a;box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
html.dark #lkModal .box{background:#0f172a;color:#e2e8f0;border:1px solid rgba(148,163,184,.2)}
#lkModal h3{margin:0 0 4px;font-size:19px;font-weight:800}
#lkModal p{margin:0 0 12px;font-size:13px;opacity:.75;line-height:1.45}
#lkModal input{width:100%;padding:13px 12px;border-radius:12px;border:1px solid rgba(148,163,184,.55);font-size:18px;letter-spacing:.12em;text-transform:uppercase;text-align:center;background:transparent;color:inherit;box-sizing:border-box}
#lkModal .err{min-height:20px;margin:8px 0 0;font-size:13px;font-weight:700;color:#dc2626}
#lkModal .row{display:flex;gap:8px;margin-top:10px}
#lkModal button{flex:1;border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
#lkModal .ok{background:#4f46e5;color:#fff}#lkModal .no{background:rgba(148,163,184,.25);color:inherit}
#lkModal button[disabled]{opacity:.5}
#sec-menu .lkcard{position:relative}
#sec-menu .lkcard::after{content:"\1F512";position:absolute;right:14px;top:12px;font-size:20px;filter:none}
#lkAll{display:none;margin:6px auto 0;border:1px solid rgba(148,163,184,.5);background:transparent;color:inherit;border-radius:999px;padding:6px 14px;font-size:12px;cursor:pointer}
</style>
<div id="lkModal" role="dialog" aria-modal="true" aria-label="Unlock category"><div class="box">
  <h3 id="lkTitle">Unlock</h3><p id="lkSub">Enter the password for this category.</p>
  <input id="lkPw" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="PASSWORD">
  <div class="err" id="lkErr"></div>
  <div class="row"><button class="no" id="lkNo" type="button">Cancel</button><button class="ok" id="lkGo" type="button">Unlock</button></div>
</div></div>
<script>
(function(){
  var L=window.__LOCK;if(!L)return;
  var $=function(i){return document.getElementById(i)};
  var NAMES={o:'1000 MCQs',pma:'PMA 159 MCQs',fa:'Forces Academy Lahore MCQs',hk:'Hakeem Force Academy MCQs',lc:'PMA 158 Long Course MCQs',pg:'Pro Genius Academy MCQs',nv:'Non Verbal PMA Test'};
  var ST={};function save(){}
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function hex(u){var s='';for(var i=0;i<u.length;i++)s+=('0'+u[i].toString(16)).slice(-2);return s}
  function unhex(h){var u=new Uint8Array(h.length/2);for(var i=0;i<u.length;i++)u[i]=parseInt(h.substr(i*2,2),16);return u}
  var subtle=window.crypto&&window.crypto.subtle;
  function decryptWith(id,rawKey){
    var c=L.cats[id];
    return subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']).then(function(k){
      return subtle.decrypt({name:'AES-GCM',iv:b64(c.iv)},k,b64(c.ct))}).then(function(buf){
      var out=new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip')));return out.text()}).then(function(t){return JSON.parse(t)});
  }
  function applyData(id,data){
    Object.keys(data).forEach(function(k){ALL[k]=data[k]});
    ST[id]=1;
  }
  function refreshAll(){
    try{if(window.__flatReset)window.__flatReset();if(window.__rngReset)window.__rngReset()}catch(e){}
    try{renderSelect();renderPMA();renderFA();renderHK();renderLC();if(typeof renderPG==='function')renderPG();if(typeof renderNV==='function')renderNV();applySec()}catch(e){}
  }
  window.__isLocked=function(id){return !!L.cats[id]&&!ST[id]};
  function deriveKey(id,pw){
    var c=L.cats[id];
    return subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
      return subtle.deriveBits({name:'PBKDF2',salt:b64(c.salt),iterations:c.iter,hash:'SHA-256'},k,256)}).then(function(b){return new Uint8Array(b)});
  }
  var pending=null;
  function openLock(id,cb){
    if(!subtle||typeof DecompressionStream==='undefined'){alert('This app needs a newer Android System WebView to unlock categories. Please update it in Play Store.');return}
    pending={id:id,cb:cb};$('lkTitle').textContent='Unlock '+(NAMES[id]||'category');$('lkSub').textContent='Enter the password for this category. Ask the admin if you do not have it.';
    $('lkPw').value='';$('lkErr').textContent='';$('lkGo').disabled=false;$('lkModal').classList.add('open');setTimeout(function(){$('lkPw').focus()},60);
  }
  window.__openLock=openLock;
  function closeLock(){$('lkModal').classList.remove('open');pending=null}
  function tryUnlock(){
    if(!pending)return;var id=pending.id,cb=pending.cb;
    var pw=$('lkPw').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(!pw){$('lkErr').textContent='Type the password.';return}
    $('lkGo').disabled=true;$('lkErr').textContent='Checking...';
    deriveKey(id,pw).then(function(raw){return decryptWith(id,raw).then(function(data){return [raw,data]})}).then(function(r){
      applyData(id,r[1]);try{localStorage.setItem('lk_k_'+id,hex(r[0]))}catch(e){}save();closeLock();refreshAll();
      if(cb)cb();else try{openSec(id)}catch(e){}
    }).catch(function(){$('lkErr').textContent='Wrong password. Try again.';$('lkGo').disabled=false;$('lkPw').select()});
  }
  $('lkGo').onclick=tryUnlock;$('lkNo').onclick=closeLock;
  $('lkPw').addEventListener('keydown',function(e){if(e.key==='Enter')tryUnlock()});
  $('lkModal').addEventListener('click',function(e){if(e.target===this)closeLock()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('lkModal').classList.contains('open'))closeLock()});
  /* locked categories: tapping the card asks for the password instead of opening */
  var _os=window.openSec;
  window.openSec=function(id){if(id&&window.__isLocked(id)){openLock(id);return}return _os.apply(this,arguments)};
  function decorate(){
    var m=$('sec-menu');if(!m)return;
    m.querySelectorAll('button[onclick^="openSec("]').forEach(function(b){
      var mm=/openSec\('([a-z]+)'\)/.exec(b.getAttribute('onclick')||'');if(!mm)return;
      var lk=window.__isLocked(mm[1]);b.classList.toggle('lkcard',lk);
      var sm=b.querySelector('.text-white\\/80');if(sm&&lk&&!sm.getAttribute('data-lk')){sm.setAttribute('data-lk','1');sm.textContent='Locked - tap and enter the password'}
    });
    var any=Object.keys(L.cats).some(function(i){return !window.__isLocked(i)});
    var a=$('lkAll');if(!a){a=document.createElement('button');a.id='lkAll';a.type='button';a.textContent='\\uD83D\\uDD12 Lock all categories';a.onclick=function(){try{Object.keys(L.cats).forEach(function(i){localStorage.removeItem('lk_k_'+i)});}catch(e){}location.reload()};
      var h=m.firstChild;if(h&&h.firstChild)h.firstChild.appendChild(a)}
    if(a)a.style.display=any?'block':'none';
  }
  var _rm=window.renderMenu;if(typeof _rm==='function')window.renderMenu=function(){var r=_rm.apply(this,arguments);try{decorate()}catch(e){}return r};
  /* auto-unlock on later launches with the key saved after the first correct password */
  var ids=Object.keys(L.cats),left=ids.length;
  function done(){if(--left===0){refreshAll()}}
  var any=false;
  ids.forEach(function(id){
    var h=null;try{h=localStorage.getItem('lk_k_'+id)}catch(e){}
    if(!h||!subtle||typeof DecompressionStream==='undefined'){done();return}
    decryptWith(id,unhex(h)).then(function(d){applyData(id,d)}).catch(function(){try{localStorage.removeItem('lk_k_'+id)}catch(e){}}).then(done);
  });
  try{decorate()}catch(e){}
})();
</script>
