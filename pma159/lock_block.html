<style>
#lkModal{position:fixed;left:0;top:0;right:0;bottom:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(2,6,23,.6)}
#lkModal.open{display:flex}
#lkModal .box{width:min(380px,100%);border-radius:22px;padding:20px;background:#fff;color:#0f172a;box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
html.dark #lkModal .box{background:#0f172a;color:#e2e8f0;border:1px solid rgba(148,163,184,.2)}
#lkModal h3{margin:0 0 4px;font-size:19px;font-weight:800}
#lkModal p{margin:0 0 12px;font-size:13px;opacity:.75;line-height:1.45}
#lkModal input{width:100%;padding:13px 12px;border-radius:12px;border:1px solid rgba(148,163,184,.55);font-size:18px;letter-spacing:.12em;text-transform:uppercase;text-align:center;background:transparent;color:inherit;box-sizing:border-box}
#lkModal .err{min-height:20px;margin:8px 0 0;font-size:13px;font-weight:700;color:#dc2626}
#lkModal .row{display:flex;gap:8px;margin-top:10px}
#lkModal button{flex:1;border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
#lkModal .ok{background:#4f46e5;color:#fff}#lkModal .no{background:rgba(148,163,184,.25);color:inherit}
#lkModal button[disabled]{opacity:.5}
#lkAll{display:none;margin:6px auto 0;border:1px solid rgba(148,163,184,.5);background:transparent;color:inherit;border-radius:999px;padding:6px 14px;font-size:12px;cursor:pointer}
#lkToast{position:fixed;left:12px;right:12px;bottom:18px;z-index:9999;display:none;padding:12px 14px;border-radius:14px;background:#0f172a;color:#fff;font-size:13px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.4)}
</style>
<div id="lkModal" role="dialog" aria-modal="true" aria-label="Unlock category"><div class="box">
  <h3 id="lkTitle">Unlock</h3><p id="lkSub">Enter the password for this category.</p>
  <input id="lkPw" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="PASSWORD">
  <div class="err" id="lkErr"></div>
  <div class="row"><button class="no" id="lkNo" type="button">Cancel</button><button class="ok" id="lkGo" type="button">Unlock</button></div>
</div></div>
<div id="lkToast"></div>
<script>
(function(){
  var L=window.__LOCK;if(!L)return;
  var $=function(i){return document.getElementById(i)};
  var NAMES={o:'1000 MCQs',pma:'PMA 159 MCQs',fa:'Forces Academy Lahore MCQs',hk:'Hakeem Force Academy MCQs',lc:'PMA 158 Long Course MCQs',pg:'Pro Genius Academy MCQs',nv:'Non Verbal PMA Test'};
  var DAY=86400000,EXP=(L.expiryDays||7)*DAY,ids=Object.keys(L.cats),ST={},busy=false;
  var subtle=window.crypto&&window.crypto.subtle,okEnv=!!subtle&&typeof DecompressionStream!=='undefined';
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
  function toast(m){var t=$('lkToast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){t.style.display='none'},7000)}
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function hex(u){var s='';for(var i=0;i<u.length;i++)s+=('0'+u[i].toString(16)).slice(-2);return s}
  function unhex(h){var u=new Uint8Array(h.length/2);for(var i=0;i<u.length;i++)u[i]=parseInt(h.substr(i*2,2),16);return u}
  /* ---- tiny IndexedDB cache for the (still encrypted) data files ---- */
  var _db=null;
  function db(){return _db||(_db=new Promise(function(res,rej){try{var r=indexedDB.open('lkdb',1);r.onupgradeneeded=function(){r.result.createObjectStore('ct')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}}))}
  function idbGet(k){return db().then(function(d){return new Promise(function(res){var q=d.transaction('ct').objectStore('ct').get(k);q.onsuccess=function(){res(q.result||null)};q.onerror=function(){res(null)}})}).catch(function(){return null})}
  function idbSet(k,v){return db().then(function(d){return new Promise(function(res){var t=d.transaction('ct','readwrite');t.objectStore('ct').put(v,k);t.oncomplete=function(){res()};t.onerror=function(){res()}})}).catch(function(){})}
  function idbDel(k){return db().then(function(d){return new Promise(function(res){var t=d.transaction('ct','readwrite');t.objectStore('ct').delete(k);t.oncomplete=function(){res()};t.onerror=function(){res()}})}).catch(function(){})}
  /* ---- crypto ---- */
  function decryptWith(file,rawKey){
    return subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']).then(function(k){return subtle.decrypt({name:'AES-GCM',iv:b64(file.iv)},k,b64(file.ct))}).then(function(buf){
      return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}).then(function(t){return JSON.parse(t)});
  }
  function deriveKey(file,pw){
    return subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
      return subtle.deriveBits({name:'PBKDF2',salt:b64(file.salt),iterations:file.iter,hash:'SHA-256'},k,256)}).then(function(b){return new Uint8Array(b)});
  }
  /* ---- network ---- */
  function getJSON(path){return fetch(L.base+path,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json()})}
  var fetchLock=function(){return getJSON('lock.json?t='+Date.now())};
  var fetchCat=function(id,v){return getJSON('data/'+id+'.json?v='+encodeURIComponent(v||Date.now()))};
  /* ---- state ---- */
  window.__isLocked=function(id){return !!L.cats[id]&&!ST[id]};
  function refreshAll(){
    try{if(window.__flatReset)window.__flatReset();if(window.__rngReset)window.__rngReset()}catch(e){}
    try{renderSelect();renderPMA();renderFA();renderHK();renderLC();if(typeof renderPG==='function')renderPG();if(typeof renderNV==='function')renderNV();applySec()}catch(e){}
  }
  function applyData(id,data){Object.keys(data).forEach(function(k){ALL[k]=data[k]});ST[id]=1}
  function relock(id){var st=window.__mkStubs(id);Object.keys(st).forEach(function(k){ALL[k]=st[k]});delete ST[id]}
  function forget(id){ls('lk_k_'+id,null);ls('lk_v_'+id,null);ls('lk_t_'+id,null);return idbDel(id)}
  /* ---- password window ---- */
  var pending=null;
  function openLock(id,cb){
    if(!okEnv){alert('This app needs a newer Android System WebView to unlock categories. Please update it in Play Store.');return}
    pending={id:id,cb:cb};$('lkTitle').textContent='Unlock '+(NAMES[id]||'category');$('lkSub').textContent='Enter the password for this category. Ask the admin if you do not have it. Internet is needed the first time.';
    $('lkPw').value='';$('lkErr').textContent='';$('lkGo').disabled=false;$('lkModal').classList.add('open');setTimeout(function(){$('lkPw').focus()},60);
  }
  window.__openLock=openLock;
  function closeLock(){$('lkModal').classList.remove('open');pending=null}
  function tryUnlock(){
    if(!pending)return;var id=pending.id,cb=pending.cb;
    var pw=$('lkPw').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(!pw){$('lkErr').textContent='Type the password.';return}
    $('lkGo').disabled=true;$('lkErr').textContent='Checking...';
    fetchCat(id).then(function(file){
      return deriveKey(file,pw).then(function(raw){return decryptWith(file,raw).then(function(data){return {file:file,raw:raw,data:data}})}).catch(function(){var e=new Error('pw');e.pw=1;throw e});
    }).then(function(r){
      applyData(id,r.data);ls('lk_k_'+id,hex(r.raw));ls('lk_v_'+id,r.file.v);ls('lk_t_'+id,String(Date.now()));
      return idbSet(id,r.file).then(function(){closeLock();refreshAll();if(cb)cb();else try{openSec(id)}catch(e){}});
    }).catch(function(e){$('lkErr').textContent=e&&e.pw?'Wrong password. Try again.':'Could not download. Check your internet and try again.';$('lkGo').disabled=false;if(e&&e.pw)$('lkPw').select()});
  }
  $('lkGo').onclick=tryUnlock;$('lkNo').onclick=closeLock;
  $('lkPw').addEventListener('keydown',function(e){if(e.key==='Enter')tryUnlock()});
  $('lkModal').addEventListener('click',function(e){if(e.target===this)closeLock()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('lkModal').classList.contains('open'))closeLock()});
  var _os=window.openSec;
  window.openSec=function(id){if(id&&window.__isLocked(id)){openLock(id);return}return _os.apply(this,arguments)};
  function decorate(){
    var m=$('sec-menu');if(!m)return;
    m.querySelectorAll('button[onclick^="openSec("]').forEach(function(b){
      var mm=/openSec\('([a-z]+)'\)/.exec(b.getAttribute('onclick')||'');if(!mm)return;
      var lk=window.__isLocked(mm[1]);var sm=b.querySelector('.text-white\\/80');
      if(sm){if(lk&&!sm.getAttribute('data-lk')){sm.setAttribute('data-lk',sm.textContent);sm.textContent='🔒 Locked - tap and enter the password'}}
    });
    var any=ids.some(function(i){return !window.__isLocked(i)});
    var a=$('lkAll');if(!a){a=document.createElement('button');a.id='lkAll';a.type='button';a.textContent='🔒 Lock all categories';
      a.onclick=function(){Promise.all(ids.map(forget)).then(function(){location.reload()})};
      var h=m.firstChild;if(h&&h.firstChild)h.firstChild.appendChild(a)}
    if(a)a.style.display=any?'block':'none';
  }
  var _rm=window.renderMenu;if(typeof _rm==='function')window.renderMenu=function(){var r=_rm.apply(this,arguments);try{decorate()}catch(e){}return r};
  /* ---- launch: open from the saved copy, then check the server (password changed? new data? expired?) ---- */
  function loadSaved(id){
    var h=ls('lk_k_'+id);if(!h||!okEnv)return Promise.resolve(false);
    var t=parseInt(ls('lk_t_'+id)||'0',10);if(Date.now()-t>EXP||t>Date.now()+DAY)return Promise.resolve(false);   /* expired: must check online first */
    return idbGet(id).then(function(file){if(!file)return false;return decryptWith(file,unhex(h)).then(function(d){applyData(id,d);return true}).catch(function(){return false})});
  }
  function syncOne(id,lock){
    var h=ls('lk_k_'+id);if(!h)return Promise.resolve();
    var sv=lock.v&&lock.v[id],have=ls('lk_v_'+id);
    if(!sv){return forget(id).then(function(){relock(id);toast((NAMES[id]||'Category')+' was removed by the admin.')})}
    var need=sv!==have||!ST[id];
    if(!need){ls('lk_t_'+id,String(Date.now()));return Promise.resolve()}
    return fetchCat(id,sv).then(function(file){
      return decryptWith(file,unhex(h)).then(function(d){applyData(id,d);ls('lk_v_'+id,file.v);ls('lk_t_'+id,String(Date.now()));return idbSet(id,file)},function(){
        return forget(id).then(function(){relock(id);toast('The password of "'+(NAMES[id]||'a category')+'" was changed. Enter the new password to open it.')})});
    }).catch(function(){});
  }
  function sync(){
    if(busy||!okEnv||!navigator.onLine)return Promise.resolve();
    if(typeof quizActive!=='undefined'&&quizActive)return Promise.resolve();
    busy=true;
    return fetchLock().then(function(lock){return Promise.all(ids.map(function(id){return syncOne(id,lock)}))}).catch(function(){}).then(function(){busy=false;ls('lk_sync',String(Date.now()));refreshAll()});
  }
  window.__lkSync=sync;
  Promise.all(ids.map(loadSaved)).then(function(){refreshAll();return sync()}).then(function(){
    /* saved key but the saved copy was missing or expired and we are offline: tell the user */
    var exp=ids.filter(function(id){return ls('lk_k_'+id)&&!ST[id]});
    if(exp.length&&!navigator.onLine)toast('Connect to the internet once to re-open your unlocked categories.')});
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&Date.now()-parseInt(ls('lk_sync')||'0',10)>1800000)sync()});
  try{decorate()}catch(e){}
})();
</script>
