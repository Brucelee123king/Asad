<style id="admCss">
/* Admin Experience tab (bottom bar): journey path of 4 stages; tapping a stage opens its page, Back returns */
.ax{--b:#fff;--t:#0f172a;--m:#64748b;--l:#e2e8f0;padding:14px 14px 90px;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--t);text-align:left}
html.dark .ax{--b:#111c33;--t:#f1f5f9;--m:#94a3b8;--l:#1e293b}
.ax button{font:inherit;color:inherit;text-align:left;cursor:pointer;background:none;border:0;padding:0}
.ax-top{border-radius:20px;padding:16px;color:#fff;background:linear-gradient(135deg,#2e4a1e,#4d7c2a);border:2px solid #f1d27a;margin-bottom:14px}
.ax-k{color:#f1d27a;font-weight:900;font-size:12px;letter-spacing:.12em}.ax-top h2,.ax-hero h2{margin:4px 0 2px;font-size:21px;color:#fff}.ax-top p,.ax-hero p{margin:0;font-size:13px;opacity:.9;color:#fff}
.ax-r{display:flex;gap:12px;position:relative;padding-bottom:14px;width:100%}.ax-r:before{content:"";position:absolute;left:24px;top:52px;bottom:0;width:3px;background:var(--l)}.ax-r:last-child:before{display:none}
.ax-ri{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:23px;flex:none;z-index:1;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.ax-rc{flex:1;background:var(--b);border-radius:18px;padding:13px 14px;box-shadow:0 6px 16px rgba(15,23,42,.06);border:1px solid var(--l)}
.ax-rc .h{display:flex;justify-content:space-between;align-items:center;gap:8px}.ax-rc b{font-size:15.5px}.ax-rc small{display:block;color:var(--m);font-size:12.5px;margin-top:3px}
.ax-rc .ax-go{display:block;margin-top:6px;font-size:12px;font-weight:800;color:#4f46e5}html.dark .ax-rc .ax-go{color:#a5b4fc}
.ax-tag{border-radius:99px;padding:3px 9px;font-size:11px;font-weight:800;white-space:nowrap}.ax-done{background:#dcfce7;color:#166534}.ax-next{background:#ede9fe;color:#5b21b6}.ax-lock{background:#f1f5f9;color:#64748b}
.ax-r.lock{opacity:.6}
.ax-bk{display:inline-flex;align-items:center;gap:6px;background:var(--b)!important;border:1px solid var(--l)!important;border-radius:99px!important;padding:8px 14px!important;font-weight:800;margin-bottom:12px}
.ax-hero{border-radius:20px;padding:16px;color:#fff;background:linear-gradient(135deg,#2e4a1e,#4d7c2a);border:2px solid #f1d27a;margin-bottom:12px}
.ax-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12.5px;margin-top:8px}
.ax-pass{margin-top:10px;background:#f1d27a;color:#2e4a1e;border-radius:12px;padding:8px;text-align:center;font-weight:900}
.ax-note{background:var(--b);border:1px dashed #94a3b8;border-radius:16px;padding:12px;margin-bottom:12px;font-size:13.5px;color:var(--m)}
.ax-s{background:var(--b);border-radius:18px;margin-bottom:10px;box-shadow:0 6px 16px rgba(15,23,42,.06);border:1px solid var(--l);overflow:hidden}
.ax-sh{display:flex!important;align-items:center;gap:10px;width:100%;padding:13px 14px!important}.ax-si{font-size:22px}.ax-st{flex:1}.ax-st b{display:block;font-size:15px}.ax-st small{color:var(--m);font-size:12px}
.ax-ar{color:#94a3b8;transition:transform .2s}.ax-s.open .ax-ar{transform:rotate(90deg)}
.ax-sb{display:none;padding:0 14px 14px;font-size:13.5px;line-height:1.6}.ax-s.open .ax-sb{display:block}
.ax-sb p{margin:0 0 8px;color:var(--m)}.ax-sb h4{margin:12px 0 2px;font-size:14px}.ax-sb ol,.ax-sb ul{margin:4px 0 6px;padding-left:22px}.ax-sb li{margin:3px 0}
.ax-ok{list-style:none;padding-left:0!important}.ax-ok li:before{content:"✅ "}.ax-no{list-style:none;padding-left:0!important}.ax-no li:before{content:"❌ "}
.ax-qa{list-style:none;padding-left:0!important}.ax-qa li{padding:8px 0;border-bottom:1px dashed var(--l)}.ax-qa span{display:block;color:var(--m)}.ax-qa span:before{content:"💡 "}
.ax-sm{font-size:11.5px!important}.ax-end{text-align:center;font-weight:800;color:var(--t)!important;margin-top:10px!important}
</style>
<script>
(function(){
  var D=@@DATA@@,order=['t','m','p','i','s'],view=null,host=null;
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function tag(s){return s==='done'?'<span class="ax-tag ax-done">✅ Passed</span>':s==='next'?'<span class="ax-tag ax-next">⏳ Next</span>':'<span class="ax-tag ax-lock">🔒 Soon</span>'}
  function list(){return '<div class="ax"><div class="ax-top"><div class="ax-k">🪖 PMA 159 LONG COURSE</div><h2>Admin Experience</h2><p>My journey, step by step. Tap a stage to read.</p></div>'+
    order.map(function(k){var x=D[k];return '<button type="button" class="ax-r'+(x.s==='lock'?' lock':'')+'" data-ax="'+k+'"><span class="ax-ri" style="background:linear-gradient(135deg,'+x.a+','+x.b+')">'+x.ic+'</span><span class="ax-rc"><span class="h"><b>'+esc(x.t)+'</b>'+tag(x.s)+'</span><small>'+esc(x.d)+'</small><span class="ax-go">Open →</span></span></button>'}).join('')+'</div>'}
  function page(k){return '<div class="ax"><button type="button" class="ax-bk" data-axb="1">← Back</button>'+D[k].h+'</div>'}
  function draw(){if(!host)return;host.innerHTML=view?page(view):list();try{host.scrollTop=0}catch(e){}}
  window.__admHtml=function(){view=null;return list()};
  window.__admWire=function(pg){host=pg;view=null;pg.onclick=function(e){
    var b=e.target.closest('[data-axb]');if(b){if(view){try{history.back()}catch(x){view=null;draw()}}return}
    var s=e.target.closest('.ax-sh');if(s){s.parentElement.classList.toggle('open');return}
    var r=e.target.closest('[data-ax]');if(r){view=r.getAttribute('data-ax');draw();try{history.pushState({n:1,nb:1,ax:1},'')}catch(x){}}}};
  window.__admBack=function(){if(host&&view&&document.getElementById('nbPage')===host){view=null;draw();return true}return false};
})();
</script>
