<style id="admCss">
/* Admin Experience tab (bottom bar): journey path of 4 stages; tapping a stage opens its page, Back returns */
.ax{--b:#fff;--t:#0f172a;--m:#64748b;--l:#e2e8f0;padding:14px 14px 90px;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--t);text-align:left}
html.dark .ax{--b:#111c33;--t:#f1f5f9;--m:#94a3b8;--l:#1e293b}
.ax button{font:inherit;color:inherit;text-align:left;cursor:pointer;background:none;border:0;padding:0}
.ax-top{border-radius:20px;padding:16px;color:#fff;background:linear-gradient(135deg,#2e4a1e,#4d7c2a);border:2px solid #f1d27a;margin-bottom:14px}
.ax-k{color:#f1d27a;font-weight:900;font-size:12px;letter-spacing:.12em}.ax-top h2,.ax-hero h2{margin:4px 0 2px;font-size:21px;color:#fff}.ax-top p,.ax-hero p{margin:0;font-size:13px;opacity:.9;color:#fff}
.ax-r{display:flex;gap:12px;position:relative;padding-bottom:14px;width:100%}.ax-r:before{content:"";position:absolute;left:24px;top:52px;bottom:0;width:3px;background:var(--l)}.ax-r:last-child:before{display:none}
.ax-ri{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:23px;flex:none;z-index:1;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.ax-rc{flex:1;background:var(--b);border-radius:18px;padding:13px 14px;box-shadow:0 6px 16px rgba(15,23,42,.06);border:1px solid var(--l)}
.ax-rc .h{display:flex;justify-content:space-between;align-items:center;gap:8px}.ax-rc b{font-size:15.5px}.ax-rc small{display:block;color:var(--m);font-size:12.5px;margin-top:3px}
.ax-rc .ax-go{display:block;margin-top:6px;font-size:12px;font-weight:800;color:#4f46e5}html.dark .ax-rc .ax-go{color:#a5b4fc}
.ax-tag{border-radius:99px;padding:3px 9px;font-size:11px;font-weight:800;white-space:nowrap}.ax-done{background:#dcfce7;color:#166534}.ax-next{background:#ede9fe;color:#5b21b6}.ax-lock{background:#f1f5f9;color:#64748b}
.ax-r.lock{opacity:.6}
.ax-bk{display:inline-flex;align-items:center;gap:6px;background:var(--b)!important;border:1px solid var(--l)!important;border-radius:99px!important;padding:8px 14px!important;font-weight:800;margin-bottom:12px}
.ax-hero{border-radius:20px;padding:16px;color:#fff;background:linear-gradient(135deg,#2e4a1e,#4d7c2a);border:2px solid #f1d27a;margin-bottom:12px}
.ax-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12.5px;margin-top:8px}
.ax-pass{margin-top:10px;background:#f1d27a;color:#2e4a1e;border-radius:12px;padding:8px;text-align:center;font-weight:900}
.ax-note{background:var(--b);border:1px dashed #94a3b8;border-radius:16px;padding:12px;margin-bottom:12px;font-size:13.5px;color:var(--m)}
.ax-s{background:var(--b);border-radius:18px;margin-bottom:10px;box-shadow:0 6px 16px rgba(15,23,42,.06);border:1px solid var(--l);overflow:hidden}
.ax-sh{display:flex!important;align-items:center;gap:10px;width:100%;padding:13px 14px!important}.ax-si{font-size:22px}.ax-st{flex:1}.ax-st b{display:block;font-size:15px}.ax-st small{color:var(--m);font-size:12px}
.ax-ar{color:#94a3b8;transition:transform .2s}.ax-s.open .ax-ar{transform:rotate(90deg)}
.ax-sb{display:none;padding:0 14px 14px;font-size:13.5px;line-height:1.6}.ax-s.open .ax-sb{display:block}
.ax-sb p{margin:0 0 8px;color:var(--m)}.ax-sb h4{margin:12px 0 2px;font-size:14px}.ax-sb ol,.ax-sb ul{margin:4px 0 6px;padding-left:22px}.ax-sb li{margin:3px 0}
.ax-ok{list-style:none;padding-left:0!important}.ax-ok li:before{content:"✅ "}.ax-no{list-style:none;padding-left:0!important}.ax-no li:before{content:"❌ "}
.ax-qa{list-style:none;padding-left:0!important}.ax-qa li{padding:8px 0;border-bottom:1px dashed var(--l)}.ax-qa span{display:block;color:var(--m)}.ax-qa span:before{content:"💡 "}
.ax-sm{font-size:11.5px!important}.ax-end{text-align:center;font-weight:800;color:var(--t)!important;margin-top:10px!important}
.ax-q{border-top:1px dashed var(--l);padding:10px 0;font-size:14px;line-height:1.5}.ax-q:first-of-type{border-top:0}.ax-q>b{color:#a16207}
.ax-qg{display:block;font-family:ui-monospace,monospace;letter-spacing:.2em;margin-left:22px}
.ax-ops{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:7px 0 6px}.ax-op{display:flex;gap:6px;align-items:flex-start;background:var(--l);border-radius:10px;padding:6px 8px;font-size:13px;border:2px solid transparent}
.ax-op i{font-style:normal;font-weight:800;color:var(--m)}.ax-op.ok{background:#dcfce7;border-color:#16a34a;color:#166534;font-weight:800}html.dark .ax-op.ok{background:#14321f;color:#bbf7d0}
.ax-ab{font-size:12.5px!important;font-weight:800;color:#4f46e5!important;background:none!important;border:0!important;padding:2px 0!important}html.dark .ax-ab{color:#a5b4fc!important}
.ax-ab.done{color:#166534!important}.ax-nv img{display:block;width:100%;margin:6px 0;background:#fff;border-radius:10px;border:1px solid var(--l);min-height:80px}
.ax-pg{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;margin-top:12px}.ax-pg .r{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800}.ax-pg .r em{font-style:normal;color:#f1d27a}
.ax-pb{height:9px;border-radius:9px;background:rgba(0,0,0,.25);margin-top:7px;overflow:hidden}.ax-pb i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#f1d27a,#fde68a)}
.ax-v{display:flex!important;gap:12px;align-items:stretch;width:100%;position:relative;padding-bottom:14px}
.ax-v .ln{position:absolute;left:27px;top:58px;bottom:-2px;width:4px;border-radius:4px;background:var(--l)}.ax-v.dn .ln,.ax-v.ok .ln{background:linear-gradient(#22c55e,#16a34a)}.ax-v:last-child .ln{display:none}
.ax-v .ic{position:relative;flex:none;width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.18);z-index:1}
.ax-v .ic .ck{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;background:#16a34a;border:3px solid var(--bg2,#fbf6ea);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:900}
html.dark .ax-v .ic .ck{border-color:#0b1220}
.ax-v .cd{flex:1;position:relative;overflow:hidden;background:var(--b);border:1px solid var(--l);border-radius:20px;padding:12px 14px 12px 16px;box-shadow:0 8px 20px rgba(15,23,42,.07)}
.ax-v .cd:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.ax-v .sp{font-size:10.5px;font-weight:900;letter-spacing:.12em;color:var(--c)}
.ax-v .cd b{display:block;font-size:16.5px;margin:1px 0 2px}.ax-v .cd small{display:block;color:var(--m);font-size:12.5px;line-height:1.45}
.ax-v .ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.ax-v .ft .op{font-size:12.5px;font-weight:900;color:var(--c)}
.ax-v.nx .cd{border:2px solid #8b5cf6;box-shadow:0 0 0 4px rgba(139,92,246,.15),0 8px 20px rgba(15,23,42,.07)}
.ax-v.lk .cd{border-style:dashed;box-shadow:none}.ax-v.lk .ic{filter:grayscale(.55);opacity:.75}.ax-v.lk .cd b{color:var(--m)}
.ax-ok2{background:#ffedd5;color:#9a3412}
.ax-steps{display:grid;gap:8px;margin-bottom:12px}.ax-step{display:flex;gap:10px;align-items:center;background:var(--b);border:1px solid var(--l);border-radius:16px;padding:10px 12px}
.ax-step>i{flex:none;width:26px;height:26px;border-radius:50%;background:#ea580c;color:#fff;font-style:normal;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}.ax-sic{font-size:26px}.ax-step b{display:block;font-size:14.5px}.ax-step small{color:var(--m);font-size:12.5px}
</style>
<script>
(function(){
  var D=@@DATA@@,order=['t','m','p','i','s'],view=null,host=null;
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function tag(s){return s==='done'?'<span class="ax-tag ax-done">✅ Passed</span>':s==='ok'?'<span class="ax-tag ax-ok2">✅ Done</span>':s==='next'?'<span class="ax-tag ax-next">⏳ Up next</span>':'<span class="ax-tag ax-lock">🔒 Soon</span>'}
  function list(){var n=order.filter(function(k){return D[k].s==='done'||D[k].s==='ok'}).length;
    return '<div class="ax"><div class="ax-top"><div class="ax-k">🪖 PMA 159 LONG COURSE</div><h2>Admin Experience</h2><p>My journey, step by step. Tap a stage to read.</p><div class="ax-pg"><div class="r"><span>Journey progress</span><em>'+n+' of '+order.length+' stages done</em></div><div class="ax-pb"><i style="width:'+Math.round(n*100/order.length)+'%"></i></div></div></div>'+
    order.map(function(k,ix){var x=D[k],c=x.s==='done'?'dn':x.s==='ok'?'ok':x.s==='next'?'nx':'lk';return '<button type="button" class="ax-v '+c+'" data-ax="'+k+'" style="--c:'+x.a+'"><span class="ln"></span><span class="ic" style="background:linear-gradient(135deg,'+x.a+','+x.b+')">'+x.ic+(c==='dn'||c==='ok'?'<span class="ck">✓</span>':'')+'</span><span class="cd"><span class="sp">STEP '+(ix+1)+'</span><b>'+esc(x.t)+'</b><small>'+esc(x.d)+'</small><span class="ft">'+tag(x.s)+'<span class="op">Open →</span></span></span></button>'}).join('')+'</div>'}
  function page(k){return '<div class="ax"><button type="button" class="ax-bk" data-axb="1">← Back</button>'+D[k].h+'</div>'}
  function draw(){if(!host)return;host.innerHTML=view?page(view):list();try{host.scrollTop=0}catch(e){}}
  function axImgs(sp){var b=(window.__LOCK&&window.__LOCK.base)||'./';if(b.charAt(b.length-1)!=='/')b+='/';sp.querySelectorAll('img[data-axi]').forEach(function(im){if(!im.src)im.src=b+im.getAttribute('data-axi')})}
  window.__admHtml=function(){view=null;return list()};
  window.__admWire=function(pg){host=pg;view=null;pg.onclick=function(e){
    var b=e.target.closest('[data-axb]');if(b){if(view){try{history.back()}catch(x){view=null;draw()}}return}
    var s=e.target.closest('.ax-sh');if(s){var sp=s.parentElement;sp.classList.toggle('open');if(sp.classList.contains('open'))axImgs(sp);return}
    var ab=e.target.closest('[data-axa]');if(ab){var k=ab.getAttribute('data-axa');if(ab.getAttribute('data-nv')){ab.textContent='✅ Answer: '+k.toUpperCase();ab.classList.add('done');return}var q=ab.closest('.ax-q');q.querySelectorAll('.ax-op').forEach(function(o){if(o.getAttribute('data-k')===k)o.classList.add('ok')});var t=q.querySelector('.ax-op.ok');ab.textContent='✅ Answer: '+k.toUpperCase()+(t?' ('+t.textContent.slice(1).trim()+')':'');ab.classList.add('done');return}
    var r=e.target.closest('[data-ax]');if(r){view=r.getAttribute('data-ax');draw();try{history.pushState({n:1,nb:1,ax:1},'')}catch(x){}}}};
  window.__admBack=function(){if(host&&view&&document.getElementById('nbPage')===host){view=null;draw();return true}return false};
})();
</script>
