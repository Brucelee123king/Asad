  var RMP=[{"t":"Introduction to Pakistan Military Academy","s":[{"h":"Main points","l":["PMA stands for Pakistan Military Academy.","It is located at Kakul, Abbottabad, Khyber Pakhtunkhwa, Pakistan.","PMA is the training academy for officer cadets of the Pakistan Army.","PMA Long Course is a regular commissioning route for eligible candidates.","Candidates go through a selection process before joining the academy.","Selected cadets receive military, academic, physical and leadership training.","The PMA Long Course training period is approximately two years.","Successful completion leads to commissioning as a Second Lieutenant.","Cadets are trained in discipline, teamwork, leadership, responsibility and military skills."]},{"h":"Why join PMA?","l":["Serve Pakistan.","Become a commissioned Army officer.","Develop leadership skills.","Build physical and mental fitness.","Learn discipline and teamwork.","Serve the nation with honour and responsibility."]}]},{"t":"PMA Long Course Eligibility Requirements","f":[["fa-cake-candles","Age","17 to 22*"],["fa-graduation-cap","FA / FSc","60%"],["fa-ruler-vertical","Height","5 ft 4 in"]],"s":[{"h":"1. Nationality","l":["Pakistani citizens can apply.","Candidates holding domicile of Azad Jammu and Kashmir and Gilgit-Baltistan can also apply.","Dual-nationality holders must meet the nationality surrender requirements at final selection."]},{"h":"2. Gender","l":["PMA Long Course is for male candidates."]},{"h":"3. Marital Status","l":["Candidates are generally required to be unmarried.","Married serving Armed Forces personnel above 20 years of age may qualify under the specified exception."]},{"h":"4. Age Requirements","t":[["Education / Category","Age"],["Intermediate or equivalent","17–22 years"],["Two-year graduates","17–23 years"],["Four-year graduates","17–24 years"],["Serving Army soldiers","17–25 years"]]},{"h":"","l":["Three-month age relaxation applies to the first two categories, subject to the course advertisement.","Age is calculated on the date specified in the relevant advertisement."]},{"h":"5. Educational Requirements","l":["FA/FSc or equivalent: normally minimum 60% marks.","Two-year or equivalent graduates: degree holders with at least 60% may qualify with 50% in FA/FSc.","Four-year degree holders: must meet the prescribed degree and Intermediate requirements.","Serving Army soldiers: normally 50% in FA/FSc or equivalent.","Specified areas may qualify for 55% Intermediate marks, subject to domicile and study conditions."]},{"h":"6. Specified Areas for Marks Relaxation","l":["Balochistan","FATA","Gilgit-Baltistan","District Neelum, AJK","Kohistan","Chitral","Dir","Balakot, including Kaghan and Naran","Tharparkar","Umerkot","Rajanpur","Specified Cholistan areas"]},{"h":"7. Height and Weight","l":["Minimum height: 5 feet 4 inches (162.5 cm).","Weight: according to the prescribed BMI standards.","Medical fitness is compulsory."]},{"h":"8. A-Level Candidates","l":["IBCC equivalence certificate is required.","Prescribed equivalent marks must be achieved.","Additional verification may be required for foreign qualifications."]},{"h":"9. Hope Certificate","l":["Eligible candidates awaiting their final examination results may apply under the applicable Hope Certificate conditions.","Final results must satisfy the required marks."]},{"h":"10. Important Ineligibility Conditions","x":1,"p":"Candidates may be ineligible if they:","l":["Have been declared Not Recommended by ISSB twice.","Have failed initial tests three times.","Apply within the restricted period following a previous ISSB appearance, unless officially permitted.","Have been dismissed or debarred from government or Armed Forces service.","Have relevant serious criminal convictions.","Have been declared permanently medically unfit.","Have submitted forged or altered educational documents.","Have been withdrawn from specified Armed Forces institutions on disciplinary grounds.","Test positive for prohibited drugs during the prescribed medical process."]},{"n":"Age, marks, relaxations and medical rules must be checked against the particular PMA Long Course advertisement."}]},{"t":"How to Apply for PMA Long Course","k":[["Official website","https://www.joinpakarmy.gov.pk"]],"s":[{"h":"Registration Process","o":1,"l":["Open the official Pakistan Army recruitment website.","Find the PMA Long Course advertisement.","Read the complete eligibility requirements.","Select the PMA Long Course registration option.","Enter your personal information.","Enter your educational details.","Provide your CNIC or B-Form information.","Enter your contact number and email address.","Select the available Army Selection and Recruitment Centre, as instructed.","Submit your registration.","Follow the instructions for obtaining your examination slip.","Check your examination date, time and centre."]},{"h":"Information Required","l":["Full name.","Father's name.","Date of birth.","CNIC or B-Form number.","Nationality.","Domicile.","Educational qualification.","Matriculation marks.","Intermediate marks.","Graduation details, if applicable.","Mobile number.","Email address.","Residential address."]},{"h":"Documents to Prepare","d":1,"l":["Original Matric certificate and marks sheet.","Original Intermediate certificate and marks sheet.","CNIC or B-Form.","Father's or mother's CNIC, where required.","Attested photocopies of educational documents.","Three passport-size photographs.","IBCC equivalence certificate, if applicable.","Domicile certificate, where required.","ISSB Not Recommended letter for applicable repeater candidates."]},{"h":"Important Instructions","l":["Enter correct personal information.","Do not provide false educational details.","Keep your registration information safe.","Print or save your examination slip.","Reach the recruitment centre on the assigned date and time.","Follow the latest advertisement regarding fees and documents."]}]},{"t":"PMA Initial Test Preparation","i":"The Initial Test assesses the candidate's intelligence, academic knowledge and basic understanding.","s":[{"h":"1. Intelligence Questions","l":["Verbal reasoning.","Non-verbal reasoning.","Number series.","Letter series.","Analogies.","Coding and decoding.","Pattern recognition.","Logical reasoning.","Figure completion.","Missing numbers.","Classification.","Sequence questions."]},{"h":"2. English","l":["Grammar.","Vocabulary.","Synonyms.","Antonyms.","Sentence completion.","Correct spelling.","Prepositions.","Tenses.","Reading comprehension.","Basic English usage."]},{"h":"3. Mathematics","l":["Basic arithmetic.","Addition and subtraction.","Multiplication and division.","Fractions.","Percentages.","Ratios and proportions.","Average.","Time and distance.","Profit and loss.","Basic algebra.","Number problems."]},{"h":"4. Pakistan Studies","l":["History of Pakistan.","Pakistan Movement.","Important national personalities.","Independence of Pakistan.","National symbols.","Important historical events.","Geography of Pakistan.","Provinces and capitals.","Rivers, mountains and important locations."]},{"h":"5. Islamiat","l":["Basic Islamic knowledge.","Pillars of Islam.","Articles of faith.","Important Islamic personalities.","Islamic history.","Basic Quranic knowledge.","Seerat-un-Nabi ﷺ.","Important Islamic events."]},{"h":"6. General Knowledge","l":["World geography.","Important countries and capitals.","International organizations.","Current affairs.","Science and technology.","Important national and international events.","Sports knowledge.","Basic everyday science."]},{"h":"Preparation Tips","tp":1,"l":["Practise MCQs every day.","Improve your English vocabulary.","Revise mathematics formulas.","Read current affairs.","Practise timed intelligence questions.","Work on accuracy and speed.","Practise in this app: Initial PMA Preparation, tests of 50 MCQs."]},{"n":"The exact test pattern, subjects and number of questions can vary according to the current recruitment instructions."}]},{"t":"PMA Physical Fitness Test","i":"The physical test evaluates the candidate's fitness, stamina, strength and physical ability.","s":[{"h":"Common Physical Test Activities","l":["Running.","Push-ups.","Sit-ups.","Chin-ups.","Ditch crossing, where prescribed."]},{"h":"Published PMA Long Course standards have included","t":[["Activity","Example standard"],["Running","1 km in 8 minutes"],["Push-ups","15 in 2 minutes"],["Sit-ups","15 in 2 minutes"]]},{"n":"The applicable advertisement and test-centre instructions determine the actual qualifying events and standards."},{"h":"Preparation Exercises","l":["Daily jogging.","Sprint practice.","Push-ups.","Sit-ups.","Chin-ups.","Stretching.","Basic strength training.","Stamina-building exercises."]},{"h":"Fitness Tips","tp":1,"l":["Start training gradually.","Maintain a healthy diet.","Drink sufficient water.","Get proper sleep.","Avoid overtraining.","Practise the required activities under timed conditions."]},{"n":"Candidates must qualify according to the physical standards applicable to their course."}]},{"t":"Initial Medical Examination","i":"The initial medical examination checks whether a candidate meets the preliminary medical and physical requirements.","s":[{"h":"Main Medical Checks","l":["Height measurement.","Weight measurement.","BMI assessment.","General physical fitness.","Eyesight examination.","Hearing assessment.","General body examination.","Medical history.","Identification of visible physical abnormalities.","Assessment of general health."]},{"h":"Possible Medical Assessment Areas","l":["Eyes and vision.","Ears and hearing.","Nose and throat.","Teeth and oral health.","Heart and circulation.","Respiratory system.","Bones and joints.","Spine and posture.","Skin conditions.","General physical development."]},{"h":"Medical Preparation","tp":1,"l":["Maintain healthy body weight.","Maintain good personal hygiene.","Take care of your eyesight and dental health.","Keep previous medical reports available if requested.", essing candidates for officer selection in Pakistan Army, Pakistan Navy and Pakistan Air Force.","It evaluates candidates' suitability for military leadership and officer training.","It assesses personality, intelligence, confidence, teamwork and leadership potential.","The assessment is generally conducted over four days, with activities arranged according to the board's programme."]},{"h":"1. Psychological Assessment","l":["Word Association Test (WAT).","Sentence Completion Test.","Picture Story Writing.","Situation Reaction Test.","Personality-related written assessments."]},{"h":"2. Group Testing Officer (GTO) Activities","l":["Group Discussion.","Group Planning Exercise.","Progressive Group Task.","Half Group Task.","Individual Obstacles.","Command Task.","Final Group Task.","Outdoor teamwork activities."]},{"h":"3. Interview","l":["Personal background.","Family information.","Educational history.","Personal interests.","Motivation to join the Armed Forces.","Leadership experience.","General knowledge.","Current affairs.","Personal strengths and weaknesses."]},{"h":"4. Conference","l":["Assessors review the candidate's overall performance.","Psychological, GTO and interview assessments contribute to the evaluation.","The board reaches its recommendation."]},{"h":"Qualities ISSB Looks For","l":["Leadership.","Self-confidence.","Teamwork.","Communication skills.","Responsibility.","Mental alertness.","Decision-making.","Emotional stability.","Motivation.","Honesty.","Discipline.","Physical fitness."]},{"h":"ISSB Preparation Tips","tp":1,"l":["Participate in group activities.","Improve communication in Urdu and English.","Develop general knowledge.","Improve physical fitness.","Practise logical thinking.","Be honest and natural.","Avoid artificial personality projection.","Follow official ISSB instructions."]},{"h":"Important Rules","x":1,"l":["Follow the instructions of ISSB staff.","Do not use unfair means.","Do not attempt to obtain recommendations through infl
