<style>
#auth{--tx:#f5f1ff;--mu:#bdb3e6;--gl:rgba(18,14,52,.46);--gbd:rgba(190,170,255,.28);--fb:rgba(10,8,36,.45);--fbd:rgba(190,170,255,.28);--ph:#8d82bd;--lk:#b79bff;--gh:rgba(255,255,255,.08);--ac:#8b5cf6;
  position:fixed;inset:0;z-index:9990;overflow:auto;font-family:'Plus Jakarta Sans','Roboto','Inter',system-ui,sans-serif;color:var(--tx);background:#02060f;transition:opacity .6s ease,visibility .6s}
html:not(.dark) #auth{--tx:#1b1245;--mu:#5a4d90;--gl:rgba(255,255,255,.62);--gbd:rgba(255,255,255,.8);--fb:rgba(255,255,255,.7);--fbd:rgba(110,80,200,.3);--ph:#9a8fc4;--lk:#6d3fd6;--gh:rgba(255,255,255,.55)}
#auth.hide{opacity:0;visibility:hidden}
#auth .sky{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#auth .lyr{position:absolute;inset:-4%;transform:translate3d(calc(var(--px,0)*var(--d,0)*1px),calc(var(--py,0)*var(--d,0)*1px),0);transition:transform .25s ease-out;will-change:transform}
#auth .scene{position:absolute;inset:0;background:url({{IMG_scene}}) 30% 62%/cover no-repeat;animation:auZoom 40s ease-in-out infinite alternate}
@keyframes auZoom{to{transform:scale(1.07) translate3d(-1%,-1%,0)}}
html:not(.dark) #auth .scene{filter:brightness(1.12) saturate(.95)}
#auth .veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,6,20,0) 25%,rgba(18,10,60,.55) 100%),radial-gradient(900px 600px at 15% 90%,rgba(60,140,255,.18),transparent 70%)}
html:not(.dark) #auth .veil{background:linear-gradient(90deg,rgba(235,228,255,.0) 20%,rgba(235,228,255,.55) 100%)}
#auth .stars,#auth .stars2{position:absolute;inset:-50%;background-repeat:repeat}
#auth .stars{background-image:radial-gradient(1.4px 1.4px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#cfe6ff,transparent),radial-gradient(1.6px 1.6px at 160px 60px,#fff,transparent),radial-gradient(1px 1px at 210px 190px,#bfe6ff,transparent),radial-gradient(1.2px 1.2px at 60px 210px,#fff,transparent);background-size:240px 240px;animation:auDrift 200s linear infinite,auTw 4s ease-in-out infinite}
#auth .stars2{background-image:radial-gradient(1px 1px at 40px 80px,#fff,transparent),radial-gradient(1.3px 1.3px at 130px 20px,#dbeaff,transparent),radial-gradient(1px 1px at 190px 150px,#fff,transparent);background-size:310px 310px;animation:auDrift 300s linear infinite reverse,auTw 6s 1s ease-in-out infinite}
html:not(.dark) #auth .stars,html:not(.dark) #auth .stars2{opacity:.35}
@keyframes auDrift{to{transform:translate3d(240px,120px,0)}}
@keyframes auTw{0%,100%{opacity:.95}50%{opacity:.4}}
#auth .spark{position:absolute;width:46px;height:46px;animation:auTw 3s ease-in-out infinite}
#auth .spark:before,#auth .spark:after{content:"";position:absolute;left:50%;top:50%;background:radial-gradient(closest-side,#fff,transparent);transform:translate(-50%,-50%)}
#auth .spark:before{width:46px;height:2px}#auth .spark:after{width:2px;height:46px}
#auth .spark.a{left:30%;top:24%}#auth .spark.b{left:12%;top:10%;scale:.6}#auth .spark.c{left:52%;top:46%;scale:.5;animation-delay:-1.5s}#auth .spark.d{left:44%;top:12%;scale:.7;animation-delay:-2s}
/* small planets like the reference */
#auth .pp{position:absolute;border-radius:50%;animation:auFloat 12s ease-in-out infinite}
#auth .pp.p1{left:44%;top:50%;width:clamp(46px,5.5vw,84px);aspect-ratio:1;background:radial-gradient(circle at 32% 28%,#f3e6ff,#b184f5 45%,#5b2bb0 100%);box-shadow:0 0 40px rgba(167,121,240,.65)}
#auth .pp.p1:after{content:"";position:absolute;left:46%;top:56%;width:20%;height:20%;border-radius:50%;background:rgba(70,30,140,.4);box-shadow:-18px -14px 0 -2px rgba(70,30,140,.35),14px -20px 0 -4px rgba(70,30,140,.3)}
#auth .pp.p2{left:20%;top:30%;width:clamp(26px,3vw,46px);aspect-ratio:1;background:radial-gradient(circle at 35% 30%,#ffe3f1,#f08fc0 50%,#8a2d78 100%);box-shadow:0 0 28px rgba(240,143,192,.55);animation-delay:-5s}
#auth .pp.p3{left:36%;top:78%;width:clamp(18px,2vw,30px);aspect-ratio:1;background:radial-gradient(circle at 35% 30%,#fff,#9ad7ff 50%,#3a52c4);box-shadow:0 0 22px rgba(120,190,255,.6);animation-delay:-8s}
@keyframes auFloat{0%,100%{translate:0 0}50%{translate:10px 16px}}
#auth .shoot{position:absolute;height:2px;width:150px;background:linear-gradient(90deg,transparent,#fff);border-radius:2px;opacity:0;transform:rotate(28deg);animation:auShoot 8s linear infinite}
#auth .shoot.s1{left:20%;top:4%}#auth .shoot.s2{left:46%;top:20%;animation-delay:-4s;width:110px}#auth .shoot.s3{left:62%;top:2%;animation-delay:-2s;animation-duration:5.5s}#auth .shoot.s4{left:6%;top:36%;animation-delay:-5.5s;animation-duration:9s;width:90px}
@keyframes auShoot{0%{opacity:0;translate:-60px -30px}6%{opacity:1}22%{opacity:0;translate:280px 150px}100%{opacity:0;translate:280px 150px}}
#auth .astro{position:absolute;left:40%;top:26%;width:clamp(70px,8vw,126px);aspect-ratio:120/170;filter:drop-shadow(0 8px 18px rgba(0,0,0,.6)) drop-shadow(0 0 12px rgba(150,200,255,.35));animation:auAstro 26s ease-in-out infinite}
@keyframes auAstro{0%{transform:translate(0,0) rotate(-14deg)}20%{transform:translate(-40px,34px) rotate(8deg)}45%{transform:translate(-90px,-12px) rotate(24deg)}70%{transform:translate(-30px,-44px) rotate(2deg)}100%{transform:translate(0,0) rotate(-14deg)}}
#auth .sat{position:absolute;left:-12%;top:14%;width:clamp(40px,5vw,72px);aspect-ratio:120/50;opacity:.9;animation:auSat 40s linear infinite}
@keyframes auSat{0%{transform:translate(0,0) rotate(18deg)}100%{transform:translate(70vw,22vh) rotate(18deg)}}
#auth .comet{position:absolute;left:100%;top:4%;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 14px 4px rgba(190,225,255,.9),-60px 18px 30px 6px rgba(120,190,255,.35),-130px 40px 40px 8px rgba(120,190,255,.2);animation:auComet 19s ease-in 3s infinite}
@keyframes auComet{0%{transform:translate(0,0);opacity:0}4%{opacity:1}30%{transform:translate(-95vw,38vh);opacity:1}32%,100%{transform:translate(-95vw,38vh);opacity:0}}
#auth .brand{position:absolute;left:34px;top:28px;z-index:3;display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 14px rgba(0,0,20,.85)}
#auth .brand i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#38bdf8);box-shadow:0 8px 22px rgba(139,92,246,.55);font-style:normal;font-size:17px}
#auth .brand small{display:block;font-size:9px;letter-spacing:5px;font-weight:600;color:#cbd;margin-top:-2px}
#auth .tag{position:absolute;left:34px;bottom:34px;z-index:3;font-size:clamp(22px,2.6vw,36px);font-weight:800;line-height:1.1;text-transform:uppercase;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.8)}
#auth .tag span{display:block;color:#b79bff}
/* glass form */
#auth .side{position:relative;z-index:2;min-height:100%;display:flex;align-items:center;justify-content:flex-end;padding:56px 7vw 40px;box-sizing:border-box}
#auth .wrap{width:100%;max-width:450px;padding:34px 32px 24px;border-radius:26px;background:var(--gl);border:1px solid var(--gbd);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:0 30px 80px -20px rgba(8,4,40,.7),inset 0 1px 0 rgba(255,255,255,.18)}
#auth h2{font-size:clamp(38px,4vw,54px);font-weight:800;letter-spacing:-1px;line-height:1.05;margin:0 0 10px;text-transform:uppercase}
#auth .sub{font-size:14.5px;color:var(--mu);margin:0 0 22px}
#auth .gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;height:52px;border-radius:14px;border:1px solid var(--fbd);background:var(--gh);color:var(--tx);font-size:15px;font-weight:600;cursor:pointer;transition:background .2s,transform .15s}
#auth .gbtn:hover{background:rgba(139,92,246,.22);transform:translateY(-1px)}
#auth .orr{display:flex;align-items:center;gap:12px;margin:18px 0 6px;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--mu)}
#auth .orr:before,#auth .orr:after{content:"";flex:1;height:1px;background:var(--fbd)}
#auth .fld{position:relative;margin-top:12px}
#auth .fld label{display:block;font-size:12.5px;font-weight:600;color:var(--mu);margin:0 0 6px 2px}
#auth input.in{width:100%;box-sizing:border-box;height:52px;padding:0 46px 0 16px;border-radius:14px;border:1px solid var(--fbd);background:var(--fb);color:var(--tx);font-size:15px;font-family:inherit;outline:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:border .2s,box-shadow .2s}
#auth input.in::placeholder{color:var(--ph)}
#auth input.in:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(139,92,246,.3)}
#auth .eye{position:absolute;right:12px;bottom:14px;background:none;border:0;color:var(--ph);cursor:pointer;padding:2px;z-index:2}
#auth .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#auth .opts{display:flex;justify-content:space-between;align-items:center;margin:16px 0 18px;font-size:13px;color:var(--mu)}
#auth .opts a,#auth .foot a{color:var(--lk);text-decoration:none;font-weight:700;cursor:pointer}
#auth .chk{display:flex;align-items:center;gap:8px;cursor:pointer}
#auth .chk input{accent-color:#8b5cf6;width:16px;height:16px}
#auth .btn{width:100%;height:54px;border:0;border-radius:14px;font-weight:700;font-size:16px;color:#fff;cursor:pointer;background:linear-gradient(90deg,#6d28d9,#4f46e5 55%,#3b82c4);box-shadow:0 14px 30px -10px rgba(99,70,229,.8),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s,filter .2s}
#auth .btn:hover{filter:brightness(1.12);transform:translateY(-1px)}#auth .btn:active{transform:scale(.98)}
#auth .guest{width:100%;margin-top:10px;height:50px;border-radius:14px;font-weight:700;font-size:14.5px;cursor:pointer;color:var(--tx);background:var(--gh);border:1px solid var(--fbd);transition:background .2s,transform .15s}
#auth .guest:hover{background:rgba(139,92,246,.22);transform:translateY(-1px)}
#auth .foot{text-align:center;font-size:14px;margin-top:16px;color:var(--mu)}
#auth .err{min-height:16px;font-size:12.5px;color:#ff8fa3;margin-top:10px;text-align:center}
#auth .err.ok{color:#7ff0b8}
html:not(.dark) #auth .err{color:#d6334a}html:not(.dark) #auth .err.ok{color:#14905a}
#auth .copy{text-align:center;font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mu);opacity:.6;margin-top:16px}
#auth .pane{transition:opacity .35s ease,filter .35s ease,transform .35s ease}
#auth .pane.out{opacity:0;filter:blur(8px);transform:translateY(10px);pointer-events:none}
#auth .pane[hidden]{display:none}
#auth .logo{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s;z-index:5}
#auth .logo.on{opacity:1}
#auth .logo .ring{position:absolute;width:200px;height:200px;border-radius:50%;border:2px solid rgba(167,139,250,.5);box-shadow:0 0 60px rgba(139,92,246,.5),inset 0 0 40px rgba(139,92,246,.3)}
#auth .logo.on .ring{animation:authRing .9s ease-out}
#auth .logo .mk{position:relative;width:70px;height:70px}
#auth .logo .mk i{position:absolute;width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,#c4b5fd,#38bdf8);transform:rotate(45deg);box-shadow:0 0 25px rgba(139,92,246,.7)}
#auth .logo .mk i:first-child{left:22px;top:0}#auth .logo .mk i:last-child{left:4px;top:28px;opacity:.85}
#auth .logo.on .mk{animation:authPop .9s ease}
@keyframes authRing{0%{transform:scale(.4);opacity:0}60%{opacity:1}100%{transform:scale(1.15);opacity:0}}
@keyframes authPop{0%{transform:scale(.6) rotate(-20deg);opacity:0}50%{transform:scale(1.08) rotate(0);opacity:1}100%{transform:scale(1)}}
#authUser{position:fixed;right:12px;bottom:12px;z-index:60;display:none;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(15,23,42,.88);color:#e2e8f0}
#authUser button{background:none;border:1px solid rgba(255,255,255,.25);color:#cbd5e1;border-radius:999px;padding:3px 9px;font-size:11px;cursor:pointer}
@media (max-width:860px){
  #auth .scene{background-position:40% 70%}
  #auth .sat,#auth .tag{display:none}
  #auth .astro{left:62%;top:6%;width:62px}
  #auth .pp.p1{left:10%;top:14%}
  #auth .brand{left:20px;top:18px}
  #auth .side{justify-content:center;align-items:flex-start;padding:30vh 14px 24px}
  #auth .wrap{padding:26px 20px 18px;border-radius:24px}
  #auth h2{font-size:36px}
}
@media (max-width:420px){#auth .row2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){#auth *{animation:none!important}}
</style>

<rect x="37" y="122" width="22" height="9" rx="4" fill="#ff5a5f" transform="rotate(8 48 126)"/><rect x="63" y="124" width="22" height="9" rx="4" fill="#4cc3ff" transform="rotate(-14 74 128)"/>

  </div>

<script>
(function(){
  var a=document.getElementById('auth');if(!a)return;
  [].forEach.call(a.querySelectorAll('.lyr'),function(l){l.style.setProperty('--d',l.getAttribute('data-d')||0)});
  function set(x,y){a.style.setProperty('--px',Math.max(-1,Math.min(1,x)).toFixed(3));a.style.setProperty('--py',Math.max(-1,Math.min(1,y)).toFixed(3))}
  window.addEventListener('mousemove',function(e){set(e.clientX/innerWidth*2-1,e.clientY/innerHeight*2-1)});
  var base=null,on=false;
  function ori(e){if(e.gamma==null)return;if(!base)base={b:e.beta,g:e.gamma};set((e.gamma-base.g)/25,(e.beta-base.b)/25)}
  function start(){if(on)return;on=true;window.addEventListener('deviceorientation',ori)}
  function ask(){
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(function(r){if(r==='granted')start()}).catch(function(){});
    }else start();
  }
  a.addEventListener('touchstart',function(){ask()},{once:true,passive:true});
  a.addEventListener('click',function(){ask()},{once:true});
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission!=='function')start();
  a.addEventListener('touchmove',function(e){var t=e.touches[0];if(t&&!base)set(t.clientX/innerWidth*2-1,t.clientY/innerHeight*2-1)},{passive:true});
})();
</script>
<div id="authUser"><span id="authUserName"></span><button onclick="authLogout()">Log out</button></div>
<script>
(function(){
  var LS={get:function(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
  var S=null; try{S=JSON.parse(sessionStorage.getItem('an_session_tmp'))}catch(e){}
  function hash(s){var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0}return 'h'+(h>>>0).toString(36)+'_'+s.length}
  function $(id){return document.getElementById(id)}
  function showUser(u){var b=$('authUser');if(!u){b.style.display='none';return}$('authUserName').textContent=(u.guest?'Guest':'\u{1F464} '+u.name);b.style.display='flex'}
  function enter(u,remember){if(remember)LS.set('an_session',u);else{LS.del('an_session');try{sessionStorage.setItem('an_session_tmp',JSON.stringify(u))}catch(e){}}
    var a=$('auth');a.classList.add('hide');showUser(u)}
  window.authEye=function(id){var i=$(id);i.type=i.type==='password'?'text':'password'};
  window.authSwitch=function(to){var from=to==='up'?$('paneIn'):$('paneUp'),nx=to==='up'?$('paneUp'):$('paneIn'),lg=$('authLogo');
    $('inErr').textContent='';$('upErr').textContent='';from.classList.add('out');
    setTimeout(function(){from.hidden=true;lg.classList.add('on')},300);
    setTimeout(function(){lg.classList.remove('on');nx.hidden=false;void nx.offsetWidth;nx.classList.remove('out')},1150)};
  window.authGuest=function(){enter({guest:true,name:'Guest'},false)};
  window.authSocial=function(n){var e=$('paneIn').hidden?$('upErr'):$('inErr');e.className='err';e.textContent=n+' sign-in is not available yet. Please use email, or Continue as Guest.'};
  window.authForgot=function(){var e=$('inErr');e.className='err';e.textContent='Accounts are saved on this device only. If you forgot the password, create a new account or Continue as Guest.'};
  window.authSignUp=function(ev){ev.preventDefault();var n=$('upName').value.trim(),m=$('upEmail').value.trim().toLowerCase(),p=$('upPass').value,p2=$('upPass2').value,e=$('upErr');e.className='err';
    if(p.length<6){e.textContent='Password must be at least 6 characters.';return false}
    if(p!==p2){e.textContent='Passwords do not match.';return false}
    if(!$('upAgree').checked){e.textContent='Please agree to the Terms & Privacy Policy.';return false}
    var us=LS.get('an_users')||{};if(us[m]){e.textContent='An account with this email already exists. Please sign in.';return false}
    us[m]={name:n,h:hash(m+'|'+p)};LS.set('an_users',us);e.className='err ok';e.textContent='Account created. Welcome, '+n+'!';
    setTimeout(function(){enter({name:n,email:m},true)},700);return false};
  window.authSignIn=function(ev){ev.preventDefault();var m=$('inEmail').value.trim().toLowerCase(),p=$('inPass').value,e=$('inErr');e.className='err';
    var us=LS.get('an_users')||{},u=us[m];
    if(!u){e.textContent='No account found with this email on this device. Please Sign Up first.';return false}
    if(u.h!==hash(m+'|'+p)){e.textContent='Wrong password. Please try again.';return false}
    enter({name:u.name,email:m},$('inRemember').checked);return false};
  window.authLogout=function(){LS.del('an_session');try{sessionStorage.removeItem('an_session_tmp')}catch(e){}showUser(null);var pi=$('paneIn'),pu=$('paneUp');pu.hidden=true;pu.classList.add('out');pi.hidden=false;pi.classList.remove('out');$('inErr').textContent='';$('upErr').textContent='';var a=$('auth');a.classList.remove('hide');window.scrollTo(0,0)};
  var cur=LS.get('an_session')||S;if(cur){$('auth').classList.add('hide');showUser(cur)}
})();
</script>
