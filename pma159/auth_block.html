<style>
#auth{--tx:#f4efff;--mu:#b9a9e6;--fb:rgba(20,8,52,.62);--fbd:rgba(190,160,255,.22);--ph:#7d6ba8;--lk:#b794ff;--gh:rgba(255,255,255,.07);--gb:rgba(190,160,255,.35);
  position:fixed;inset:0;z-index:9990;display:flex;overflow:auto;font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif;color:var(--tx);
  background:linear-gradient(160deg,#12063a 0%,#240b57 45%,#1b0946 100%);transition:opacity .6s ease,visibility .6s}
html:not(.dark) #auth{--tx:#241552;--mu:#5d4f8e;--fb:rgba(255,255,255,.72);--fbd:rgba(120,90,200,.25);--ph:#9a8fc0;--lk:#6d3fd6;--gh:rgba(255,255,255,.7);--gb:rgba(120,90,200,.35);
  background:linear-gradient(160deg,#f1ebff 0%,#dcecff 55%,#efe4ff 100%)}
#auth.hide{opacity:0;visibility:hidden}
/* ---- space scene ---- */
#auth .sky{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#auth .stars,#auth .stars2{position:absolute;inset:-50%;background-repeat:repeat;opacity:.9}
#auth .stars{background-image:radial-gradient(1.4px 1.4px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#d9c8ff,transparent),radial-gradient(1.6px 1.6px at 160px 60px,#fff,transparent),radial-gradient(1px 1px at 210px 190px,#bfe6ff,transparent),radial-gradient(1.2px 1.2px at 60px 210px,#fff,transparent);background-size:240px 240px;animation:auDrift 160s linear infinite,auTw 4s ease-in-out infinite}
#auth .stars2{background-image:radial-gradient(1px 1px at 40px 80px,#fff,transparent),radial-gradient(1.3px 1.3px at 130px 20px,#e8dcff,transparent),radial-gradient(1px 1px at 190px 150px,#fff,transparent);background-size:310px 310px;animation:auDrift 260s linear infinite reverse,auTw 6s 1s ease-in-out infinite}
html:not(.dark) #auth .stars,html:not(.dark) #auth .stars2{opacity:.35;filter:hue-rotate(200deg) brightness(.6)}
@keyframes auDrift{to{transform:translate3d(240px,120px,0)}}
@keyframes auTw{0%,100%{opacity:.95}50%{opacity:.45}}
#auth .neb{position:absolute;border-radius:50%;filter:blur(60px);animation:auFloat 18s ease-in-out infinite}
#auth .neb.n1{width:520px;height:520px;left:-120px;bottom:-160px;background:rgba(124,58,237,.38)}
#auth .neb.n2{width:460px;height:460px;right:-100px;top:-120px;background:rgba(56,189,248,.20);animation-delay:-7s}
html:not(.dark) #auth .neb.n1{background:rgba(167,139,250,.45)}html:not(.dark) #auth .neb.n2{background:rgba(125,211,252,.5)}
@keyframes auFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-24px)}}
#auth .planet{position:absolute;left:-9%;top:-22%;width:min(54vw,680px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 38% 78%,#bff3ff 0,#5fd3f3 22%,#2c93d6 48%,#1d4fa8 72%,#27227a 100%);
  box-shadow:0 0 120px rgba(80,190,255,.45),inset -40px -50px 120px rgba(20,10,80,.55);animation:auPlanet 22s ease-in-out infinite}
#auth .planet:before,#auth .planet:after{content:"";position:absolute;border-radius:48% 52% 55% 45%/50% 45% 55% 50%;background:rgba(20,70,150,.35)}
#auth .planet:before{width:34%;height:22%;left:22%;top:46%;transform:rotate(-14deg)}
#auth .planet:after{width:26%;height:16%;left:52%;top:62%;transform:rotate(18deg);background:rgba(120,230,255,.28)}
html:not(.dark) #auth .planet{box-shadow:0 0 90px rgba(80,170,255,.4),inset -40px -50px 110px rgba(80,60,200,.35)}
@keyframes auPlanet{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(14px,18px) rotate(2deg)}}
#auth .moon{position:absolute;left:9%;top:40%;width:min(15vw,150px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#efe3ff,#a779f0 45%,#5a2ea8 100%);box-shadow:0 0 50px rgba(167,121,240,.55);animation:auMoon 14s ease-in-out infinite}
@keyframes auMoon{0%,100%{transform:translate(0,0)}50%{transform:translate(-16px,22px)}}
#auth .shoot{position:absolute;height:2px;width:140px;background:linear-gradient(90deg,transparent,#fff);border-radius:2px;opacity:0;transform:rotate(28deg);animation:auShoot 7s linear infinite}
#auth .shoot.s1{left:48%;top:10%}#auth .shoot.s2{left:20%;top:55%;animation-delay:-3.5s;width:100px}#auth .shoot.s3{left:70%;top:35%;animation-delay:-5.2s}
html:not(.dark) #auth .shoot{background:linear-gradient(90deg,transparent,#7c5cff)}
@keyframes auShoot{0%{opacity:0;translate:-60px -30px}6%{opacity:1}22%{opacity:0;translate:260px 140px}100%{opacity:0;translate:260px 140px}}
/* ---- layout ---- */
#auth .shell{position:relative;z-index:2;width:100%;min-height:100%;display:grid;grid-template-columns:1.15fr 1fr;align-items:center;max-width:1280px;margin:0 auto;padding:28px 40px}
#auth .logoTop{position:absolute;left:36px;top:26px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.2px}
#auth .logoTop i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#38bdf8);box-shadow:0 8px 22px rgba(139,92,246,.5);font-style:normal;font-size:17px}
#auth .logoTop small{display:block;font-size:9px;letter-spacing:5px;font-weight:600;color:var(--mu);margin-top:-2px}
#auth .tag{align-self:end;padding-bottom:36px;font-size:clamp(26px,3.2vw,40px);font-weight:800;line-height:1.08;letter-spacing:-.5px;text-transform:uppercase;align-self:end;margin-top:60vh}
#auth .tag span{display:block;background:linear-gradient(90deg,#c4a6ff,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
#auth .wrap{width:min(420px,100%);margin:70px auto 40px;justify-self:center}
#auth h2{font-size:clamp(40px,5vw,56px);font-weight:800;letter-spacing:-1px;line-height:1;margin:0 0 14px;text-transform:uppercase}
#auth .sub{font-size:13px;font-weight:700;color:var(--tx);margin:0 0 12px}
#auth .hint{font-size:12.5px;color:var(--mu);margin:-6px 0 14px}
#auth label.l{display:block;font-size:12.5px;font-weight:600;color:var(--mu);margin:12px 0 6px}
#auth .f{position:relative;display:flex;align-items:center}
#auth .f svg.ic{z-index:2;pointer-events:none;position:absolute;left:14px;width:17px;height:17px;color:var(--ph)}
#auth input.in{width:100%;padding:15px 42px 15px 42px;border-radius:12px;border:1px solid var(--fbd);background:var(--fb);color:var(--tx);font-size:14.5px;outline:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:border .2s,box-shadow .2s}
#auth input.in::placeholder{color:var(--ph)}
#auth input.in:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.28)}
#auth .eye{z-index:2;position:absolute;right:10px;background:none;border:0;color:var(--ph);cursor:pointer;padding:4px}
#auth .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#auth .opts{display:flex;justify-content:space-between;align-items:center;margin:14px 0 16px;font-size:12.5px;color:var(--mu)}
#auth .opts a,#auth .foot a,#auth .tc a{color:var(--lk);text-decoration:none;font-weight:700;cursor:pointer}
#auth .chk{display:flex;align-items:center;gap:8px;cursor:pointer}
#auth .chk input{accent-color:#8b5cf6;width:16px;height:16px}
#auth .btn{width:100%;padding:15px;border:0;border-radius:12px;font-weight:700;font-size:15.5px;color:#fff;cursor:pointer;margin-top:4px;
  background:linear-gradient(90deg,#6d28d9,#4f46e5 55%,#3b82c4);box-shadow:0 12px 30px -8px rgba(99,70,229,.7),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s,filter .2s}
#auth .btn:hover{filter:brightness(1.12);transform:translateY(-1px)}#auth .btn:active{transform:scale(.98)}
#auth .guest{width:100%;margin-top:10px;padding:14px;border-radius:12px;font-weight:700;font-size:14.5px;cursor:pointer;color:var(--tx);background:var(--gh);border:1px solid var(--gb);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .2s,transform .15s}
#auth .guest:hover{background:rgba(139,92,246,.2);transform:translateY(-1px)}
#auth .or{display:flex;align-items:center;gap:10px;margin:20px 0 12px;font-size:12px;color:var(--mu)}
#auth .or:after{content:"";flex:1;height:1px;background:var(--fbd)}
#auth .soc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#auth .soc button{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;border:1px solid var(--fbd);background:var(--gh);color:var(--tx);font-size:13.5px;font-weight:600;cursor:pointer;transition:background .2s,transform .15s}
#auth .soc button:hover{background:rgba(139,92,246,.2);transform:translateY(-1px)}
#auth .tc{font-size:11.5px;color:var(--mu);margin-top:16px}
#auth .foot{font-size:13px;color:var(--mu);margin-top:14px}
#auth .err{min-height:18px;font-size:12.5px;color:#ff8fa3;margin-top:10px}
#auth .err.ok{color:#7ff0b8}
html:not(.dark) #auth .err{color:#d6334a}html:not(.dark) #auth .err.ok{color:#14905a}
#auth .copy{position:absolute;right:28px;bottom:14px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mu);opacity:.6}
#auth .pane{transition:opacity .35s ease,filter .35s ease,transform .35s ease}
#auth .pane.out{opacity:0;filter:blur(8px);transform:translateY(10px);pointer-events:none}
#auth .pane[hidden]{display:none}
html:not(.dark) #auth .tag span{background:linear-gradient(90deg,#6d3fd6,#0284c7);-webkit-background-clip:text;background-clip:text}
#auth .logo{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s;z-index:5}
#auth .logo.on{opacity:1}
#auth .logo .ring{position:absolute;width:200px;height:200px;border-radius:50%;border:2px solid rgba(167,139,250,.5);box-shadow:0 0 60px rgba(139,92,246,.5),inset 0 0 40px rgba(139,92,246,.3)}
#auth .logo.on .ring{animation:authRing .9s ease-out}
#auth .logo .mk{position:relative;width:70px;height:70px}
#auth .logo .mk i{position:absolute;width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,#c4b5fd,#38bdf8);transform:rotate(45deg);box-shadow:0 0 25px rgba(139,92,246,.7)}
#auth .logo .mk i:first-child{left:22px;top:0}#auth .logo .mk i:last-child{left:4px;top:28px;opacity:.85}
#auth .logo.on .mk{animation:authPop .9s ease}
@keyframes authRing{0%{transform:scale(.4);opacity:0}60%{opacity:1}100%{transform:scale(1.15);opacity:0}}
@keyframes authPop{0%{transform:scale(.6) rotate(-20deg);opacity:0}50%{transform:scale(1.08) rotate(0);opacity:1}100%{transform:scale(1)}}
#authUser{position:fixed;right:12px;bottom:12px;z-index:60;display:none;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(15,23,42,.88);color:#e2e8f0}
#authUser button{background:none;border:1px solid rgba(255,255,255,.25);color:#cbd5e1;border-radius:999px;padding:3px 9px;font-size:11px;cursor:pointer}
@media (max-width:860px){
  #auth .shell{grid-template-columns:1fr;padding:0 22px 24px;align-items:start}
  #auth .planet{left:50%;top:-18%;width:130vw;margin-left:-65vw}
  #auth .moon{left:6%;top:24%;width:70px}
  #auth .logoTop{left:22px;top:20px}
  #auth .tag{display:none}
  #auth .wrap{margin:calc(34vh) auto 20px}
  #auth .copy{display:none}
}
@media (max-width:420px){#auth .row2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){#auth *{animation:none!important}}
</style>

<script>
(function(){
  var LS={get:function(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
  var S=null; try{S=JSON.parse(sessionStorage.getItem('an_session_tmp'))}catch(e){}
  function hash(s){var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0}return 'h'+(h>>>0).toString(36)+'_'+s.length}
  function $(id){return document.getElementById(id)}
  function showUser(u){var b=$('authUser');if(!u){b.style.display='none';return}$('authUserName').textContent=(u.guest?'Guest':'\u{1F464} '+u.name);b.style.display='flex'}
  function enter(u,remember){if(remember)LS.set('an_session',u);else{LS.del('an_session');try{sessionStorage.setItem('an_session_tmp',JSON.stringify(u))}catch(e){}}
    var a=$('auth');a.classList.add('hide');showUser(u)}
  window.authEye=function(id){var i=$(id);i.type=i.type==='password'?'text':'password'};
  window.authSwitch=function(to){var from=to==='up'?$('paneIn'):$('paneUp'),nx=to==='up'?$('paneUp'):$('paneIn'),lg=$('authLogo');
    $('inErr').textContent='';$('upErr').textContent='';from.classList.add('out');
    setTimeout(function(){from.hidden=true;lg.classList.add('on')},300);
    setTimeout(function(){lg.classList.remove('on');nx.hidden=false;void nx.offsetWidth;nx.classList.remove('out')},1150)};
  window.authGuest=function(){enter({guest:true,name:'Guest'},false)};
  window.authSocial=function(n){var e=$('paneIn').hidden?$('upErr'):$('inErr');e.className='err';e.textContent=n+' sign-in is not available yet. Please use email, or Continue as Guest.'};
  window.authForgot=function(){var e=$('inErr');e.className='err';e.textContent='Accounts are saved on this device only. If you forgot the password, create a new account or Continue as Guest.'};
  window.authSignUp=function(ev){ev.preventDefault();var n=$('upName').value.trim(),m=$('upEmail').value.trim().toLowerCase(),p=$('upPass').value,p2=$('upPass2').value,e=$('upErr');e.className='err';
    if(p.length<6){e.textContent='Password must be at least 6 characters.';return false}
    if(p!==p2){e.textContent='Passwords do not match.';return false}
    if(!$('upAgree').checked){e.textContent='Please agree to the Terms & Privacy Policy.';return false}
    var us=LS.get('an_users')||{};if(us[m]){e.textContent='An account with this email already exists. Please sign in.';return false}
    us[m]={name:n,h:hash(m+'|'+p)};LS.set('an_users',us);e.className='err ok';e.textContent='Account created. Welcome, '+n+'!';
    setTimeout(function(){enter({name:n,email:m},true)},700);return false};
  window.authSignIn=function(ev){ev.preventDefault();var m=$('inEmail').value.trim().toLowerCase(),p=$('inPass').value,e=$('inErr');e.className='err';
    var us=LS.get('an_users')||{},u=us[m];
    if(!u){e.textContent='No account found with this email on this device. Please Sign Up first.';return false}
    if(u.h!==hash(m+'|'+p)){e.textContent='Wrong password. Please try again.';return false}
    enter({name:u.name,email:m},$('inRemember').checked);return false};
  window.authLogout=function(){LS.del('an_session');try{sessionStorage.removeItem('an_session_tmp')}catch(e){}showUser(null);var pi=$('paneIn'),pu=$('paneUp');pu.hidden=true;pu.classList.add('out');pi.hidden=false;pi.classList.remove('out');$('inErr').textContent='';$('upErr').textContent='';var a=$('auth');a.classList.remove('hide');window.scrollTo(0,0)};
  var cur=LS.get('an_session')||S;if(cur){$('auth').classList.add('hide');showUser(cur)}
})();
</script>
