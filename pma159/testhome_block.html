<style id="thCss">
/* test start page (design 4): dark card, big timer ring, colour of the opened test */
#view-home.thx{background:transparent!important;border:0!important;box-shadow:none!important;max-width:520px}
#view-home.thx>:not(#th){display:none!important}
#th{--ta:#22d3ee;--tb:#60a5fa;--bg:#fff;--tx:#0f172a;--mu:#64748b;--ch:#f1f5f9;--ln:#e2e8f0;--tgc:color-mix(in srgb,var(--ta) 75%,#000);background:var(--bg);color:var(--tx);border-radius:26px;padding:26px 20px 24px;text-align:center;box-shadow:0 14px 34px rgba(15,23,42,.10);border:1px solid var(--ln);font-family:"Plus Jakarta Sans",system-ui,sans-serif;position:relative;overflow:hidden}
#th:before{content:"";position:absolute;inset:-40% -20% auto;height:70%;background:radial-gradient(closest-side,var(--ta),transparent);opacity:.16;pointer-events:none}
#th .tg{position:relative;display:inline-block;border:1px solid var(--ln);color:var(--tgc);border-radius:99px;padding:6px 14px;font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;max-width:100%}
#th .rg{position:relative;margin:26px auto 18px;width:190px;height:190px;border-radius:50%;background:conic-gradient(var(--ta),var(--tb),var(--ta));display:flex;align-items:center;justify-content:center;box-shadow:0 0 50px color-mix(in srgb,var(--ta) 45%,transparent)}
#th .rg div{width:164px;height:164px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center}
#th .rg b{font-size:44px;color:var(--tx);font-variant-numeric:tabular-nums}#th .rg span{color:var(--mu);font-weight:700;font-size:13px}
#th h3{position:relative;font-size:22px;margin:0 0 6px;color:var(--tx);font-weight:800}#th .s{position:relative;color:var(--mu);font-size:14px;margin:0 0 20px}
#th .ch{position:relative;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}#th .ch span{background:var(--ch);border:1px solid var(--ln);color:var(--tx);border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:700}
#th .go{position:relative;display:block;width:100%;border:0;border-radius:18px;padding:18px;font-size:18px;font-weight:800;color:var(--tc,#0b1220);background:linear-gradient(90deg,var(--ta),var(--tb));cursor:pointer;box-shadow:0 10px 26px color-mix(in srgb,var(--ta) 35%,transparent)}
#th .go:active{transform:scale(.98)}#th .bk{position:relative;display:inline-block;margin-top:16px;color:var(--mu);font-weight:700;background:none;border:0;font-size:15px;cursor:pointer;padding:6px 10px}
html.dark #th{--bg:#0b1220;--tx:#f1f5f9;--mu:#94a3b8;--ch:#111c33;--ln:#1e293b;--tgc:color-mix(in srgb,var(--ta) 55%,#fff);box-shadow:0 18px 40px rgba(2,6,23,.35)}
#th:before{opacity:.10}html.dark #th:before{opacity:.16}
</style>
<script>
(function(){
  var vh=document.getElementById('view-home');if(!vh)return;
  var th=document.createElement('div');th.id='th';vh.insertBefore(th,vh.firstChild);vh.classList.add('thx');
  function col(el){try{var c=getComputedStyle(el),bi=c.backgroundImage,m=bi&&bi.match(/rgba?\([^)]*\)/g);if(m&&m.length)return [m[0],m[m.length-1]];var b=c.backgroundColor;if(b&&!/rgba\(0, 0, 0, 0\)/.test(b))return [b,b]}catch(e){}return null}
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function draw(){try{
    var bd=document.getElementById('home-badge'),bt=(bd&&bd.textContent)||'',m=/\((.*)\)\s*$/.exec(bt),name=m?m[1]:bt;
    var n=(typeof quizData!=='undefined'&&quizData)?quizData.length:0,secs=(typeof TEST_SECS!=='undefined')?TEST_SECS:n*30,mm=Math.floor(secs/60),ss=secs%60;
    var a=col(document.getElementById('start-quiz-btn'))||col(vh.querySelector('[class*="bg-gradient"]'));
    if(a){th.style.setProperty('--ta',a[0]);th.style.setProperty('--tb',a[1]);var v=(a[0].match(/[\d.]+/g)||[]).map(Number),L=v.length>2?(0.299*v[0]+0.587*v[1]+0.114*v[2])/255:1;th.style.setProperty('--tc',L<0.5?'#fff':'#0b1220')}
    th.innerHTML='<span class="tg">'+esc(name)+'</span><div class="rg"><div><b>'+String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0')+'</b><span>minutes</span></div></div>'+
      '<h3>'+n+' MCQs</h3><p class="s">The clock starts when you tap Start.</p>'+
      '<div class="ch"><span>📋 Palette</span><span>❌ Blank = wrong</span><span>⏱️ Auto-submit</span></div>'+
      '<button type="button" class="go">Start Test</button><button type="button" class="bk">← All tests</button>';
    th.querySelector('.go').onclick=function(){var b=document.getElementById('start-quiz-btn');if(b)b.click();else if(typeof startQuiz==='function')startQuiz()};
    th.querySelector('.bk').onclick=function(){if(typeof showSelect==='function')showSelect()};
  }catch(e){}}
  var f=window.selectTest;if(typeof f==='function')window.selectTest=function(){var r=f.apply(this,arguments);draw();setTimeout(draw,60);return r};
  window.__thDraw=draw;
})();
</script>
