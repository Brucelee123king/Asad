    document.body.appendChild(x);
    b.onclick=function(e){e.stopPropagation();x.hidden=!x.hidden;if(!x.hidden){onPlace();onRead(true)}};
    /* the box closes when the person touches anywhere else or scrolls */
    var shut=function(e){if(!x.hidden&&!x.contains(e.target)&&!b.contains(e.target))x.hidden=true};
    document.addEventListener('pointerdown',shut,true);document.addEventListener('touchstart',shut,{capture:true,passive:true});
    window.addEventListener('scroll',function(){x.hidden=true},{passive:true});
    setInterval(function(){var q=false;try{q=typeof quizActive!=='undefined'&&quizActive}catch(e){}var show=!!onUser&&!q&&A.classList.contains('hide');document.documentElement.classList.toggle('onon',show);if(!show)x.hidden=true;else onPlace()},500)}
  /* keep the icon in the same line as the moon button (the phone app moves the moon below the status bar) */
  function onPlace(){var t=$('themeBtn'),b=$('onBtn'),x=$('onBox');if(!t||!b)return;var r=t.getBoundingClientRect();if(!r.width)return;
    b.style.top=r.top+'px';b.style.left=(r.left-r.width-8)+'px';b.style.right='auto';b.style.width=r.width+'px';b.style.height=r.height+'px';if(x)x.style.top=(r.bottom+10)+'px'}
  /* online/now = {uid:{t:server time, on:true/false}}: on:true every 90 s while the app is open, on:false the moment it is closed or hidden */
  var ONW=210000,onStat=null,onWasShown=document.visibilityState==='visible';
  function onSave(on){if(!onUser)return Promise.resolve();var o={};o[onUser.uid]={t:FB.serverTimestamp(),on:on};return FB.setDoc(FB.doc(fs,'online','now'),o,{merge:true}).catch(function(){})}
  function onBeat(){if(!onUser)return;onSave(true).then(function(){onRead()})}
  function onRead(withStats){if(!onUser)return;
    var ps=[FB.getDoc(FB.doc(fs,'online','now'))];if(withStats||onStat===null)ps.push(FB.getDoc(FB.doc(fs,'stats','public')).then(function(d){onStat=d.exists()?(d.data().approved||0):0},function(){}));
    Promise.all(ps).then(function(r){
    var m=r[0].exists()?r[0].data():{},all=[],k,v,ms;
    for(k in m){v=m[k];try{if(v&&v.toMillis)all.push({t:v.toMillis(),on:true});else if(v&&v.t&&v.t.toMillis)all.push({t:v.t.toMillis(),on:v.on!==false})}catch(e){}}
    var mx=Math.max.apply(null,all.map(function(a){return a.t}).concat([0]));  /* newest server time in the doc, so a wrong phone clock does not matter */
    var on=Math.max(1,all.filter(function(a){return a.on&&a.t>=mx-ONW}).length);
    var tot=Math.max(onStat||0,on);if(!onStat)tot=Math.max(tot,all.length);
    $('onDot').textContent=on;$('onOn').textContent=on;$('onTot').textContent=tot}).catch(function(){})}
  /* the admin's own app also saves the number of approved students, so the total is right even before the admin page is opened */
  function onAdminCount(){FB.getDocs(FB.collection(fs,'users')).then(function(s){var n=0;s.forEach(function(d){if(d.data().status==='approved')n++});onStat=n;return FB.setDoc(FB.doc(fs,'stats','public'),{approved:n,t:FB.serverTimestamp()})}).catch(function(){})}
  function onSetup(user){if(!fs||!user)return;onUser=user;try{onBuild()}catch(e){}clearInterval(onT);
    if((user.email||'').toLowerCase()===ADMIN)onAdminCount();onBeat();var n=0;
    onT=setInterval(function(){n++;var open=$('onBox')&&!$('onBox').hidden;if(n%9===0)onBeat();else if(open||n%2===0)onRead()},10000)}  /* number every 20 s, every 10 s while the box is open; 'I am here' every 90 s */
  function onOff(){onUser=null;clearInterval(onT);document.documentElement.classList.remove('onon');var x=$('onBox');if(x)x.hidden=true}
  document.addEventListener('visibilitychange',function(){if(!onUser)return;if(document.visibilityState==='hidden'&&onWasShown)onSave(false);else if(document.visibilityState==='visible'){onWasShown=true;onBeat()}});  /* the phone app starts invisible: only a hide after the page was shown means the app was closed */
  window.addEventListener('pagehide',function(){if(onUser)onSave(false)});
  function cmOff(){cmOn=false;cmUser=null;var b=$('cmBox'),f=$('cmFab');if(b)b.hidden=true;if(f)f.style.display='none'}
  /* ---- one phone per account: the account works only on the phone where it was first used (the admin can reset it) ---- */
  function devId(){var r=ls('ac_dev');if(!r||r.length!==32){var a=new Uint8Array(16);crypto.getRandomValues(a);r=Array.prototype.map.call(a,function(x){return ('0'+x.toString(16)).slice(-2)}).join('');ls('ac_dev',r)}return r}
  function devCheck(user){var ref=FB.doc(fs,'devices',user.uid),me=devId();
    return FB.getDoc(ref).then(function(d){if(d.exists())return d.data().r===me?'ok':'locked';
      return FB.setDoc(ref,{r:me,t:FB.serverTimestamp()}).then(function(){return 'ok'},function(e){return /permission/.test((e&&e.code)||'')?'locked':'unknown'})}).catch(function(){return 'unknown'})}
  function showDevLocked(){showStatus('Account locked to another phone','This account is already used on another phone. One account works on one phone only. If this is your new phone, ask the admin to reset your phone, then log in again.',[['Check again',function(){handle(auth.currentUser)}],['Logout',logout]])}
  function showBlocked(){showStatus('Access stopped','Your access was stopped by the admin. Please contact him.',[['Logout',logout]])}
  function logout(){var p=auth?FB.signOut(auth):Promise.resolve();return p.catch(function(){}).then(function(){cur=null;leave();showLogin()})}
  /* ---- the forms of the old login page now talk to Firebase ---- */
  window.authGuest=function(){};
  window.authLogout=logout;
  window.authSocial=function(){};
  window.authForgot=function(){var m=$('inEmail').value.trim(),e=$('inErr');e.className='err';
    if(!m){e.textContent='Type your email above first, then press Forgot password.';return}
    if(!auth){e.textContent='No internet.';return}
    FB.sendPasswordResetEmail(auth,m).then(function(){e.className='err ok';e.textContent='Password reset link sent to '+m+'. Check your email (also Spam).'}).catch(function(x){e.textContent=errMsg(x)})};
  window.authSignIn=function(ev){ev.preventDefault();var m=$('inEmail').value.trim().toLowerCase(),p=$('inPass').value,e=$('inErr');e.className='err';
    if(!auth){e.textContent='No internet. Please connect and try again.';return false}
    e.textContent='Please wait...';FB.signInWithEmailAndPassword(auth,m,p).then(function(){e.textContent=''}).catch(function(x){e.textContent=errMsg(x)});return false};
  window.authSignUp=function(ev){ev.preventDefault();var n=$('upName').value.trim(),m=$('upEmail').value.trim().toLowerCase(),p=$('upPass').value,p2=$('upPass2').value,e=$('upErr');e.className='err';
    if(p.length<6){e.textContent='Password must be at least 6 characters.';return false}
    if(p!==p2){e.textContent='Passwords do not match.';return false}
    if(!$('upAgree').checked){e.textContent='Please agree to the Terms & Privacy Policy.';return false}
    if(!auth){e.textContent='No internet. Please connect and try again.';return false}
    e.textContent='Please wait...';ls('ac_name',n);
    FB.createUserWithEmailAndPassword(auth,m,p).then(function(c){return c}).then(function(){e.textContent=''}).catch(function(x){e.textContent=errMsg(x)});return false};
  if(!webview&&auth){[paneIn,paneUp].forEach(function(p){var g=document.createElement('button');g.type='button';g.className='gbtn';g.textContent='Sign in with Google';
    g.onclick=function(){FB.signInWithPopup(auth,new FB.GoogleAuthProvider()).catch(function(x){var e=p.querySelector('.err');if(e)e.textContent=errMsg(x)})};
    var b=p.querySelector('.btn');b.parentNode.insertBefore(g,b.nextSibling)})}
  window.__acRecheck=function(){if(cur&&!busy)handle(cur)};
  window.__acUser=function(){return cur};window.__acDb=function(){return fs?{FB:FB,fs:fs,auth:auth}:null};window.__acBusy=function(){return busy};
  /* ---- start ---- */
  A.classList.remove('hide');showStatus('Please wait...','Checking your internet connection.',[]);
  if(!auth){cached(null)}
  else{
    var first=true;
    FB.onAuthStateChanged(auth,function(u){first=false;handle(u)},function(){cached(null)});
    setTimeout(function(){if(first)cached(auth.currentUser)},9000);
  }
