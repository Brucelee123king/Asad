<script src="fb.js"></script>
<style>
#auth .guest,#auth .orr{display:none!important}
#auth .gbtn{width:100%;margin-top:12px;height:48px;border-radius:16px;font-weight:700;font-size:14.5px;cursor:pointer;color:var(--tx);background:var(--gh);border:1px solid var(--fbd)}
#auth .stb{width:100%;margin-top:10px;height:48px;border-radius:16px;font-weight:700;font-size:14.5px;cursor:pointer;color:var(--tx);background:var(--gh);border:1px solid var(--fbd)}
#auth .mbox{margin:4px 0 6px;text-align:left}#auth .mbox label{display:block;font-size:12.5px;font-weight:600;color:var(--mu);margin:0 0 5px 3px}
#auth .mbox textarea{width:100%;box-sizing:border-box;height:92px;padding:12px 14px;border-radius:16px;border:1px solid var(--fbd);background:var(--fb);color:var(--tx);font-size:15px;font-family:inherit;outline:none;resize:none}
#auth .mbox .cnt{font-size:12.5px;margin:6px 3px 0;color:var(--mu)}#auth .mbox .ok{color:#16a34a;font-weight:600}
#cmFab{position:fixed;right:16px;bottom:18px;z-index:2147482000;width:58px;height:58px;border-radius:50%;border:0;color:#fff;font-size:24px;background:linear-gradient(135deg,#0f766e,#14b8a6);box-shadow:0 8px 22px rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;cursor:pointer}
#cmBox{position:fixed;right:12px;bottom:88px;z-index:2147482500;width:min(350px,calc(100vw - 24px));background:#fff;color:#111827;border-radius:20px;padding:14px;box-sizing:border-box;box-shadow:0 14px 40px rgba(0,0,0,.35)}#cmBox[hidden]{display:none}
#cmBox .cmh{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-bottom:6px}#cmBox .cmh button{background:#eef2ff;border:0;border-radius:12px;padding:5px 11px;font-size:15px;cursor:pointer}
#cmBox .cml{max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:4px 0 8px}#cmBox .cmb{align-self:flex-end;max-width:85%;background:#14b8a6;color:#fff;border-radius:14px 14px 4px 14px;padding:8px 11px;font-size:14px;word-break:break-word;white-space:pre-wrap}#cmBox .cme{font-size:13px;color:#64748b;text-align:center;padding:6px}
#cmBox p{font-size:13px;color:#475569;margin:4px 0 8px}#cmBox textarea{width:100%;box-sizing:border-box;height:78px;border-radius:14px;border:2px solid #14b8a6;padding:9px;font-size:15px;font-family:inherit;resize:none;color:#111827;background:#fff}
#cmBox .cnt{font-size:12px;color:#64748b;margin:5px 2px}#cmBox .cnt.ok{color:#16a34a;font-weight:600}#cmBox .err{font-size:12.5px;color:#dc2626;min-height:15px}
#cmBox .btn{width:100%;height:44px;border:0;border-radius:14px;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(90deg,#7c5cf5,#3a7bf5);cursor:pointer}#cmBox .btn:disabled{opacity:.5}
#auth .stmsg{font-size:14px;line-height:1.5;text-align:center;margin:6px 0 12px;color:var(--tx)}
</style>
<script>
(function(){
  var CFG=__FBCFG__,ADMIN='asadullah75t@gmail.com',EXP=7*864e5,ALLCATS=['o','pma','fa','hk','lc','pg','nv','cn','iv'];
  var $=function(i){return document.getElementById(i)},A=$('auth');if(!A)return;
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
  var FB=window.FB,app=null,auth=null,fs=null,cur=null,busy=false,webview=!!window.AsadApp||/; wv\)/.test(navigator.userAgent);
  try{
    if(FB){app=FB.initializeApp(CFG);auth=FB.getAuth(app);fs=FB.getFirestore(app);
      if(location.hostname==='localhost'&&/[?&]emu=1/.test(location.search)){FB.connectAuthEmulator(auth,'http://127.0.0.1:9099',{disableWarnings:true});FB.connectFirestoreEmulator(fs,'127.0.0.1',8080)}}
  }catch(e){app=null}
  /* ---- screens ---- */
  var wrap=A.querySelector('.wrap'),copy=A.querySelector('.copy');
  var st=document.createElement('div');st.className='pane';st.id='paneSt';st.hidden=true;
  st.innerHTML='<h2 id="stT"></h2><p class="stmsg" id="stP"></p><div class="mbox" id="stMsg" hidden><label for="msgTx">Tell the admin what you need: write the category and which MCQs you want. (3 messages every day)</label><textarea id="msgTx" maxlength="300" placeholder="Example: Hi, I am Ali. Please enable PMA 159 MCQs for me."></textarea><div class="cnt" id="msgCnt"></div></div><div id="stBtns"></div><div class="err" id="stE"></div>';
  wrap.insertBefore(st,copy);
  var paneIn=$('paneIn'),paneUp=$('paneUp');
  function hideAll(){paneIn.hidden=true;paneUp.hidden=true;st.hidden=true}
  function showLogin(){A.classList.remove('hide');hideAll();paneIn.hidden=false;paneIn.classList.remove('out');$('authUser').style.display='none';
    var s=paneIn.querySelector('.sub');if(s)s.textContent='Login with your email. Your account needs approval from the admin.';
    var su=paneUp.querySelector('.sub');if(su)su.textContent='Sign up, verify your email, then wait for the admin to approve you.'}
  function showStatus(title,msg,btns,err){A.classList.remove('hide');hideAll();st.hidden=false;st.classList.remove('out');$('stMsg').hidden=true;$('stT').textContent=title;$('stP').textContent=msg||'';$('stE').textContent=err||'';
    var b=$('stBtns');b.innerHTML='';(btns||[]).forEach(function(x,i){var e=document.createElement('button');e.type='button';e.className=i===0?'btn':'stb';e.textContent=x[0];e.onclick=x[1];b.appendChild(e)})}
  function showUser(name){$('authUserName').textContent='👤 '+(name||'');$('authUser').style.display='flex'}
  function nm(u){return ls('ac_name')||(u&&u.displayName)||(u&&u.email)||''}
  function errMsg(e){var c=(e&&e.code)||'';
    if(/invalid-credential|user-not-found|wrong-password|invalid-login/.test(c))return 'Wrong email or password.';
    if(/email-already-in-use/.test(c))return 'This email already has an account. Please login.';
    if(/weak-password/.test(c))return 'Password is too weak (at least 6 characters).';
    if(/invalid-email/.test(c))return 'This email is not valid.';
    if(/too-many-requests/.test(c))return 'Too many tries. Wait a few minutes and try again.';
    if(/network|unavailable/.test(c))return 'No internet. Please connect and try again.';
    if(/popup-closed|cancelled/.test(c))return 'Sign-in was cancelled.';
    return 'Something went wrong. Please try again.'}
  /* ---- entering the app ---- */
  function getKey(id){return FB.getDoc(FB.doc(fs,'catKeys',id)).then(function(d){if(!d.exists())throw new Error('nokey');return d.data().pw})}
  function enter(user,cats,offline){
    if(!offline)ls('ac_state',JSON.stringify({uid:user&&user.uid,name:nm(user),cats:cats,status:'approved',t:Date.now()}));
    document.documentElement.classList.add('acok');A.classList.add('hide');showUser(nm(user)||'');try{cmSetup(user,(user.email||'').toLowerCase()===ADMIN)}catch(e){}
    return window.__lkSetAllowed(cats,offline||!fs?null:getKey);
  }
  function leave(){try{cmOff()}catch(e){}ls('ac_state',null);if(window.__lkForgetAll)window.__lkForgetAll()}
  function cached(user){
    var s=null;try{s=JSON.parse(ls('ac_state'))}catch(e){}
    if(s&&s.status==='approved'&&(!user||s.uid===user.uid)&&Date.now()-s.t<EXP&&s.t<=Date.now()+864e5)return enter(user,s.cats||[],true);
    A.classList.remove('hide');
    showStatus('Internet needed','Connect to the internet to check your account, then open the app again.',[['Try again',function(){if(cur)handle(cur);else location.reload()}]]);
  }
  function handle(user){
    if(busy)return Promise.resolve();busy=true;cur=user;
    var done=function(){busy=false};
    if(!user){done();leave();showLogin();return Promise.resolve()}
    var email=(user.email||'').toLowerCase();
    var admin=email===ADMIN;
    if(admin&&!user.emailVerified){done();showVerify(user);return Promise.resolve()}
    return FB.getDoc(FB.doc(fs,'users',user.uid)).then(function(d){
      if(admin){done();return enter(user,ALLCATS)}
      if(!d.exists()){return FB.setDoc(FB.doc(fs,'users',user.uid),{email:email,name:nm(user),status:'pending',cats:[],requested:FB.serverTimestamp()}).then(function(){done();leave();showPending(user)})}
      var u=d.data();
      if(u.status==='approved'){done();return enter(user,u.cats||[])}
      done();leave();if(u.status==='blocked')showBlocked();else showPending(user);
    }).catch(function(e){done();var c=(e&&e.code)||'';if(/permission/.test(c)){leave();showStatus('No access','This account cannot use the app. Please contact the admin.',[['Logout',logout]]);return}return cached(user)});
  }
  function showVerify(user){showStatus('Verify your email','We sent a link to '+user.email+'. Open your email, tap the link, then press the button below.',[
    ['I have verified',function(){$('stE').textContent='Checking...';user.reload().then(function(){return auth.currentUser.getIdToken(true)}).then(function(){handle(auth.currentUser)}).catch(function(e){$('stE').textContent=errMsg(e)})}],
    ['Send the link again',function(){FB.sendEmailVerification(user).then(function(){$('stE').textContent='Link sent again. Check your email (also Spam).'}).catch(function(e){$('stE').textContent=errMsg(e)})}],
    ['Logout',logout]])}
  /* ---- messages to the admin: 3 per day (day changes at midnight Pakistan time), also checked by the Firebase rules ---- */
  var MAXM=3,cmUser=null;
  function dayKey(){var d=new Date(Date.now()+5*36e5);return String(d.getUTCFullYear()*10000+(d.getUTCMonth()+1)*100+d.getUTCDate())}
  function dref(uid){return FB.doc(fs,'msgs',uid,'days',dayKey())}
  function msgCount(user){return FB.getDoc(dref(user.uid)).then(function(d){return d.exists()?(d.data().n||0):0}).catch(function(){return 0})}
  function postMsg(user,t){if(window.__sending)return Promise.resolve({n:-1,busy:true});window.__sending=1;return postMsg0(user,t).then(function(r){window.__sending=0;return r},function(e){window.__sending=0;throw e})}
  function postMsg0(user,t){return FB.getDoc(dref(user.uid)).then(function(d){var n=d.exists()?(d.data().n||0):0;if(n>=MAXM)return {n:n,full:true};
    var k=n+1,o={};o.n=k;o['m'+k]=t.slice(0,300);o['t'+k]=FB.serverTimestamp();
    return (n===0?FB.setDoc(dref(user.uid),o):FB.updateDoc(dref(user.uid),o)).then(function(){return {n:k}})})}
  function cntText(n,ok){return (ok?'Message sent. ':'')+'Messages sent today: '+n+' of '+MAXM+(n>=MAXM?'. The limit for today is reached. You can write again tomorrow.':'. You can send '+MAXM+' messages every day.')}
  function showPending(user){
    showStatus('Waiting for approval','Your request is sent to the admin ('+user.email+'). When he approves you, press Check again.',[['Send message',function(){sendMsg(user)}],['Check again',function(){handle(auth.currentUser)}],['Logout',logout]]);
    $('stMsg').hidden=false;$('msgTx').value='';
    msgCount(user).then(function(n){drawCnt(n)})}
  function drawCnt(n,ok){var c=$('msgCnt'),b=$('stBtns').querySelector('button'),full=n>=MAXM;
    c.className='cnt'+(ok?' ok':'');c.textContent=cntText(n,ok);$('msgTx').disabled=full;if(b)b.disabled=full}
  function sendMsg(user){var t=($('msgTx').value||'').trim();if(!t){$('stE').textContent='Please write your message first.';return}
    $('stE').textContent='Sending...';
    postMsg(user,t).then(function(r){if(r.busy)return;if(r.full){drawCnt(r.n);$('stE').textContent='';return}$('msgTx').value='';$('stE').textContent='';drawCnt(r.n,true)}).catch(function(){$('stE').textContent='Could not send. Check your internet and the date and time of your phone, then try again.'})}
  /* ---- round chat icon (bottom right) for approved people and the admin: write to the admin, 3 messages per day ---- */
  var cmAdmin=false,cmOn=false;
  function cmBuild(){if($('cmBox'))return;
    var f=document.createElement('button');f.type='button';f.id='cmFab';f.hidden=true;f.setAttribute('aria-label','Contact admin');f.innerHTML='<i class="fa-solid fa-comments"></i>';document.body.appendChild(f);
    var d=document.createElement('div');d.id='cmBox';d.hidden=true;
    d.innerHTML='<div class="cmh"><b>Contact admin</b><button type="button" id="cmX" aria-label="Close">&#10005;</button></div><div class="cml" id="cmList"></div><p id="cmHelp">Tell the admin what you need: write the category and which MCQs you want.</p><textarea id="cmTx" maxlength="300" placeholder="Example: Please enable Hakeem MCQs for me."></textarea><div class="cnt" id="cmCnt"></div><div class="err" id="cmErr"></div><button type="button" id="cmGo" class="btn">Send message</button>';
    document.body.appendChild(d);
    f.onclick=function(){d.hidden?cmOpen():(d.hidden=true)};$('cmX').onclick=function(){d.hidden=true};
    $('cmGo').onclick=function(){var t=($('cmTx').value||'').trim();if(!cmUser)return;if(!t){$('cmErr').textContent='Please write your message first.';return}
      $('cmErr').textContent='Sending...';postMsg(cmUser,t).then(function(r){if(r.busy)return;$('cmErr').textContent='';if(!r.full)$('cmTx').value='';cmLoad(!r.full)}).catch(function(){$('cmErr').textContent='Could not send. Check your internet and the date and time of your phone, then try again.'})};
    setInterval(function(){var q=false;try{q=typeof quizActive!=='undefined'&&quizActive}catch(e){}f.style.display=(cmOn&&!q&&A.classList.contains('hide'))?'flex':'none';if(q)d.hidden=true},600)}
  function cmLoad(ok){if(cmAdmin||!cmUser)return;FB.getDoc(dref(cmUser.uid)).then(function(x){var v=x.exists()?x.data():{n:0},h='';for(var i=1;i<=(v.n||0);i++)if(v['m'+i])h+='<div class="cmb">'+String(v['m'+i]).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</div>';
      $('cmList').innerHTML=h||'<div class="cme">No message yet today.</div>';$('cmList').scrollTop=1e5;var n=v.n||0,full=n>=MAXM;
      $('cmCnt').className='cnt'+(ok?' ok':'');$('cmCnt').textContent=cntText(n,ok);$('cmTx').disabled=full;$('cmGo').disabled=full}).catch(function(){$('cmCnt').textContent='No internet. Connect to send a message.'})}
  function cmOpen(){cmBuild();$('cmErr').textContent='';$('cmBox').hidden=false;
    if(cmAdmin){$('cmList').innerHTML='<div class="cme">You are the admin. Messages from people appear on your Admin page, inside each person card.</div>';$('cmHelp').hidden=true;$('cmTx').hidden=true;$('cmGo').hidden=true;$('cmCnt').textContent='';return}
    $('cmHelp').hidden=false;$('cmTx').hidden=false;$('cmGo').hidden=false;$('cmCnt').textContent='';cmLoad(false)}
  function cmSetup(user,isAdmin){cmUser=isAdmin?null:user;cmAdmin=!!isAdmin;cmOn=true;try{cmBuild()}catch(e){}}
  function cmOff(){cmOn=false;cmUser=null;var b=$('cmBox'),f=$('cmFab');if(b)b.hidden=true;if(f)f.style.display='none'}
  function showBlocked(){showStatus('Access stopped','Your access was stopped by the admin. Please contact him.',[['Logout',logout]])}
  function logout(){var p=auth?FB.signOut(auth):Promise.resolve();return p.catch(function(){}).then(function(){cur=null;leave();showLogin()})}
  /* ---- the forms of the old login page now talk to Firebase ---- */
  window.authGuest=function(){};
  window.authLogout=logout;
  window.authSocial=function(){};
  window.authForgot=function(){var m=$('inEmail').value.trim(),e=$('inErr');e.className='err';
    if(!m){e.textContent='Type your email above first, then press Forgot password.';return}
    if(!auth){e.textContent='No internet.';return}
    FB.sendPasswordResetEmail(auth,m).then(function(){e.className='err ok';e.textContent='Password reset link sent to '+m+'. Check your email (also Spam).'}).catch(function(x){e.textContent=errMsg(x)})};
  window.authSignIn=function(ev){ev.preventDefault();var m=$('inEmail').value.trim().toLowerCase(),p=$('inPass').value,e=$('inErr');e.className='err';
    if(!auth){e.textContent='No internet. Please connect and try again.';return false}
    e.textContent='Please wait...';FB.signInWithEmailAndPassword(auth,m,p).then(function(){e.textContent=''}).catch(function(x){e.textContent=errMsg(x)});return false};
  window.authSignUp=function(ev){ev.preventDefault();var n=$('upName').value.trim(),m=$('upEmail').value.trim().toLowerCase(),p=$('upPass').value,p2=$('upPass2').value,e=$('upErr');e.className='err';
    if(p.length<6){e.textContent='Password must be at least 6 characters.';return false}
    if(p!==p2){e.textContent='Passwords do not match.';return false}
    if(!$('upAgree').checked){e.textContent='Please agree to the Terms & Privacy Policy.';return false}
    if(!auth){e.textContent='No internet. Please connect and try again.';return false}
    e.textContent='Please wait...';ls('ac_name',n);
    FB.createUserWithEmailAndPassword(auth,m,p).then(function(c){return c}).then(function(){e.textContent=''}).catch(function(x){e.textContent=errMsg(x)});return false};
  if(!webview&&auth){[paneIn,paneUp].forEach(function(p){var g=document.createElement('button');g.type='button';g.className='gbtn';g.textContent='Sign in with Google';
    g.onclick=function(){FB.signInWithPopup(auth,new FB.GoogleAuthProvider()).catch(function(x){var e=p.querySelector('.err');if(e)e.textContent=errMsg(x)})};
    var b=p.querySelector('.btn');b.parentNode.insertBefore(g,b.nextSibling)})}
  window.__acRecheck=function(){if(cur&&!busy)handle(cur)};
  window.__acUser=function(){return cur};window.__acBusy=function(){return busy};
  /* ---- start ---- */
  A.classList.remove('hide');showStatus('Please wait...','Checking your internet connection.',[]);
  if(!auth){cached(null)}
  else{
    var first=true;
    FB.onAuthStateChanged(auth,function(u){first=false;handle(u)},function(){cached(null)});
    setTimeout(function(){if(first)cached(auth.currentUser)},9000);
  }
})();
</script>
