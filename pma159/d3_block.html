<div id="obj3d" aria-hidden="true">
  <div class="o3 cubeW c1"><div class="cube"><i class="f f1"></i><i class="f f2"></i><i class="f f3"></i><i class="f f4"></i><i class="f f5"></i><i class="f f6"></i></div></div>
  <div class="o3 cubeW c2"><div class="cube"><i class="f f1"></i><i class="f f2"></i><i class="f f3"></i><i class="f f4"></i><i class="f f5"></i><i class="f f6"></i></div></div>
  <div class="o3 orbW"><div class="orb"></div></div>
  <div class="o3 ringW"><div class="ring"></div></div>
  <div class="o3 orbW2"><div class="orb orb2"></div></div>
</div>
<style>
/* ======== 3D MIX: floating glass objects, tilt cards, clay buttons ======== */
#obj3d{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;perspective:900px;--gx:0;--gy:0}
.o3{position:absolute;transform:translate3d(calc(var(--gx)*var(--k,20)*1px),calc(var(--gy)*var(--k,20)*1px),0);transition:transform .3s ease-out}
.cubeW{--k:34;width:96px;height:96px;perspective:700px}.cubeW.c1{right:1.5vw;top:56vh}.cubeW.c2{--k:-22;left:1vw;bottom:6vh;width:60px;height:60px}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:spin3d 22s linear infinite}
.c2 .cube{animation-duration:30s;animation-direction:reverse}
.cube .f{position:absolute;inset:0;border:1.5px solid rgba(255,255,255,.75);border-radius:12px;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(170,150,255,.2) 55%,rgba(110,200,255,.25));box-shadow:inset 0 0 22px rgba(255,255,255,.5),0 0 20px rgba(130,110,255,.25)}
.cubeW .f1{transform:translateZ(48px)}.cubeW .f2{transform:rotateY(90deg) translateZ(48px)}.cubeW .f3{transform:rotateY(180deg) translateZ(48px)}.cubeW .f4{transform:rotateY(-90deg) translateZ(48px)}.cubeW .f5{transform:rotateX(90deg) translateZ(48px)}.cubeW .f6{transform:rotateX(-90deg) translateZ(48px)}
.c2 .f1{transform:translateZ(30px)}.c2 .f2{transform:rotateY(90deg) translateZ(30px)}.c2 .f3{transform:rotateY(180deg) translateZ(30px)}.c2 .f4{transform:rotateY(-90deg) translateZ(30px)}.c2 .f5{transform:rotateX(90deg) translateZ(30px)}.c2 .f6{transform:rotateX(-90deg) translateZ(30px)}
@keyframes spin3d{from{transform:rotateX(-24deg) rotateY(0)}to{transform:rotateX(336deg) rotateY(360deg)}}
.orbW{--k:-40;right:-2vw;bottom:4vh;width:120px;height:120px}.orbW2{--k:28;left:-1vw;top:44vh;width:54px;height:54px}
.orb{width:100%;height:100%;border-radius:50%;animation:bob 8s ease-in-out infinite;
 background:radial-gradient(circle at 30% 24%,#fff 0,rgba(255,255,255,.85) 5%,rgba(255,255,255,0) 14%),radial-gradient(circle at 36% 32%,#e3d8ff,#8f6cf5 46%,#3a1f9a 100%);
 box-shadow:inset -14px -18px 34px rgba(20,0,90,.55),inset 8px 8px 18px rgba(255,255,255,.35),0 34px 40px -12px rgba(60,40,170,.45)}
.orb2{background:radial-gradient(circle at 30% 24%,#fff 0,rgba(255,255,255,0) 16%),radial-gradient(circle at 36% 32%,#ffe0f2,#f58fc3 48%,#8f2a78 100%);box-shadow:inset -8px -10px 18px rgba(90,0,60,.5),0 22px 26px -10px rgba(170,40,120,.4);animation-delay:-3s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
.ringW{--k:18;left:calc(50vw - 75px);top:-34px;width:150px;height:150px;opacity:.8}
.ring{width:100%;height:100%;border-radius:50%;background:conic-gradient(#a78bfa,#38bdf8,#f0abfc,#fde68a,#a78bfa);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 16px),#000 calc(100% - 15px));mask:radial-gradient(farthest-side,transparent calc(100% - 16px),#000 calc(100% - 15px));animation:ringSpin 14s linear infinite;filter:drop-shadow(0 8px 12px rgba(100,80,220,.35))}
@keyframes ringSpin{from{transform:rotateX(68deg) rotateZ(0)}to{transform:rotateX(68deg) rotateZ(360deg)}}
html.dark .cube .f{background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(120,100,255,.14) 55%,rgba(60,170,255,.18));border-color:rgba(255,255,255,.4)}
html.dark .ring{filter:drop-shadow(0 0 14px rgba(130,110,255,.6))}
@media (max-width:700px){.cubeW.c1{width:62px;height:62px;right:2vw;top:60vh}.cubeW.c1 .f1{transform:translateZ(31px)}.cubeW.c1 .f2{transform:rotateY(90deg) translateZ(31px)}.cubeW.c1 .f3{transform:rotateY(180deg) translateZ(31px)}.cubeW.c1 .f4{transform:rotateY(-90deg) translateZ(31px)}.cubeW.c1 .f5{transform:rotateX(90deg) translateZ(31px)}.cubeW.c1 .f6{transform:rotateX(-90deg) translateZ(31px)}
 .orbW{width:80px;height:80px;right:5vw}.ringW{width:100px;height:100px;left:calc(50vw - 50px);top:-22px}.cubeW.c2{display:none}}
/* tilt cards */
.tilt3{transition:transform .25s ease-out,box-shadow .3s!important;transform-style:preserve-3d;will-change:transform}
#sec-menu .grid>button:hover,#sec-menu .grid>button.tilting{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-6px) scale(1.025)!important;box-shadow:0 34px 60px -20px rgba(30,20,100,.7),inset 0 2px 2px rgba(255,255,255,.6),inset 0 -14px 28px rgba(0,0,0,.14)!important}
#test-grid>button:hover,#pma-grid>button:hover,#fa-grid>button:hover,#hk-grid>button:hover,.dash .act:hover{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-5px) scale(1.02)}
/* clay / 3D-press buttons */
main button.bg-indigo-600,main button.bg-emerald-600,button[onclick^="confirmSubmitQuiz"],button[onclick^="executeSubmitQuiz"],#resExtra button{
 box-shadow:0 6px 0 rgba(20,15,80,.35),0 16px 26px -8px rgba(70,60,200,.6),inset 0 2px 2px rgba(255,255,255,.6),inset 0 -10px 16px rgba(0,0,0,.14)!important;transition:transform .12s,box-shadow .12s}
main button.bg-indigo-600:active,main button.bg-emerald-600:active,button[onclick^="confirmSubmitQuiz"]:active,#resExtra button:active{transform:translateY(5px)!important;box-shadow:0 1px 0 rgba(20,15,80,.35),0 6px 12px -6px rgba(70,60,200,.6),inset 0 2px 2px rgba(255,255,255,.5)!important}
#options-container>*:active{transform:scale(.985) translateY(2px)!important}
/* neon edge in night mode */
html.dark main .bg-white{border-color:rgba(130,150,255,.28)!important;box-shadow:var(--gl-sh),0 0 0 1px rgba(110,130,255,.08),0 0 34px -6px rgba(90,110,255,.22)!important}
/* embossed 3D headings */
#sec-menu h2,.dash .hi h3{filter:drop-shadow(0 2px 0 rgba(255,255,255,.7)) drop-shadow(0 8px 10px rgba(80,60,200,.22))}
html.dark #sec-menu h2,html.dark .dash .hi h3{filter:drop-shadow(0 0 16px rgba(130,110,255,.35))}
/* depth page-in + staggered cards */
.fade-in{animation:d3In .65s cubic-bezier(.2,.8,.2,1) forwards!important}
@keyframes d3In{from{opacity:0;transform:perspective(1200px) rotateX(9deg) translateY(26px) scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
#sec-menu .grid>button,#test-grid>button,#pma-grid>button,#fa-grid>button,#hk-grid>button,.dash .st,.dash .act{animation:cardIn .6s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes cardIn{from{opacity:0;transform:perspective(800px) translateY(30px) rotateX(-14deg) scale(.96)}to{opacity:1}}
.grid>*:nth-child(2),.dash .st:nth-child(2){animation-delay:.07s}.grid>*:nth-child(3),.dash .st:nth-child(3){animation-delay:.14s}.grid>*:nth-child(4),.dash .st:nth-child(4){animation-delay:.21s}.grid>*:nth-child(5){animation-delay:.28s}.grid>*:nth-child(6){animation-delay:.35s}.grid>*:nth-child(n+7){animation-delay:.4s}
@media (prefers-reduced-motion:reduce){.cube,.orb,.ring{animation:none}}
</style>
<script>
(function(){
  var root=document.getElementById('obj3d');
  function g(x,y){root.style.setProperty('--gx',Math.max(-1,Math.min(1,x)).toFixed(3));root.style.setProperty('--gy',Math.max(-1,Math.min(1,y)).toFixed(3))}
  window.addEventListener('mousemove',function(e){g(e.clientX/innerWidth*2-1,e.clientY/innerHeight*2-1)},{passive:true});
  var b0=null;window.addEventListener('deviceorientation',function(e){if(e.gamma==null)return;if(!b0)b0={b:e.beta,g:e.gamma};g((e.gamma-b0.g)/22,(e.beta-b0.b)/22)},{passive:true});
  var SEL='#sec-menu .grid>button,#test-grid>button,#pma-grid>button,#fa-grid>button,#hk-grid>button,.dash .act';
  var raf=0,px=0,py=0,pt=null;
  document.addEventListener('pointermove',function(e){if(e.pointerType==='touch')return;px=e.clientX;py=e.clientY;pt=e.target;if(raf)return;
    raf=requestAnimationFrame(function(){raf=0;var el=pt&&pt.closest&&pt.closest(SEL);if(!el)return;var r=el.getBoundingClientRect();
      var x=(px-r.left)/r.width-.5,y=(py-r.top)/r.height-.5;el.style.setProperty('--ry',(x*12).toFixed(2)+'deg');el.style.setProperty('--rx',(-y*12).toFixed(2)+'deg')})},{passive:true});
  document.addEventListener('pointerout',function(e){var el=e.target.closest&&e.target.closest(SEL);if(el&&!el.contains(e.relatedTarget)){el.style.setProperty('--rx','0deg');el.style.setProperty('--ry','0deg')}},true);
})();
</script>
