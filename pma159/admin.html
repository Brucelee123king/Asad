<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Asadullah Notes</title>
<style>
:root{--bg:#f1f5f9;--cd:#fff;--tx:#0f172a;--mu:#64748b;--bd:#cbd5e1;--ac:#4f46e5;--ok:#16a34a;--no:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--cd:#141b34;--tx:#e2e8f0;--mu:#94a3b8;--bd:#334155;--ac:#818cf8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,Arial,sans-serif;padding:14px;max-width:640px;margin:auto}
h1{font-size:20px;margin:6px 0 2px}h2{font-size:16px;margin:18px 0 8px}.mu{color:var(--mu);font-size:13px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
button{border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;background:var(--ac);color:#fff}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.r{background:var(--no)}button.k{background:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips label{border:1px solid var(--bd);border-radius:999px;padding:6px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}.pending{background:#fef3c7;color:#92400e}.approved{background:#dcfce7;color:#166534}.blocked{background:#fee2e2;color:#991b1b}
input[type=text],textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--tx);font-size:15px}
textarea{min-height:110px}.badge{background:var(--no);color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;margin-left:6px}
#msg{position:sticky;top:6px;z-index:5}.msg{border-radius:10px;padding:10px;font-size:14px;font-weight:600;background:#0f172a;color:#fff;margin:6px 0}
</style></head><body>
<h1>Asadullah Notes: Admin</h1><div class="mu" id="who">Not signed in</div><div id="msg"></div>
<div id="login" class="card"><p>Sign in with the admin Google account.</p><div class="row"><button id="gbtn">Sign in with Google</button></div>
<div id="emuForm" style="display:none"><p class="mu">Test mode</p><input type="text" id="emuE" placeholder="email"><input type="text" id="emuP" placeholder="password" style="margin-top:6px"><div class="row"><button id="emuB">Test login</button></div></div></div>
<div id="app" style="display:none">
 <div class="row"><button id="tReq">Requests<span class="badge" id="nReq">0</span></button><button class="g" id="tUsr">People<span class="badge" id="nUsr">0</span></button><button class="g" id="tKey">Passwords</button><button class="g" id="bOut">Logout</button><button class="g" id="bRef">Refresh</button></div>
 <div id="pReq"></div><div id="pUsr" style="display:none"></div>
 <div id="pKey" style="display:none">
  <h2>Category passwords</h2><div class="mu">These passwords unlock the data files. The app gets them from here for approved people; nobody types them. Paste the whole list once, or change one password after I tell you a new one.</div>
  <div class="card"><textarea id="paste" placeholder="Paste the password list here (the text file I sent you)"></textarea><div class="row"><button id="bFill">Fill the boxes</button></div></div>
  <div id="keyBoxes"></div><div class="row"><button class="k" id="bSaveKeys">Save all passwords</button></div>
 </div>
</div>
<script src="fb.js"></script>
<script>
(function(){
var ADMIN='asadullah75t@gmail.com',CFG=__FBCFG__;
var CATS=[['o','1000 MCQs'],['pma','PMA 159'],['fa','Forces Academy'],['hk','Hakeem'],['lc','PMA 158'],['pg','Pro Genius'],['nv','Non Verbal']];
var $=function(i){return document.getElementById(i)},FB=window.FB,app=FB.initializeApp(CFG),auth=FB.getAuth(app),fs=FB.getFirestore(app);
var emu=location.hostname==='localhost'&&/[?&]emu=1/.test(location.search);
if(emu){FB.connectAuthEmulator(auth,'http://127.0.0.1:9099',{disableWarnings:true});FB.connectFirestoreEmulator(fs,'127.0.0.1',8080);$('emuForm').style.display='block'}
function say(m,bad){var d=document.createElement('div');d.className='msg';if(bad)d.style.background='#991b1b';d.textContent=m;$('msg').innerHTML='';$('msg').appendChild(d);setTimeout(function(){if(d.parentNode)d.remove()},6000)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tab(t){['Req','Usr','Key'].forEach(function(x){$('p'+x).style.display=x===t?'block':'none';$('t'+x).className=x===t?'':'g'})}
$('tReq').onclick=function(){tab('Req')};$('tUsr').onclick=function(){tab('Usr')};$('tKey').onclick=function(){tab('Key');loadKeys()};
$('gbtn').onclick=function(){FB.signInWithPopup(auth,new FB.GoogleAuthProvider()).catch(function(e){say('Sign-in failed: '+(e.code||e.message),1)})};
$('emuB').onclick=function(){FB.signInWithEmailAndPassword(auth,$('emuE').value,$('emuP').value).catch(function(e){say('Test login failed: '+e.code,1)})};
$('bOut').onclick=function(){FB.signOut(auth)};$('bRef').onclick=function(){load()};
FB.onAuthStateChanged(auth,function(u){
  if(!u){$('who').textContent='Not signed in';$('login').style.display='block';$('app').style.display='none';return}
  var ok=(u.email||'').toLowerCase()===ADMIN&&u.emailVerified;
  $('who').textContent=u.email+(ok?' (admin)':' - NOT the admin account');
  if(!ok){$('login').style.display='block';$('app').style.display='none';say('This account is not the admin. Logout and use '+ADMIN,1);return}
  $('login').style.display='none';$('app').style.display='block';load()});
var USERS=[];
function load(){return FB.getDocs(FB.collection(fs,'users')).then(function(s){USERS=[];s.forEach(function(d){var x=d.data();x.id=d.id;USERS.push(x)});draw()}).catch(function(e){say('Could not load: '+(e.code||e.message),1)})}
function ts(x){try{return x.requested.toDate().toLocaleString()}catch(e){return ''}}
function chips(u){return '<div class="chips">'+CATS.map(function(c){return '<label><input type="checkbox" data-c="'+c[0]+'"'+((u.cats||[]).indexOf(c[0])>-1?' checked':'')+'> '+c[1]+'</label>'}).join('')+'</div>'}
function card(u){return '<div class="card" data-id="'+u.id+'"><b>'+esc(u.email)+'</b> <span class="tag '+u.status+'">'+u.status+'</span><div class="mu">'+esc(u.name||'')+' '+esc(ts(u))+'</div>'+chips(u)+
 '<div class="row"><button class="k" data-a="ok">'+(u.status==='approved'?'Save':'Approve')+'</button>'+(u.status==='blocked'?'':'<button class="r" data-a="block">Block</button>')+'<button class="g" data-a="del">Delete</button></div></div>'}
function draw(){
  var p=USERS.filter(function(u){return u.status==='pending'}),o=USERS.filter(function(u){return u.status!=='pending'});
  $('nReq').textContent=p.length;$('nUsr').textContent=o.length;
  $('pReq').innerHTML='<h2>People waiting for approval</h2>'+(p.length?p.map(card).join(''):'<div class="mu">Nobody is waiting.</div>');
  $('pUsr').innerHTML='<h2>Approved and blocked people</h2>'+(o.length?o.map(card).join(''):'<div class="mu">No one yet.</div>')}
document.addEventListener('click',function(e){var b=e.target.closest('button[data-a]');if(!b)return;var c=b.closest('.card'),id=c.getAttribute('data-id'),a=b.getAttribute('data-a');
  var cats=[].slice.call(c.querySelectorAll('input[data-c]')).filter(function(i){return i.checked}).map(function(i){return i.getAttribute('data-c')});
  var ref=FB.doc(fs,'users',id),job;
  if(a==='ok'){if(!cats.length&&!confirm('No category ticked. Approve anyway? (He will see nothing)'))return;job=FB.updateDoc(ref,{status:'approved',cats:cats})}
  else if(a==='block'){if(!confirm('Block this person?'))return;job=FB.updateDoc(ref,{status:'blocked',cats:[]})}
  else if(a==='del'){if(!confirm('Delete this person completely? He can ask again.'))return;job=FB.deleteDoc(ref)}
  job.then(function(){say(a==='ok'?'Saved. This person is in the People tab: open it any time to tick or untick categories.':'Done');return load()}).catch(function(x){say('Failed: '+(x.code||x.message),1)})});
function keyBoxes(vals){$('keyBoxes').innerHTML=CATS.map(function(c){return '<div class="card"><b>'+c[1]+'</b><input type="text" id="k_'+c[0]+'" autocomplete="off" autocapitalize="characters" value="'+esc(vals[c[0]]||'')+'" placeholder="XXXX-XXXX"></div>'}).join('')}
function loadKeys(){var vals={};Promise.all(CATS.map(function(c){return FB.getDoc(FB.doc(fs,'catKeys',c[0])).then(function(d){if(d.exists())vals[c[0]]=d.data().pw}).catch(function(){})})).then(function(){keyBoxes(vals)})}
$('bFill').onclick=function(){var t=$('paste').value,vals={};var map={o:/1000\s*MCQs/i,pma:/PMA\s*159/i,fa:/Forces\s*Academy/i,hk:/Hakeem/i,lc:/PMA\s*158/i,pg:/Pro\s*Genius/i,nv:/Non\s*Verbal/i};
  t.split(/\n/).forEach(function(l){var m=/([A-Z0-9]{4}-[A-Z0-9]{4})\s*$/i.exec(l.trim());if(!m)return;for(var k of ['pg','nv','o','pma','fa','hk','lc']){if(map[k].test(l)){vals[k]=m[1].toUpperCase();break}}});
  keyBoxes(vals);say('Filled '+Object.keys(vals).length+' of 7. Check them, then press Save all passwords.')};
$('bSaveKeys').onclick=function(){var jobs=[],n=0;CATS.forEach(function(c){var el=$('k_'+c[0]);if(!el)return;var v=el.value.trim().toUpperCase();if(!v)return;n++;jobs.push(FB.setDoc(FB.doc(fs,'catKeys',c[0]),{pw:v}))});
  if(!n){say('Nothing to save',1);return}Promise.all(jobs).then(function(){say('Saved '+n+' passwords')}).catch(function(x){say('Failed: '+(x.code||x.message),1)})};
keyBoxes({});
})();
</script></body></html>
