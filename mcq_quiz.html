<title>Initial Test MCQ Drill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: single centered column, one question at a time, section chips on top, progress bar below. */
:root{--bg:#f3f5f2;--fg:#17201c;--mut:#5d6b64;--card:#fff;--line:#d5dcd7;--accent:#1f5e46;--accent-fg:#fff;--ok:#1e7a46;--okbg:#dff3e6;--bad:#b3261e;--badbg:#fbe3e0;
--display:"Newsreader",Georgia,serif;--body:"IBM Plex Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111815;--fg:#e8eeea;--mut:#9aa9a1;--card:#1a2420;--line:#2c3a34;--accent:#6cc79b;--accent-fg:#0d1511;--ok:#7fdca5;--okbg:#17382a;--bad:#ff9a90;--badbg:#412220;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111815;--fg:#e8eeea;--mut:#9aa9a1;--card:#1a2420;--line:#2c3a34;--accent:#6cc79b;--accent-fg:#0d1511;--ok:#7fdca5;--okbg:#17382a;--bad:#ff9a90;--badbg:#412220;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:700 30px/1.1 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--mut);margin:4px 0 0;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 12px;font-size:13px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px}
.q{font:500 24px/1.3 var(--display);margin:0;text-wrap:balance}
.q em{font-style:italic;color:var(--accent)}
.opts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:left;display:flex;gap:12px;align-items:baseline;background:transparent;border:1px solid var(--line);border-radius:8px;padding:11px 14px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt b{font:600 13px var(--body);color:var(--mut);text-transform:uppercase;min-width:1.2em}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.nav{display:flex;gap:8px;justify-content:space-between}
.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:9px 16px;font-weight:500}
.btn.main{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.res{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.score{font:700 64px/1 var(--display);font-variant-numeric:tabular-nums}
.miss{text-align:left;width:100%;display:grid;gap:6px;font-size:14px}
.miss div{border-top:1px solid var(--line);padding-top:6px}
.tools{display:flex;gap:8px;justify-content:space-between;align-items:center}
.link{background:none;border:0;color:var(--mut);font-size:13px;text-decoration:underline;padding:4px}
.tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tab{flex:1;background:transparent;border:0;padding:10px 4px;font-weight:600;font-size:14px}
.tab[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.figrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;font-family:var(--body)}
.fig{width:72px;height:72px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;color:var(--fg)}
.fig.qm{font:700 28px var(--display);color:var(--accent);border-style:dashed}
.opt svg{display:block;color:var(--fg)}
.opt.fo{justify-content:center}
.why{border-radius:8px;padding:12px 14px;font-size:15px;line-height:1.5}
.why p{margin:4px 0 0}
.why.ok{background:var(--okbg);border:1px solid var(--ok)}
.why.bad{background:var(--badbg);border:1px solid var(--bad)}
.why svg{display:inline-block;vertical-align:middle;width:28px;height:28px}
</style>
<main>

</main>

Weak", "Hard", "Tough"], "a": 1, "e": "The opposite of “Strong” is “Weak”."}, {"n": 38, "s": "Antonyms", "q": "Antonym of *Honest*:", "o": ["Truthful", "Dishonest", "Loyal", "Fair"], "a": 1, "e": "The opposite of “Honest” is “Dishonest”."}, {"n": 39, "s": "Antonyms", "q": "Antonym of *Increase*:", "o": ["Rise", "Decrease", "Grow", "Add"], "a": 1, "e": "The opposite of “Increase” is “Decrease”."}, {"n": 40, "s": "Antonyms", "q": "Antonym of *Permanent*:", "o": ["Lasting", "Temporary", "Fixed", "Stable"], "a": 1, "e": "The opposite of “Permanent” is “Temporary”."}, {"n": 41, "s": "Antonyms", "q": "Antonym of *Rapid*:", "o": ["Quick", "Slow", "Fast", "Sudden"], "a": 1, "e": "The opposite of “Rapid” is “Slow”."}, {"n": 42, "s": "Antonyms", "q": "Antonym of *Pleasure*:", "o": ["Joy", "Pain", "Fun", "Delight"], "a": 1, "e": "The opposite of “Pleasure” is “Pain”."}, {"n": 43, "s": "Antonyms", "q": "Antonym of *Success*:", "o": ["Failure", "Win", "Fame", "Luck"], "a": 0, "e": "The opposite of “Success” is “Failure”."}, {"n": 44, "s": "Antonyms", "q": "Antonym of *Cruel*:", "o": ["Harsh", "Kind", "Rude", "Angry"], "a": 1, "e": "The opposite of “Cruel” is “Kind”."}, {"n": 45, "s": "Antonyms", "q": "Antonym of *Transparent*:", "o": ["Clear", "Opaque", "Thin", "Bright"], "a": 1, "e": "The opposite of “Transparent” is “Opaque”."}, {"n": 46, "s": "Antonyms", "q": "Antonym of *Wisdom*:", "o": ["Knowledge", "Folly", "Skill", "Truth"], "a": 1, "e": "The opposite of “Wisdom” is “Folly”."}, {"n": 47, "s": "Antonyms", "q": "Antonym of *Vague*:", "o": ["Unclear", "Clear", "Dull", "Dark"], "a": 1, "e": "The opposite of “Vague” is “Clear”."}, {"n": 48, "s": "Antonyms", "q": "Antonym of *Humble*:", "o": ["Modest", "Arrogant", "Poor", "Shy"], "a": 1, "e": "The opposite of “Humble” is “Arrogant”."}, {"n": 49, "s": "Antonyms", "q": "Antonym of *Scarce*:", "o": ["Rare", "Plentiful", "Little", "Few"], "a": 1, "e": "The opposite of “Scarce” is “Plentiful”."}, {"n": 50, "s": "Antonyms", "q": "Antonym of *Encourage*:", "o": ["Support", "Discourage", "Help", "Praise"], "a": 1, "e": "The opposite of “Encourage” is “Discourage”."}, {"n": 51, "s": "Analogies", "q": "Doctor : Hospital :: Teacher : ?", "o": ["Book", "School", "Student", "Pen"], "a": 1, "e": "A doctor works in a hospital; a teacher works in a school."}, {"n": 52, "s": "Analogies", "q": "Bird : Nest :: Lion : ?", "o": ["Den", "Cage", "Jungle", "Tree"], "a": 0, "e": "A bird lives in a nest; a lion lives in a den."}, {"n": 53, "s": "Analogies", "q": "Pen : Write :: Knife : ?", "o": ["Sharp", "Cut", "Steel", "Kitchen"], "a": 1, "e": "A pen is used to write; a knife is used to cut."}, {"n": 54, "s": "Analogies", "q": "Hot : Cold :: Day : ?", "o": ["Sun", "Night", "Morning", "Light"], "a": 1, "e": "Hot and cold are opposites; day and night are opposites."}, {"n": 55, "s": "Analogies", "q": "Eye : See :: Ear : ?", "o": ["Hear", "Sound", "Listen", "Music"], "a": 0, "e": "The eye is for seeing; the ear is for hearing."}, {"n": 56, "s": "Analogies", "q": "Fish : Water :: Bird : ?", "o": ["Nest", "Air", "Tree", "Sky only"], "a": 1, "e": "Fish live in water; birds live and move in air."}, {"n": 57, "s": "Analogies", "q": "Author : Book :: Poet : ?", "o": ["Poem", "Song", "Story", "Verse writer"], "a": 0, "e": "An author writes a book; a poet writes a poem."}, {"n": 58, "s": "Analogies", "q": "Soldier : Army :: Sailor : ?", "o": ["Air Force", "Navy", "Police", "Ship"], "a": 1, "e": "A soldier serves in the army; a sailor serves in the navy."}, {"n": 59, "s": "Analogies", "q": "Finger : Hand :: Toe : ?", "o": ["Leg", "Foot", "Knee", "Shoe"], "a": 1, "e": "A finger is part of the hand; a toe is part of the foot."}, {"n": 60, "s": "Analogies", "q": "Cow : Calf :: Dog : ?", "o": ["Cub", "Puppy", "Kitten", "Foal"], "a": 1, "e": "A calf is a young cow; a puppy is a young dog."}, {"n": 61, "s": "Analogies", "q": "Kilometre : Distance :: Kilogram : ?", "o": ["Length", "Weight", "Time", "Volume"], "a": 1, "e": "A kilome , "e": "“Incorrigible” is the single word for “one who cannot be corrected”."}, {"n": 91, "s": "One-Word Substitution", "q": "One who cannot read or write:", "o": ["Illiterate", "Ignorant", "Innocent", "Idiot"], "a": 0, "e": "“Illiterate” is the single word for “one who cannot read or write”."}, {"n": 92, "s": "One-Word Substitution", "q": "Fear of closed spaces:", "o": ["Hydrophobia", "Claustrophobia", "Acrophobia", "Xenophobia"], "a": 1, "e": "“Claustrophobia” is the single word for “fear of closed spaces”."}, {"n": 93, "s": "One-Word Substitution", "q": "Rule by one person with absolute power:", "o": ["Democracy", "Autocracy", "Bureaucracy", "Oligarchy"], "a": 1, "e": "“Autocracy” is the single word for “rule by one person with absolute power”."}, {"n": 94, "s": "One-Word Substitution", "q": "One who walks in sleep:", "o": ["Insomniac", "Somnambulist", "Narcissist", "Pedestrian"], "a": 1, "e": "“Somnambulist” is the single word for “one who walks in sleep”."}, {"n": 95, "s": "One-Word Substitution", "q": "Life story written by oneself:", "o": ["Biography", "Autobiography", "Diary", "Memoir of others"], "a": 1, "e": "“Autobiography” is the single word for “life story written by oneself”."}, {"n": 96, "s": "English Usage", "q": "He is ___ honest man.", "o": ["a", "an", "the", "no article"], "a": 1, "e": "“Honest” starts with a vowel sound (the h is silent), so we use “an”."}, {"n": 97, "s": "English Usage", "q": "She ___ to school every day.", "o": ["go", "goes", "going", "gone"], "a": 1, "e": "The subject “She” is singular, so the present simple verb takes -s: goes."}, {"n": 98, "s": "English Usage", "q": "Choose the correct spelling.", "o": ["Neccessary", "Necessary", "Necesary", "Neccesary"], "a": 1, "e": "The correct spelling is “Necessary”: one c and two s."}, {"n": 99, "s": "English Usage", "q": "Choose the correct spelling.", "o": ["Acommodation", "Accomodation", "Accommodation", "Acomodation"], "a": 2, "e": "“Accommodation” has a double c and a double m."}, {"n": 100, "s": "English Usage", "q": "Neither of the boys ___ present.", "o": ["were", "was", "are", "have been"], "a": 1, "e": "“Neither” takes a singular verb, so the correct form is “was”."}], "Non-verbal": [{"s": "Number Series", "q": "Find the next number: 2, 4, 8, 16, ?", "o": ["29", "32", "35", "36"], "a": 1, "n": 1, "e": "Each term doubles: 16 × 2 = 32."}, {"s": "Number Series", "q": "Find the next number: 3, 6, 12, 24, ?", "o": ["46", "50", "45", "48"], "a": 3, "n": 2, "e": "Each term doubles: 24 × 2 = 48."}, {"s": "Number Series", "q": "Find the next number: 5, 10, 15, 20, ?", "o": ["24", "27", "25", "22"], "a": 2, "n": 3, "e": "Add 5 each time: 20 + 5 = 25."}, {"s": "Number Series", "q": "Find the next number: 1, 4, 9, 16, ?", "o": ["22", "23", "29", "25"], "a": 3, "n": 4, "e": "These are squares 1², 2², 3², 4². Next is 5² = 25."}, {"s": "Number Series", "q": "Find the next number: 2, 6, 12, 20, 30, ?", "o": ["46", "44", "42", "40"], "a": 2, "n": 5, "e": "The gaps are 4, 6, 8, 10 and grow by 2. The next gap is 12: 30 + 12 = 42."}, {"s": "Number Series", "q": "Find the next number: 1, 3, 6, 10, 15, ?", "o": ["21", "19", "18", "23"], "a": 0, "n": 6, "e": "The gaps are 2, 3, 4, 5. The next gap is 6: 15 + 6 = 21."}, {"s": "Number Series", "q": "Find the next number: 100, 90, 80, 70, ?", "o": ["57", "58", "61", "60"], "a": 3, "n": 7, "e": "Subtract 10 each time: 70 − 10 = 60."}, {"s": "Number Series", "q": "Find the next number: 2, 5, 10, 17, 26, ?", "o": ["36", "41", "38", "37"], "a": 3, "n": 8, "e": "Each term is n² + 1 (1²+1, 2²+1 ...). Next is 6² + 1 = 37."}, {"s": "Number Series", "q": "Find the next number: 1, 8, 27, 64, ?", "o": ["128", "122", "126", "125"], "a": 3, "n": 9, "e": "These are cubes 1³, 2³, 3³, 4³. Next is 5³ = 125."}, {"s": "Number Series", "q": "Find the next number: 3, 5, 9, 17, 33, ?", "o": ["64", "66", "68", "65"], "a": 3, "n": 10, "e": "Each term is double the previous minus 1: 33 × 2 − 1 = 65."}, {"s": "Number Series", "q": "Find the next number: 1, 2, 6, 24, 120, ?", "o": ["720", "719", "724", "722"], "a": 0, "n": 11, "e": "Multiply by 2, 3, 4, 5 in turn. Next is ×6: 120 × 6 = 720."}, {"s": "Number Series", "q": "Find the next number: 4, 7, 12, 19, 28, ?", "o": ["42", "38", "43", "39"], "a": 3, "n": 12, "e": "The gaps are 3, 5, 7, 9. The next gap is 11: 28 + 11 = 39."}, {"s": "Number Series", "q": "Find the next number: 1, 1, 2, 3, 5, 8, ?", "o": ["14", "10", "13", "11"], "a": 2, "n": 13, "e": "Fibonacci series: each term is the sum of the previous two. 5 + 8 = 13."}, {"s": "Number Series", "q": "Find the next number: 2, 3, 5, 7, 11, ?", "o": ["13", "10", "14", "12"], "a": 0, "n": 14, "e": "These are prime numbers. The prime after 11 is 13."}, {"s": "Number Series", "q": "Find the next number: 81, 27, 9, 3, ?", "o": ["2", "5", "1", "4"], "a": 2, "n": 15, "e": "Divide by 3 each time: 3 ÷ 3 = 1."}, {"s": "Number Series", "q": "Find the next number: 5, 11, 23, 47, ?", "o": ["97", "95", "99", "98"], "a": 1, "n": 16, "e": "Each term is double the previous plus 1: 47 × 2 + 1 = 95."}, {"s": "Number Series", "q": "Find the next number: 7, 14, 28, 56, ?", "o": ["109", "112", "116", "113"], "a": 1, "n": 17, "e": "Each term doubles: 56 × 2 = 112."}, {"s": "Number Series", "q": "Find the next number: 0, 3, 8, 15, 24, ?", "o": ["37", "36", "35", "34"], "a": 2, "n": 18, "e": "Each term is n² − 1 (1²−1 = 0, 2²−1 = 3 ...). Next is 6² − 1 = 35."}, {"s": "Number Series", "q": "Find the next number: 1, 2, 4, 7, 11, 16, ?", "o": ["26", "24", "22", "25"], "a": 2, "n": 19, "e": "The gaps are 1, 2, 3, 4, 5. The next gap is 6: 16 + 6 = 22."}, {"s": "Number Series", "q": "Find the next number: 64, 32, 16, 8, ?", "o": ["8", "2", "3", "4"], "a": 3, "n": 20, "e": "Halve each time: 8 ÷ 2 = 4."}, {"s": "Number Series", "q": "Find the next number: 11, 13, 17, 19, 23, ?", "o": ["29", "31", "33", "26"], "a": 0, "n": 21, "e": "These are consecutive primes. The prime after 23 is 29."}, {"s": "Number Series", "q": "Find the next number: 12, 15, 19, 24, 30, ?", "o": ["39", "37", "40", "36"], "a": 1, "n": 22, "e": "The gaps are 3, 4, 5, 6. The next gap is 7: 30 + 7 = 37."}, {"s": "Number Series", "q": "Find the next number: 2, 4, 7, 11, 16, ?", "o": ["19", "20", "26", "22"], "a": 3, "n": 23, "e": "The gaps are 2, 3, 4, 5. The next gap is 6: 16 + 6 = 22."}, {"s": "Number Series", "q": "Find the next number: 1000, 500, 250, ?", "o": ["127", "123", "129", "125"], "a": 3, "n": 24, "e": "Halve each time: 250 ÷ 2 = 125."}, {"s": "Letter Series", "q": "Complete the series: A, C, E, G, ?", "o": ["K", "H", "I", "J"], "a": 2, "n": 25, "e": "Each letter moves 2 places forward: A, C, E, G, I."}, {"s": "Letter Series", "q": "Complete the series: B, D, G, K, ?", "o": ["P", "Q", "N", "O"], "a": 0, "n": 26, "e": "The gaps are +2, +3, +4, so the next is +5: K + 5 = P."}, {"s": "Letter Series", "q": "Complete the series: Z, X, V, T, ?", "o": ["P", "R", "Q", "S"], "a": 1, "n": 27, "e": "Each letter moves 2 places back: Z, X, V, T, R."}, {"s": "Letter Series", "q": "Complete the series: A, Z, B, Y, C, ?", "o": ["D", "X", "Z", "W"], "a": 1, "n": 28, "e": "Two series are mixed: A, B, C going forward and Z, Y, X going backward. Next is X."}, {"s": "Letter Series", "q": "Complete the series: AB, CD, EF, ?", "o": ["GH", "GI", "HI", "FG"], "a": 0, "n": 29, "e": "The pairs are consecutive letters: AB, CD, EF, then GH."}, {"s": "Letter Series", "q": "Complete the series: ACE, BDF, CEG, ?", "o": ["DGH", "DFH", "DEF", "EGI"], "a": 1, "n": 30, "e": "Each group moves one letter forward: ACE, BDF, CEG, then DFH."}, {"s": "Letter Series", "q": "Complete the series: AZ, BY, CX, ?", "o": ["CW", "EW", "DV", "DW"], "a": 3, "n": 31, "e": "The first letter moves forward (A, B, C, D) and the second moves backward (Z, Y, X, W): DW."}, {"s": "Letter Series", "q": "Complete the series: J, K, M, P, ?", "o": ["R", "S", "T", "U"], "a": 2, "n": 32, "e": "The gaps are +1, +2, +3, so the next is +4: P + 4 = T."}, {"s": "Odd One Out", "q": "Find the odd number out: 2, 3, 5, 9, 11", "o": ["9", "2", "5", "11"], "a": 0, "n": 33, "e": "2, 3, 5 and 11 are prime numbers. 9 is not prime (3 × 3)."}, {"s": "Odd One Out", "q": "Find the odd number out: 4, 9, 16, 20, 25", "o": ["9", "25", "20", "16"], "a": 2, "n": 34, "e": "4, 9, 16 and 25 are perfect squares. 20 is not."}, {"s": "Odd One Out", "q": "Find the odd number out: 8, 27, 64, 100, 125", "o": ["27", "8", "64", "100"], "a": 3, "n": 35, "e": "8, 27, 64 and 125 are perfect cubes. 100 is not."}, {"s": "Odd One Out", "q": "Find the odd number out: 11, 13, 17, 21, 23", "o": ["17", "21", "23", "11"], "a": 1, "n": 36, "e": "11, 13, 17 and 23 are prime. 21 = 3 × 7 is not."}, {"s": "Odd One Out", "q": "Find the odd number out: 12, 24, 36, 50, 60", "o": ["12", "50", "36", "60"], "a": 1, "n": 37, "e": "12, 24, 36 and 60 are multiples of 12. 50 is not."}, {"s": "Odd One Out", "q": "Find the odd number out: 3, 6, 9, 14, 15", "o": ["14", "3", "9", "15"], "a": 0, "n": 38, "e": "3, 6, 9 and 15 are multiples of 3. 14 is not."}, {"s": "Coding-Decoding", "q": "If CAT is coded as DBU, how is DOG coded?", "o": ["ENH", "CPH", "EPG", "EPH"], "a": 3, "n": 39, "e": "Each letter moves one place forward: C→D, A→B, T→U. So D→E, O→P, G→H gives EPH."}, {"s": "Coding-Decoding", "q": "If PAKISTAN is coded as QBLJTUBO, how is NAVY coded?", "o": ["MZUX", "OBWZ", "OBXZ", "NBWZ"], "a": 1, "n": 40, "e": "Each letter moves one place forward: N→O, A→B, V→W, Y→Z gives OBWZ."}, {"s": "Coding-Decoding", "q": "If A=1, B=2, C=3, what is the code for CAB?", "o": ["321", "132", "312", "231"], "a": 2, "n": 41, "e": "With A=1, B=2, C=3, the word C-A-B is 3-1-2, so the code is 312."}, {"s": "Coding-Decoding", "q": "If MONDAY is coded as NPOEBZ, how is FRIDAY coded?", "o": ["GRJEBZ", "GSIEBZ", "GSJEBZ", "ESHCZX"], "a": 2, "n": 42, "e": "Each letter moves one place forward: F→G, R→S, I→J, D→E, A→B, Y→Z gives GSJEBZ."}, {"s": "Coding-Decoding", "q": "If BOOK is coded as KOOB, how is ARMY coded?", "o": ["MYAR", "YMRA", "YRMA", "AYMR"], "a": 1, "n": 43, "e": "The word is written backwards: ARMY becomes YMRA."}, {"s": "Coding-Decoding", "q": "If TABLE is coded as 20-1-2-12-5, how is CHAIR coded?", "o": ["2-8-1-9-18", "3-7-1-9-18", "3-8-1-9-18", "3-8-1-9-17"], "a": 2, "n": 44, "e": "Each letter is replaced by its position: C=3, H=8, A=1, I=9, R=18."}, {"s": "Coding-Decoding", "q": "If DOG is coded as 26 (4+15+7), how is CAT coded?", "o": ["25", "23", "26", "24"], "a": 3, "n": 45, "e": "Add the letter positions: C(3) + A(1) + T(20) = 24."}, {"s": "Coding-Decoding", "q": "If FIRE is coded as HKTG, how is WATER coded?", "o": ["YCVGT", "UYRCP", "YCVHT", "XBUFS"], "a": 0, "n": 46, "e": "Each letter moves two places forward: W→Y, A→C, T→V, E→G, R→T gives YCVGT."}, {"s": "Direction Sense", "q": "A man walks 5 km north, turns right and walks 3 km, then turns right again and walks 5 km. How far is he from the start?", "o": ["5 km", "13 km", "3 km", "8 km"], "a": 2, "n": 47, "e": "He ends up 3 km east of the start: 5 km north, 3 km east, then 5 km south cancels the north walk. Distance = 3 km."}, {"s": "Direction Sense", "q": "A man facing east turns left. Which direction does he face now?", "o": ["South", "West", "East", "North"], "a": 3, "n": 48, "e": "Facing east, a left turn points him north."}, {"s": "Direction Sense", "q": "A man facing west turns left. Which direction does he face now?", "o": ["East", "South", "West", "North"], "a": 1, "n": 49, "e": "Facing west, a left turn points him south."}, {"s": "Direction Sense", "q": "A man facing south turns left. Which direction does he face now?", "o": ["North", "South", "East", "West"], "a": 2, "n": 50, "e": "Facing south, a left turn points him east."}, {"s": "Direction Sense", "q": "A man walks 4 km east and then 3 km north. How far is he from the start?", "o": ["6 km", "5 km", "4 km", "7 km"], "a": 1, "n": 51, "e": "The path forms a right triangle with sides 3 and 4, so the distance is the hypotenuse: √(9 + 16) = 5 km."}, {
